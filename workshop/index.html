<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SCINTILLA · Workshop</title>
<style>
:root{ --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --line3:#34344c;
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --ink4:#6A6C86; --crk:#00D4FF; --bull:#00FFA3; --sv3:#FFE500;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; }
*{ box-sizing:border-box; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--mono); }
body{ padding:24px 28px 60px; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
header{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; border-bottom:1px solid var(--line2); padding-bottom:12px; margin-bottom:14px; }
h1{ margin:0; font-size:21px; letter-spacing:.32em; font-weight:600; }
h1 span{ color:var(--crk); }
.sub{ color:var(--ink3); font-size:13px; }
.views{ display:flex; gap:6px; margin-left:auto; }
.views button{ background:var(--panel2); color:var(--ink3); border:1px solid var(--line2); border-radius:3px; font:600 11px/1 var(--mono); letter-spacing:.14em; padding:8px 11px; cursor:pointer; }
.views button.on{ color:var(--ink); border-color:var(--crk); }
.rail{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:0 0 18px; font-size:12px; }
.rail .k{ color:var(--ink4); letter-spacing:.16em; font-size:11px; margin-right:2px; }
.chip{ display:inline-flex; gap:7px; align-items:center; border:1px solid var(--line2); border-radius:999px; padding:3px 10px 3px 8px; color:var(--ink2); text-decoration:none; }
.chip:hover{ border-color:var(--ink3); }
.chip.ask{ border-color:rgba(255,229,0,.45); }
.chip.ask b{ color:var(--sv3); font-weight:600; letter-spacing:.06em; font-size:11px; }
.chip.new b{ color:var(--crk); font-weight:600; letter-spacing:.06em; font-size:11px; }

/* the branch map */
.map{ position:relative; display:grid; grid-template-columns:minmax(0,1fr) 250px minmax(0,1fr); gap:0 54px; align-items:start; }
.map svg{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
.side{ display:flex; flex-direction:column; gap:26px; position:relative; z-index:1; }
.spine{ position:relative; z-index:1; align-self:center; }
.root{ border:1px solid var(--line3); background:var(--panel); border-radius:8px; padding:16px 18px; text-align:center; }
.root .t{ font-size:15px; letter-spacing:.3em; font-weight:600; }
.root .t span{ color:var(--crk); }
.root .n{ color:var(--ink3); font-size:12px; margin-top:6px; line-height:1.6; }
.root .n b{ color:var(--ink); font-weight:600; }
.area{ position:relative; }
.side.L .area{ text-align:right; }
.ah{ display:flex; align-items:baseline; gap:10px; margin:0 0 6px; }
.side.L .ah{ flex-direction:row-reverse; }
.ah .dot{ width:12px; height:12px; border-radius:50%; border:2px solid var(--crk); background:var(--bg); flex:0 0 12px; position:relative; top:1px; }
.ah h2{ margin:0; font-size:14px; letter-spacing:.2em; color:var(--ink); font-weight:600; }
.ah small{ color:var(--ink4); font-size:11px; letter-spacing:.06em; }
.ab{ color:var(--ink4); font-size:12px; margin:0 0 8px 22px; }
.side.L .ab{ margin:0 22px 8px 0; }
.leaves{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:3px; }
.leaf{ display:flex; align-items:flex-start; gap:10px; padding:5px 0 5px 22px; }
.side.L .leaf{ flex-direction:row-reverse; padding:5px 22px 5px 0; }
.leaf .dot{ width:9px; height:9px; border-radius:50%; background:var(--ink4); flex:0 0 9px; margin-top:6px; }
.leaf.live .dot{ background:var(--bull); }
.leaf.preview .dot{ background:var(--bull); box-shadow:inset 0 0 0 2px var(--bg), 0 0 0 1px var(--bull); }
.leaf.decision .dot{ background:var(--sv3); }
.leaf.building .dot{ background:transparent; border:1px dashed var(--ink3); }
.leaf.corrected .dot{ background:var(--ink2); }
.leaf.archive{ opacity:.5; }
.leaf .body{ min-width:0; }
.leaf a.t, .leaf span.t{ color:var(--ink); text-decoration:none; font-size:14px; line-height:1.35; display:inline; }
.leaf a.t:hover{ text-decoration:underline; text-decoration-color:var(--ink3); }
.leaf .m{ color:var(--ink4); font-size:11px; letter-spacing:.06em; margin-top:1px; display:flex; gap:8px; flex-wrap:wrap; }
.side.L .leaf .m{ justify-content:flex-end; }
.leaf .m .st{ text-transform:uppercase; }
.leaf.live .m .st, .leaf.preview .m .st{ color:var(--bull); }
.leaf.decision .m .st{ color:var(--sv3); }
.leaf .m .new{ color:var(--crk); font-weight:600; }
.leaf .m .ask{ color:var(--sv3); font-weight:600; }
.leaf .b{ display:none; color:var(--ink3); font-size:12.5px; line-height:1.45; margin-top:3px; max-width:46ch; }
.side.L .leaf .b{ margin-left:auto; }
.leaf.open .b, .leaf:hover .b{ display:block; }
.arch{ margin:6px 0 0 22px; background:none; border:0; color:var(--ink4); font:11px var(--mono); letter-spacing:.1em; cursor:pointer; padding:0; text-decoration:underline; text-decoration-color:var(--line3); }
.side.L .arch{ margin:6px 22px 0 0; }
.area.folded .leaf.archive{ display:none; }

/* the plain list */
#list{ display:none; }
#list h2{ font-size:13px; letter-spacing:.2em; color:var(--crk); margin:26px 0 8px; font-weight:600; }
#list ul{ margin:0; padding:0 0 0 18px; }
#list li{ margin:4px 0; }
#list li small{ color:var(--ink4); font-size:11px; letter-spacing:.06em; margin-left:6px; }
#list li.archive{ opacity:.55; }
body.list .map{ display:none; } body.list #list{ display:block; }

.legend{ display:flex; gap:14px 18px; flex-wrap:wrap; color:var(--ink3); font-size:12px; margin-top:34px; border-top:1px solid var(--line2); padding-top:14px; }
.legend i{ display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--ink4); margin-right:6px; vertical-align:-1px; }
.note{ color:var(--ink3); font-size:13px; margin-top:16px; }
.note a{ color:var(--ink2); }
#err{ display:none; border:1px solid var(--line3); padding:12px 14px; border-radius:6px; color:var(--ink2); margin:8px 0 18px; }
noscript p{ color:var(--ink2); }
@media (max-width:1000px){
  body{ padding:18px 16px 40px; }
  .map{ grid-template-columns:1fr; gap:22px 0; }
  .spine{ align-self:stretch; order:-1; }
  .side{ gap:22px; }
  .side.L .area{ text-align:left; } .side.L .ah{ flex-direction:row; } .side.L .leaf{ flex-direction:row; padding:5px 0 5px 22px; }
  .side.L .leaf .m{ justify-content:flex-start; } .side.L .leaf .b{ margin-left:0; } .side.L .ab{ margin:0 0 8px 22px; } .side.L .arch{ margin:6px 0 0 22px; }
  h1{ font-size:17px; letter-spacing:.24em; }
  .leaf .b{ display:block; }
}
</style>
</head>
<body>
<header><span data-scnav-slot></span>
  <h1>SCINTILLA <span>·</span> WORKSHOP</h1>
  <div class="sub" id="sub">reading manifest.json…</div>
  <div class="views"><button id="vb" class="on" type="button">BRANCHES</button><button id="vl" type="button">LIST</button></div>
</header>
<div class="rail" id="rail"></div>
<div id="err"></div>
<noscript><p>This page draws itself from <a href="manifest.json" style="color:#C6C8DE">manifest.json</a>; with scripts off, open that file: every branch and leaf is listed there in plain words.</p></noscript>
<div class="map" id="map"><svg id="wires" aria-hidden="true"></svg><div class="side L" id="L"></div><div class="spine"><div class="root" id="root"></div></div><div class="side R" id="R"></div></div>
<section id="list" aria-label="Plain list"></section>
<div class="legend" id="legend"></div>
<div class="note">Every branch and leaf comes from <a href="manifest.json">workshop/manifest.json</a>. A lane that ships a page adds one line there (<code>node scripts/workshop-add.mjs</code>) and this page is current; nothing here is written by hand. Hover a leaf for what it is; click to open it.</div>

<script>
/* T2-MAP-WORKSHOP (27 Sep). The workshop as a branch map, in the manner of an estate vault: seven branches, each leaf a page
   with its status and date, all drawn from manifest.json. "NEW" is anything dated within the last two days, so it fades on
   its own. Decisions are whatever the manifest says is waiting on Alan. The plain list is the same data as a list. */
(function () {
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const MON = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
  const fmt = (d) => { const [y, m, dd] = d.split("-").map(Number); return `${dd} ${MON[m - 1]}`; };
  const NEW_DAYS = 2, today = new Date(); today.setHours(0, 0, 0, 0);
  const isNew = (d, st) => (today - new Date(d + "T00:00:00")) / 86400000 <= NEW_DAYS && !["archive", "building"].includes(st || "");
  let M = null;

  function view(list) {
    document.body.classList.toggle("list", list); $("vb").classList.toggle("on", !list); $("vl").classList.toggle("on", list);
    try { localStorage.setItem("workshop-view", list ? "list" : "branches"); } catch (e) {}
    if (!list) requestAnimationFrame(wires);
  }
  $("vb").addEventListener("click", () => view(false)); $("vl").addEventListener("click", () => view(true));

  function leafHTML(it, side) {
    const cls = ["leaf", it.status, isNew(it.date, it.status) ? "new" : ""].join(" ");
    const t = it.href ? `<a class="t" href="${esc(it.href)}"${/^https:/.test(it.href) ? ' target="_blank" rel="noopener"' : ""}>${esc(it.title)}</a>` : `<span class="t">${esc(it.title)}</span>`;
    const meta = [`<span>${fmt(it.date)}</span>`, `<span class="st">${esc(it.status)}</span>`,
      it.ask ? `<span class="ask">${esc(it.ask)}</span>` : "", isNew(it.date, it.status) ? `<span class="new">NEW</span>` : "",
      /^https:\/\/station\./.test(it.href || "") ? `<span>station ↗</span>` : ""].filter(Boolean).join("");
    return `<li class="${cls}" data-id="${esc(it.id)}"><span class="dot"></span><div class="body">${t}<div class="m">${meta}</div><div class="b">${esc(it.blurb)}</div></div></li>`;
  }
  function areaHTML(a, items) {
    const live = items.filter((i) => i.status !== "archive"), arch = items.length - live.length;
    const newest = items.map((i) => i.date).sort().pop();
    return `<section class="area folded" data-area="${esc(a.id)}"><div class="ah"><span class="dot"></span><h2>${esc(a.label).toUpperCase()}</h2><small>${live.length}${arch ? ` + ${arch} archived` : ""} · newest ${fmt(newest)}</small></div>` +
      `<div class="ab">${esc(a.blurb)}</div><ul class="leaves">${items.map((i) => leafHTML(i)).join("")}</ul>` +
      (arch ? `<button class="arch" type="button">show ${arch} archived</button>` : "") + `</section>`;
  }
  function render() {
    const items = M.items.slice().sort((a, b) => b.date.localeCompare(a.date) || a.title.localeCompare(b.title));
    const byArea = new Map(M.areas.map((a) => [a.id, items.filter((i) => i.area === a.id)]));
    const newest = items.map((i) => i.date).sort().pop();
    const fresh = items.filter((i) => isNew(i.date, i.status)), asks = items.filter((i) => i.status === "decision"), building = items.filter((i) => i.status === "building");
    $("sub").textContent = `${items.length} pages on ${M.areas.length} branches · newest ${fmt(newest)} · from manifest.json`;
    $("root").innerHTML = `<div class="t">WORK<span>·</span>SHOP</div><div class="n"><b>${items.filter((i) => i.status !== "archive").length}</b> pages · <b>${fresh.length}</b> new this week<br><b>${asks.length}</b> waiting on you · <b>${building.length}</b> being built<br>newest ${fmt(newest)}</div>`;
    $("rail").innerHTML = asks.length ? `<span class="k">YOUR CALL</span>` + asks.map((i) => `<a class="chip ask" href="#${esc(i.id)}" data-go="${esc(i.id)}"><b>${esc(i.ask)}</b>${esc(i.title)}</a>`).join("") : "";
    // balance the two sides by leaf count: biggest branch first, onto the lighter side, manifest order kept within a side
    const wide = matchMedia("(min-width:1001px)").matches;
    const order = M.areas.map((a, i) => ({ a, i, n: byArea.get(a.id).length + 2 })).sort((x, y) => y.n - x.n);
    const L = [], R = []; let nl = 0, nr = 0;
    for (const o of order) { if (!wide || nl > nr) { R.push(o); nr += o.n; } else { L.push(o); nl += o.n; } }
    const html = (arr) => arr.sort((x, y) => x.i - y.i).map((o) => areaHTML(o.a, byArea.get(o.a.id))).join("");
    $("L").innerHTML = html(L); $("R").innerHTML = html(R);
    $("list").innerHTML = M.areas.map((a) => `<h2>${esc(a.label).toUpperCase()} · ${byArea.get(a.id).length}</h2><ul>` +
      byArea.get(a.id).map((i) => `<li class="${esc(i.status)}">${i.href ? `<a href="${esc(i.href)}" style="color:#F2F2F8">${esc(i.title)}</a>` : esc(i.title)}<small>${fmt(i.date)} · ${esc(i.status)}${i.ask ? " · " + esc(i.ask) : ""}</small><br><span style="color:#9A9AB6;font-size:12.5px">${esc(i.blurb)}</span></li>`).join("") + `</ul>`).join("");
    $("legend").innerHTML = Object.entries(M.statuses).map(([k, v]) => `<span><i class="${k}" style="${dotStyle(k)}"></i><b>${k}</b> · ${esc(v)}</span>`).join("") + `<span><i style="background:transparent;border:1px solid #00D4FF"></i><b>branch</b> · one of the seven areas</span>`;
    document.querySelectorAll(".arch").forEach((b) => b.addEventListener("click", () => { const s = b.closest(".area"); s.classList.toggle("folded"); b.textContent = (s.classList.contains("folded") ? "show " : "hide ") + b.textContent.replace(/^(show|hide) /, ""); wires(); }));
    document.querySelectorAll(".leaf").forEach((li) => li.addEventListener("click", (e) => { if (e.target.closest("a")) return; li.classList.toggle("open"); wires(); }));
    $("rail").addEventListener("click", (e) => { const a = e.target.closest("[data-go]"); if (!a) return; e.preventDefault(); const li = document.querySelector(`.leaf[data-id="${a.dataset.go}"]`); if (!li) return; view(false); li.closest(".area").classList.remove("folded"); li.classList.add("open"); li.scrollIntoView({ behavior: "smooth", block: "center" }); wires(); });
    requestAnimationFrame(wires);
  }
  function dotStyle(k) { return { live: "background:#00FFA3", preview: "background:#00FFA3;box-shadow:inset 0 0 0 2px #0A0A0F,0 0 0 1px #00FFA3", decision: "background:#FFE500", building: "background:transparent;border:1px dashed #9A9AB6", corrected: "background:#C6C8DE", archive: "opacity:.5" }[k] || ""; }

  /* the wires: root → each branch dot → each leaf dot, as curves, measured from where the page put things */
  function wires() {
    const svg = $("wires"), map = $("map"); if (document.body.classList.contains("list")) return;
    const mr = map.getBoundingClientRect(), root = $("root").getBoundingClientRect();
    const wide = matchMedia("(min-width:1001px)").matches;
    const P = (r, side) => ({ x: (side === "L" ? r.left : r.right) - mr.left, y: r.top + r.height / 2 - mr.top });
    let d = "", d2 = "";
    const cubic = (a, b) => { const k = Math.max(24, Math.abs(b.x - a.x) * 0.5); return `M${a.x},${a.y} C${a.x + (b.x > a.x ? k : -k)},${a.y} ${b.x - (b.x > a.x ? k : -k)},${b.y} ${b.x},${b.y}`; };
    const vert = (a, b) => `M${a.x},${a.y} C${a.x},${a.y + (b.y - a.y) * 0.5} ${b.x},${a.y + (b.y - a.y) * 0.5} ${b.x},${b.y}`;
    document.querySelectorAll(".area").forEach((sec) => {
      const side = sec.closest(".side").id, dot = sec.querySelector(".ah .dot").getBoundingClientRect();
      const bd = { x: dot.left + dot.width / 2 - mr.left, y: dot.top + dot.height / 2 - mr.top };
      const from = wide ? { x: (side === "L" ? root.left : root.right) - mr.left, y: root.top + root.height / 2 - mr.top } : { x: root.left + 18 - mr.left, y: root.bottom - mr.top };
      d += wide ? cubic(from, bd) : vert(from, bd);
      sec.querySelectorAll(".leaf").forEach((li) => {
        if (li.offsetParent === null) return;
        const ld = li.querySelector(".dot").getBoundingClientRect(), lp = { x: ld.left + ld.width / 2 - mr.left, y: ld.top + ld.height / 2 - mr.top };
        d2 += `M${bd.x},${bd.y} C${bd.x},${(bd.y + lp.y) / 2} ${lp.x},${(bd.y + lp.y) / 2} ${lp.x},${lp.y}`;
      });
    });
    svg.setAttribute("viewBox", `0 0 ${mr.width} ${mr.height}`);
    svg.innerHTML = `<path d="${d}" fill="none" stroke="#34344c" stroke-width="1.5"/><path d="${d2}" fill="none" stroke="#252538" stroke-width="1"/>`;
  }
  addEventListener("resize", () => { render(); });

  fetch("manifest.json", { cache: "no-store" }).then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); }).then((m) => {
    M = m; render();
    let v = null; try { v = localStorage.getItem("workshop-view"); } catch (e) {}
    if (v === "list") view(true);
    if (location.hash) { const li = document.querySelector(`.leaf[data-id="${CSS.escape(location.hash.slice(1))}"]`); if (li) { li.closest(".area").classList.remove("folded"); li.classList.add("open"); li.scrollIntoView({ block: "center" }); wires(); } }
    window.__ws = { items: m.items.length, areas: m.areas.length, ready: true };
  }).catch((e) => {
    $("sub").textContent = "the manifest could not be read";
    $("err").style.display = "block"; $("err").innerHTML = `This page draws itself from <a href="manifest.json" style="color:#C6C8DE">manifest.json</a> and could not read it (${esc(e.message)}). Open that file directly: every branch and leaf is listed there.`;
    window.__ws = { ready: false, error: String(e) };
  });
})();
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
</body>
</html>
