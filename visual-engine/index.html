<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">

<title>SCINTILLA · Visual Engine</title>
<!-- ============================================================================================
     SCINTILLA · VISUAL ENGINE — a mood board (23 Sep 2026)
     Six ways the Geiger could look, all six already moving on today's real numbers. No control
     panel: nothing to set, nothing to switch on. Click a tile and it fills the screen, with one
     button — play or pause. Data: the chart API the Hub reads (/geiger, /geiger?detail=1,
     /candles, /macro). Nothing here is invented; a feed that does not answer says so in words.
     Motion engine: ./geiger-engine.js (the Bar, the Mover, the Quiet Rule).
     ============================================================================================ -->
<style>
:root{
  --bg:#07080B; --pan:#0B0D11; --pan2:#0E1116; --line:#191D24; --line2:#242A33;
  --ink:#BEC3CB;      /* brightest ink — grey, used only for names and the one live number */
  --ink2:#969CA6; --dim:#6B717B; --dimmer:#474D57;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:ui-sans-serif,-apple-system,"Helvetica Neue",Helvetica,sans-serif;
  --rh:26px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink2);font:15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
body{padding:0 0 40px}
a{color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--line2)}
a:hover{color:var(--ink)}

/* ── head: the name, one sentence, the ways out ───────────────────────────── */
header{padding:26px 26px 18px;border-bottom:1px solid var(--line)}
h1{font:500 12px/1 var(--mono);letter-spacing:.3em;color:var(--dim);margin:0 0 14px}
.lede{margin:0;max-width:64ch;font-size:20px;line-height:1.45;color:var(--ink)}
.ways{margin:16px 0 0;font:11px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;display:flex;gap:22px;flex-wrap:wrap}

/* ── the board of tiles ───────────────────────────────────────────────────── */
.board{display:grid;grid-template-columns:repeat(auto-fit,minmax(430px,1fr));gap:18px;padding:22px 26px}
.tile{position:relative;background:var(--pan);border:1px solid var(--line);border-radius:12px;padding:16px 16px 12px;
  cursor:pointer;overflow:hidden;transition:border-color .18s,background .18s}
.tile:hover,.tile:focus-visible{border-color:var(--line2);background:var(--pan2);outline:none}
.tile h2{margin:0;font:500 12px/1 var(--mono);letter-spacing:.22em;color:var(--ink);text-transform:uppercase}
.tile p{margin:7px 0 12px;font-size:14px;color:var(--dim);min-height:2.9em}
.art{position:relative;height:258px}
.art canvas{display:block;width:100%;height:100%}
.tile .now{margin:9px 0 0;font:10px/1 var(--mono);letter-spacing:.16em;color:var(--dimmer);text-transform:uppercase;min-height:12px}

/* ── full size ────────────────────────────────────────────────────────────── */
#stage{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column;padding:20px 26px 22px}
#stage.on{display:flex}
#stage .shead{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}
#stage h2{margin:0;font:500 13px/1 var(--mono);letter-spacing:.24em;color:var(--ink);text-transform:uppercase}
#stage .sub{font-size:15px;color:var(--dim)}
#stage .art{flex:1;height:auto;margin-top:16px}
.stagebar{display:flex;align-items:center;gap:14px;margin-top:14px}
button.pp{appearance:none;background:var(--pan2);border:1px solid var(--line2);border-radius:8px;color:var(--ink2);
  height:46px;min-width:120px;padding:0 20px;font:500 12px/46px var(--mono);letter-spacing:.2em;text-transform:uppercase;cursor:pointer}
button.pp:hover{color:var(--ink);border-color:#333A45}
.stagebar .back{margin-left:auto;font:11px/1 var(--mono);letter-spacing:.16em;color:var(--dim);cursor:pointer;background:none;border:0;text-transform:uppercase}
.stagebar .back:hover{color:var(--ink)}

/* ── the row visual (uses geiger-engine.js: the Bar, the Mover, the Quiet Rule) ── */
.ve-rows{position:relative;overflow:hidden;height:100%}
.ve-row{position:absolute;left:0;right:0;height:var(--rh);display:flex;align-items:center;gap:10px;padding:0 2px;will-change:transform}
.ve-tk{width:58px;flex:none;font:600 12px/1 var(--mono);letter-spacing:.04em;color:var(--ink)}
.ve-track{position:relative;display:block;height:11px;flex:1;min-width:60px;background:#0A0C10;border:0.6px solid var(--line);border-radius:4px;overflow:hidden}
.ve-track .ve-mid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:var(--dimmer)}
.ve-track .ve-fill{position:absolute;top:1px;bottom:1px;width:0;left:50%;border-radius:2px;background:#3A414B}
.ve-fill.ve-bull{background:#B4BAC3}   /* above the middle — brighter grey, never a colour */
.ve-fill.ve-bear{background:#5A616B}   /* below the middle — darker grey */
.ve-track.ve-none{border-style:dashed}
.ve-val{width:52px;flex:none;text-align:right;font:12px/1 var(--mono);font-variant-numeric:tabular-nums;color:var(--ink2)}
.ve-rk{width:26px;flex:none;text-align:right;font:9px/1 var(--mono);color:var(--dimmer);opacity:0;transition:opacity .3s}
.ve-rk.ve-show{opacity:1}
.ve-quiet .ve-val{visibility:hidden}   /* the Quiet Rule: while rows move, only name and bar */

.note{padding:0 26px;font-size:14px;color:var(--dim)}
footer{margin-top:24px;padding:16px 26px 0;border-top:1px solid var(--line);font:10.5px/1.7 var(--mono);color:var(--dimmer);letter-spacing:.04em;overflow-wrap:anywhere}

@media (max-width:900px){
  header{padding:20px 16px 14px}
  .lede{font-size:17px}
  .board{grid-template-columns:1fr;gap:14px;padding:16px}
  .art{height:220px}
  #stage{padding:16px 16px 18px}
  .note,footer{padding-left:16px;padding-right:16px}
}
@media (prefers-reduced-motion:reduce){ .ve-row{transition:none !important} }
</style>
</head>
<body>

<header>
  <h1>SCINTILLA · VISUAL ENGINE</h1>
  <p class="lede">Six ways the Geiger could look on screen — every one of them already running on today's real numbers, with nothing for you to set. Click the one you like and it fills the screen.</p>
  <nav class="ways">
    <a href="/prototypes/">← Prototypes</a>
    <a href="/deliverables/20260923/context-lens/CONTEXT-LENS.html">Context Lens workshop</a>
  </nav>
</header>

<p class="note" id="note" hidden></p>
<main class="board" id="board"></main>

<div id="stage" aria-hidden="true">
  <div class="shead"><h2 id="stage-name"></h2><span class="sub" id="stage-sub"></span></div>
  <div class="art" id="stage-art"></div>
  <div class="stagebar">
    <button class="pp" id="pp" type="button">Pause</button>
    <button class="back" id="back" type="button">← back to the board</button>
  </div>
</div>

<footer id="prov">asking the chart API…</footer>

<script src="./geiger-engine.js"></script>
<script>
(function () {
'use strict';
var API = 'https://scintilla-massive-chart-api.fly.dev';
var RUNGS = ['2h','3h','4h','6h','12h','1d','3d','1w'];
var FAMILIES = ['composite','trend','momentum'];
var STEP_MS = 2800;
var reduced = window.GeigerEngine ? window.GeigerEngine.reducedMotion() : false;

var D = { geiger:null, detail:null, macro:null, candles:null, names:[], lead:null, errors:[] };
var CLOCKTICK = 0, playing = !reduced, mounted = [], stageV = null;

function $(id){ return document.getElementById(id); }
function jget(path){
  return fetch(API + path, { cache:'no-store' }).then(function(r){
    if (!r.ok) throw new Error(path.split('?')[0] + ' answered HTTP ' + r.status);
    return r.json();
  });
}
function fin(v){ return v != null && isFinite(v); }
function clamp(v,a,b){ return v < a ? a : v > b ? b : v; }
function spread(list, n){                                      // an even sample, both sides of zero
  if (list.length <= n) return list.slice();
  var out = [], last = list.length - 1;
  for (var i = 0; i < n; i++){ var k = list[Math.round(i * last / (n - 1))]; if (out.indexOf(k) < 0) out.push(k); }
  return out;
}

/* ── tiles ─────────────────────────────────────────────────────────────────── */
var TILES = [
  { key:'rows',  name:'The board, breathing',
    line:'A run of names from the strongest in the market to the weakest, one to a row. The bar grows right when the Geiger is above the middle, left when it is below. As the read moves from two hours out to a week the values settle first, and when the order changes the rows slide past each other.' },
  { key:'strip', name:'The strip',
    line:'The same run of names as one wall of bars, the middle line is zero. Above is strength, below is weakness — the whole market in one glance, nothing to read.' },
  { key:'rings', name:'The rings',
    line:'One name, eight rings — two hours in the middle, out to a week at the edge. Each ring sweeps as far as that timeframe is pushing, and the one being read now is the bright one.' },
  { key:'shape', name:'The shape of the market',
    line:'All three hundred and sixty four names piled into one hill. Lean right and the market is leaning up. It re-forms as it moves through the whole read, then the trend on its own, then the momentum.' },
  { key:'trace', name:'The trace',
    line:'One name drawing its own price, left to right, then again. No grid, no numbers around the edge — just the shape the last year actually made.' },
  { key:'dials', name:'The dials',
    line:'Volatility, the dollar, the ten year, gold, oil and bitcoin. Each sits somewhere between its own low and high for the day, and the marker is where it is right now.' }
];

/* ── the drawing surface ───────────────────────────────────────────────────── */
function surface(host){
  var c = document.createElement('canvas'); host.appendChild(c);
  var ctx = c.getContext('2d'), w = 0, h = 0;
  function fit(){
    var r = host.getBoundingClientRect(), dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = Math.max(10, r.width); h = Math.max(10, r.height);
    c.width = Math.round(w * dpr); c.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  fit();
  return { c:c, ctx:ctx, fit:fit, W:function(){ return w; }, H:function(){ return h; },
           clear:function(){ ctx.clearRect(0,0,w,h); } };
}
var grey = function (a){ return 'rgba(190,196,204,' + clamp(a,0,1).toFixed(3) + ')'; };

/* ── the visuals ───────────────────────────────────────────────────────────── */
function vRows(host, big){
  var wrap = document.createElement('div'); wrap.className = 've-rows'; host.appendChild(wrap);
  var E = window.GeigerEngine, n = big ? 18 : 9, size = big ? 34 : 26;
  var hh = host.getBoundingClientRect().height || 0;           // rows fill the space they are given,
  if (hh > 80) size = clamp(Math.floor(hh / n), big ? 30 : 18, big ? 72 : 30);   // on a phone or full size
  wrap.style.setProperty('--rh', size + 'px');
  var mover = new E.Mover(wrap, { size:size, resortMs:900, tieHold:0.02, badges:true, reduced:reduced });
  E.QuietRule.attach(mover, wrap, true);
  var names = spread(D.names, n), cur = {};
  mover.ensure(names.map(function(s){
    return { key:s, build:function(el){
      var tk = document.createElement('span'); tk.className = 've-tk'; tk.textContent = s; el.appendChild(tk);
      el.insertAdjacentHTML('beforeend', E.Bar.html(false));
      var v = document.createElement('span'); v.className = 've-val'; el.appendChild(v);
    } };
  }));
  function paint(el, key, dur){
    var v = cur[key];
    E.Bar.paint(el.querySelector('.ve-track'), v, { dur:dur, max:1 });
    el.querySelector('.ve-val').textContent = fin(v) ? E.fmtSigned(v) : '—';
  }
  function show(){
    names.forEach(function(s){ cur[s] = rungValue(s, RUNGS[CLOCKTICK % RUNGS.length]); });
    mover.update(cur, paint, reduced ? 'fresh' : 'tick');
  }
  show();
  return { tick:show, frame:function(){}, resize:function(){}, now:function(){
    return 'reading the ' + RUNGS[CLOCKTICK % RUNGS.length] + ' · ' + names.length + ' names';
  } };
}

function vStrip(host, big){
  var s = surface(host), names = spread(D.names, big ? 28 : 18), cur = names.map(function(){ return 0; });
  function target(i){ var v = rungValue(names[i], RUNGS[CLOCKTICK % RUNGS.length]); return fin(v) ? v : 0; }
  function draw(){
    var W = s.W(), H = s.H(), ctx = s.ctx, mid = H/2, pad = 6;
    s.clear();
    ctx.strokeStyle = 'rgba(190,196,204,.14)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(0, mid + .5); ctx.lineTo(W, mid + .5); ctx.stroke();
    var step = (W - pad*2) / names.length, bw = Math.max(3, step * .62);
    cur.forEach(function(v, i){
      var x = pad + i*step + (step - bw)/2, hgt = Math.abs(v) * (mid - 12);
      ctx.fillStyle = grey(.26 + .62*Math.min(Math.abs(v),1) * (v >= 0 ? 1 : .55));
      ctx.fillRect(x, v >= 0 ? mid - hgt : mid, bw, Math.max(1.5, hgt));
    });
  }
  draw();
  return {
    tick:draw,
    frame:function(){ var moved = false;
      cur.forEach(function(v, i){ var t = target(i), d = t - v; if (Math.abs(d) > 1e-4){ cur[i] = v + d*0.08; moved = true; } else cur[i] = t; });
      if (moved) draw(); },
    resize:function(){ s.fit(); draw(); },
    now:function(){ return 'reading the ' + RUNGS[CLOCKTICK % RUNGS.length] + ' · ' + names.length + ' names'; }
  };
}

function vRings(host, big){
  var s = surface(host), sym = D.lead, cur = RUNGS.map(function(){ return 0; }), glow = RUNGS.map(function(){ return 0; });
  function draw(){
    var W = s.W(), H = s.H(), ctx = s.ctx, cx = W/2, cy = H/2, R = Math.min(W, H)/2 - (big ? 26 : 16);
    s.clear();
    var inner = R * .30, gap = (R - inner) / (RUNGS.length - 1);
    RUNGS.forEach(function(r, i){
      var rad = inner + gap*i, v = cur[i], lit = glow[i];
      ctx.lineWidth = Math.max(2, (big ? 9 : 6) * (.55 + .45*lit));
      ctx.strokeStyle = grey(.07 + .05*lit);
      ctx.beginPath(); ctx.arc(cx, cy, rad, 0, Math.PI*2); ctx.stroke();
      if (!fin(v) || Math.abs(v) < .004) return;
      var sweep = clamp(Math.abs(v), 0, 1) * Math.PI * 1.5;
      ctx.strokeStyle = grey((v >= 0 ? .40 : .20) + .48*Math.min(Math.abs(v),1) * (.5 + .5*lit));
      ctx.lineCap = 'round';
      ctx.beginPath();
      if (v >= 0) ctx.arc(cx, cy, rad, -Math.PI/2, -Math.PI/2 + sweep);
      else ctx.arc(cx, cy, rad, -Math.PI/2 - sweep, -Math.PI/2);
      ctx.stroke();
    });
    ctx.fillStyle = grey(.72); ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = '600 ' + (big ? 22 : 15) + 'px "SF Mono",ui-monospace,Menlo,monospace';
    ctx.fillText(sym || '—', cx, cy);
  }
  draw();
  return {
    tick:draw,
    frame:function(){ var live = CLOCKTICK % RUNGS.length, moved = false;
      RUNGS.forEach(function(r, i){
        var t = rungValue(sym, r); t = fin(t) ? t : 0;
        if (Math.abs(t - cur[i]) > 1e-4){ cur[i] += (t - cur[i])*0.08; moved = true; }
        var g = i === live ? 1 : 0;
        if (Math.abs(g - glow[i]) > 1e-3){ glow[i] += (g - glow[i])*0.09; moved = true; }
      });
      if (moved) draw(); },
    resize:function(){ s.fit(); draw(); },
    now:function(){ return sym + ' · bright ring = the ' + RUNGS[CLOCKTICK % RUNGS.length]; }
  };
}

function vShape(host, big){
  var s = surface(host), BUCKETS = 41, cur = new Array(BUCKETS).fill(0);
  function counts(){
    var fam = FAMILIES[CLOCKTICK % FAMILIES.length], out = new Array(BUCKETS).fill(0), sy = (D.geiger && D.geiger.symbols) || {};
    Object.keys(sy).forEach(function(k){
      var v = sy[k][fam];
      if (!fin(v)) return;
      out[clamp(Math.round((clamp(v,-1,1) + 1) / 2 * (BUCKETS-1)), 0, BUCKETS-1)] += 1;
    });
    var mx = Math.max.apply(null, out) || 1;
    return out.map(function(n){ return n / mx; });
  }
  function draw(){
    var W = s.W(), H = s.H(), ctx = s.ctx, base = H - 18, pad = 10;
    s.clear();
    ctx.strokeStyle = 'rgba(190,196,204,.14)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(W/2 + .5, 8); ctx.lineTo(W/2 + .5, base); ctx.stroke();
    var step = (W - pad*2) / (BUCKETS - 1), pts = cur.map(function(v, i){ return [pad + i*step, base - v*(base - 18)]; });
    ctx.beginPath(); ctx.moveTo(pts[0][0], base); ctx.lineTo(pts[0][0], pts[0][1]);
    for (var i = 0; i < pts.length - 1; i++){                    // smooth, never a staircase
      var a = pts[i], b = pts[i+1], mx = (a[0] + b[0]) / 2;
      ctx.bezierCurveTo(mx, a[1], mx, b[1], b[0], b[1]);
    }
    ctx.lineTo(pts[pts.length-1][0], base); ctx.closePath();
    var g = ctx.createLinearGradient(0, 8, 0, base);
    g.addColorStop(0, 'rgba(190,196,204,.30)'); g.addColorStop(1, 'rgba(190,196,204,.05)');
    ctx.fillStyle = g; ctx.fill();
    ctx.strokeStyle = grey(.62); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.strokeStyle = 'rgba(190,196,204,.18)';
    ctx.beginPath(); ctx.moveTo(pad, base + .5); ctx.lineTo(W - pad, base + .5); ctx.stroke();
  }
  draw();
  return {
    tick:draw,
    frame:function(){ var t = counts(), moved = false;
      for (var i = 0; i < BUCKETS; i++){ var d = t[i] - cur[i]; if (Math.abs(d) > 1e-4){ cur[i] += d*0.10; moved = true; } else cur[i] = t[i]; }
      if (moved) draw(); },
    resize:function(){ s.fit(); draw(); },
    now:function(){ return 'the ' + FAMILIES[CLOCKTICK % FAMILIES.length] + ' read · 364 names'; }
  };
}

function vTrace(host, big){
  var s = surface(host), shown = 0, hold = 0;
  function series(){ return (D.candles && D.candles.closes) || []; }
  function draw(){
    var W = s.W(), H = s.H(), ctx = s.ctx, c = series();
    s.clear();
    if (c.length < 3) return;
    var n = Math.max(2, Math.floor(shown)), lo = Math.min.apply(null, c), hi = Math.max.apply(null, c), rng = (hi - lo) || 1;
    var pad = 14, x = function(i){ return pad + (i / (c.length - 1)) * (W - pad*2); },
        y = function(v){ return H - pad - ((v - lo) / rng) * (H - pad*2); };
    ctx.lineJoin = 'round'; ctx.lineCap = 'round';
    ctx.strokeStyle = grey(.13); ctx.lineWidth = 1.2;           // the whole shape, faint, always there
    ctx.beginPath(); ctx.moveTo(x(0), y(c[0]));
    for (var k = 1; k < c.length; k++) ctx.lineTo(x(k), y(c[k]));
    ctx.stroke();
    ctx.strokeStyle = grey(.40); ctx.lineWidth = 1.4;           // as far as the drawing has got
    ctx.beginPath(); ctx.moveTo(x(0), y(c[0]));
    for (var i = 1; i < n; i++) ctx.lineTo(x(i), y(c[i]));
    ctx.stroke();
    var tail = Math.max(0, n - 44);                               // the leading edge, brighter
    ctx.strokeStyle = grey(.82); ctx.lineWidth = 1.8;
    ctx.beginPath(); ctx.moveTo(x(tail), y(c[tail]));
    for (var j = tail + 1; j < n; j++) ctx.lineTo(x(j), y(c[j]));
    ctx.stroke();
    ctx.fillStyle = grey(.9);
    ctx.beginPath(); ctx.arc(x(n-1), y(c[n-1]), big ? 4 : 3, 0, Math.PI*2); ctx.fill();
  }
  draw();
  return {
    tick:function(){},
    frame:function(){
      var c = series(); if (c.length < 3) return;
      if (shown >= c.length){ if (++hold > 90){ shown = 0; hold = 0; } else return; }
      shown = Math.min(c.length, shown + c.length / 260);
      draw();
    },
    resize:function(){ s.fit(); draw(); },
    now:function(){ return (D.candles ? D.candles.symbol + ' · ' + D.candles.closes.length + ' days to ' + D.candles.last : ''); }
  };
}

function vDials(host, big){
  var s = surface(host), KEYS = ['VIX','DXY','US10Y','GCUSD','CLUSD','BTCUSD'], cur = KEYS.map(function(){ return .5; }), glow = KEYS.map(function(){ return 0; });
  function pos(k){
    var m = D.macro && D.macro[k] && D.macro[k].quote;
    if (!m || !fin(m.price) || !fin(m.day_low) || !fin(m.day_high) || m.day_high <= m.day_low) return null;
    return clamp((m.price - m.day_low) / (m.day_high - m.day_low), 0, 1);
  }
  function draw(){
    var W = s.W(), H = s.H(), ctx = s.ctx, padL = big ? 96 : 74, padR = 16, rowH = H / KEYS.length;
    s.clear();
    ctx.textBaseline = 'middle'; ctx.font = (big ? 13 : 11) + 'px "SF Mono",ui-monospace,Menlo,monospace';
    KEYS.forEach(function(k, i){
      var cy = rowH*i + rowH/2, x0 = padL, x1 = W - padR, lit = glow[i], q = D.macro && D.macro[k] && D.macro[k].quote;
      ctx.textAlign = 'left'; ctx.fillStyle = grey(.34 + .42*lit); ctx.fillText(k, 6, cy);
      ctx.strokeStyle = grey(.10 + .08*lit); ctx.lineWidth = big ? 5 : 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(x1, cy); ctx.stroke();
      if (pos(k) == null){ ctx.textAlign = 'left'; ctx.fillStyle = grey(.24); ctx.fillText('no reading', x0 + 8, cy); return; }
      var px = x0 + cur[i]*(x1 - x0);
      ctx.strokeStyle = grey(.30 + .45*lit); ctx.lineWidth = big ? 5 : 4;
      ctx.beginPath(); ctx.moveTo(x0, cy); ctx.lineTo(px, cy); ctx.stroke();
      ctx.fillStyle = grey(.58 + .40*lit);
      ctx.beginPath(); ctx.arc(px, cy, big ? 6 : 4.5, 0, Math.PI*2); ctx.fill();
      if (q && fin(q.prev_close) && fin(q.day_low) && fin(q.day_high) && q.day_high > q.day_low){
        var cpx = x0 + clamp((q.prev_close - q.day_low)/(q.day_high - q.day_low), 0, 1)*(x1 - x0);
        ctx.strokeStyle = grey(.26); ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(cpx, cy - (big ? 11 : 8)); ctx.lineTo(cpx, cy + (big ? 11 : 8)); ctx.stroke();
      }
    });
  }
  draw();
  return {
    tick:draw,
    frame:function(){ var live = CLOCKTICK % KEYS.length, moved = false;
      KEYS.forEach(function(k, i){
        var t = pos(k); if (t != null && Math.abs(t - cur[i]) > 1e-4){ cur[i] += (t - cur[i])*0.08; moved = true; }
        var g = i === live ? 1 : 0;
        if (Math.abs(g - glow[i]) > 1e-3){ glow[i] += (g - glow[i])*0.09; moved = true; }
      });
      if (moved) draw(); },
    resize:function(){ s.fit(); draw(); },
    now:function(){ return 'between today’s own low and high · live quote'; }
  };
}

var MAKE = { rows:vRows, strip:vStrip, rings:vRings, shape:vShape, trace:vTrace, dials:vDials };

/* ── one real reading, per name, per timeframe ─────────────────────────────── */
function rungValue(sym, rung){
  var d = D.detail && D.detail[sym];
  if (d && d.rungs && d.rungs[rung]){
    var r = d.rungs[rung];
    var v = r.composite != null ? r.composite : (r.trend != null ? r.trend : null);
    if (fin(v)) return v;
  }
  var g = D.geiger && D.geiger.symbols && D.geiger.symbols[sym];
  return g && fin(g.composite) ? g.composite : null;
}

/* ── the board ─────────────────────────────────────────────────────────────── */
function build(){
  var board = $('board'); board.innerHTML = '';
  TILES.forEach(function(t){
    var el = document.createElement('article');
    el.className = 'tile'; el.tabIndex = 0; el.setAttribute('role','button');
    el.innerHTML = '<h2></h2><p></p><div class="art"></div><p class="now"></p>';
    el.querySelector('h2').textContent = t.name;
    el.querySelector('p').textContent = t.line;
    board.appendChild(el);
    var v = MAKE[t.key](el.querySelector('.art'), false);
    v.host = el; v.spec = t; v.nowEl = el.querySelector('.now');
    mounted.push(v);
    var open = function(){ openStage(t); };
    el.addEventListener('click', open);
    el.addEventListener('keydown', function(e){ if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); open(); } });
  });
  paintNow();
}

function openStage(t){
  var art = $('stage-art'); art.innerHTML = '';
  $('stage-name').textContent = t.name;
  $('stage-sub').textContent = t.line;
  $('stage').classList.add('on'); $('stage').setAttribute('aria-hidden','false');
  stageV = MAKE[t.key](art, true); stageV.spec = t;
  try { stageV.tick(); stageV.frame(); } catch (e) {}
  $('pp').focus();
}
function closeStage(){
  $('stage').classList.remove('on'); $('stage').setAttribute('aria-hidden','true');
  $('stage-art').innerHTML = ''; stageV = null;
}
function paintNow(){
  mounted.forEach(function(v){ if (v.nowEl) v.nowEl.textContent = v.now ? v.now() : ''; });
  if (stageV) $('stage-sub').textContent = stageV.spec.line + (stageV.now ? ' — ' + stageV.now() : '');
}

/* ── the one clock everything shares ───────────────────────────────────────── */
function step(){
  if (!playing) return;
  CLOCKTICK += 1;
  mounted.concat(stageV ? [stageV] : []).forEach(function(v){ try { v.tick(); } catch (e) {} });
  paintNow();
}
function redrawAll(){
  mounted.concat(stageV ? [stageV] : []).forEach(function(v){ try { v.tick(); v.frame(); } catch (e) {} });
  paintNow();
}
function frame(){
  if (playing) mounted.concat(stageV ? [stageV] : []).forEach(function(v){ try { v.frame(); } catch (e) {} });
  requestAnimationFrame(frame);
}

/* ── load: ask the chart API, say what came back ───────────────────────────── */
function say(){
  var g = D.geiger || {}, v = g.verification || {};
  var bits = [];
  bits.push('asked ' + API + ' for /geiger, /geiger?detail=1 (' + D.names.length + ' names), /candles and /macro');
  if (g.computed_utc) bits.push('geiger computed ' + g.computed_utc.slice(11,19) + 'Z for the session ending ' + (v.completed_session_et || '—'));
  if (D.candles) bits.push(D.candles.symbol + ' ' + D.candles.closes.length + ' daily bars of ' + D.candles.full + ' held, newest ' + D.candles.last);
  if (D.macro) bits.push('macro ' + Object.keys(D.macro).length + ' live quotes');
  if (reduced) bits.push('YOUR SYSTEM ASKS FOR REDUCED MOTION — nothing moves by itself here');
  if (D.errors.length) bits.push('DID NOT ANSWER: ' + D.errors.join(' · '));
  $('prov').textContent = bits.join(' · ');
}

function boot(){
  $('note').hidden = false; $('note').textContent = 'Asking the chart API for today’s numbers…';
  jget('/geiger').then(function(g){
    D.geiger = g;
    var sy = g.symbols || {};
    var ranked = Object.keys(sy).filter(function(k){ return fin(sy[k].composite); })
      .sort(function(a,b){ return sy[b].composite - sy[a].composite; });
    var WANT = 28, last = ranked.length - 1;                     // an even cross-section of the
    D.names = [];                                                // whole market: strongest to weakest,
    for (var i = 0; i < WANT && last >= 0; i++){                 // not just the extremes
      var pick = ranked[Math.round(i * last / (WANT - 1))];
      if (D.names.indexOf(pick) < 0) D.names.push(pick);
    }
    D.lead = ranked[0];
    return Promise.all([
      jget('/geiger?symbols=' + encodeURIComponent(D.names.join(',')) + '&detail=1')
        .then(function(d){ D.detail = d.symbols || {}; })
        .catch(function(e){ D.errors.push(e.message); }),
      jget('/candles?symbol=' + encodeURIComponent(D.lead) + '&tf=D&limit=320')
        .then(function(c){
          var rows = c.series || [];                      // /candles returns {series:[{t,o,h,l,c,v}]}
          D.candles = { symbol:c.symbol, full:c.full_series_count,
            closes:rows.map(function(r){ return r.c; }).filter(fin),
            last:(c.newest || '').slice(0,10) };
        })
        .catch(function(e){ D.errors.push(e.message); }),
      jget('/macro').then(function(m){ D.macro = m.macro || {}; }).catch(function(e){ D.errors.push(e.message); })
    ]);
  }).then(function(){
    $('note').hidden = true;
    build(); say();
    if (!reduced) setInterval(step, STEP_MS);
    requestAnimationFrame(frame);
    setInterval(function(){                                   // the numbers themselves, kept current
      jget('/geiger').then(function(g){ D.geiger = g; say(); redrawAll(); }).catch(function(){});
      jget('/geiger?symbols=' + encodeURIComponent(D.names.join(',')) + '&detail=1')
        .then(function(d){ D.detail = d.symbols || D.detail; redrawAll(); }).catch(function(){});
      jget('/macro').then(function(m){ D.macro = m.macro || D.macro; redrawAll(); }).catch(function(){});
    }, 90000);
  }).catch(function(e){
    $('note').hidden = false;
    $('note').textContent = 'The chart API did not answer, so there is nothing real to show: ' + e.message;
    D.errors.push(e.message); say();
  });
}

$('pp').addEventListener('click', function(){
  playing = !playing;
  $('pp').textContent = playing ? 'Pause' : 'Play';
});
$('back').addEventListener('click', closeStage);
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') closeStage(); });
window.addEventListener('resize', function(){
  mounted.concat(stageV ? [stageV] : []).forEach(function(v){ try { v.resize(); } catch (e) {} });
});
boot();
})();
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
