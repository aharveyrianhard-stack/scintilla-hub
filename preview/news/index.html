<!DOCTYPE html>
<html lang="en">
<head>
<!-- TRIAL COPY (15 Oct 2026, N2): the NEWS room as a page you can read at a glance — the title is the unit. Served beside the live
     Hub for Alan to try; the live NEWS room at / is unchanged. Reads the same tables the Hub reads (news, ticker_cohorts,
     station_lists, hub_favorites) with the same anon key; writes nothing except, on Alan's own click, one row to
     push_subscriptions (the device's push address) so notifications can reach this device. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SCINTILLA · NEWS</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A0A0F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SCINTILLA">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* SCINTILLA · APPROVED design tokens (the Hub's own, verbatim) */
:root{
  --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A;
  --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  --crk:#00D4FF; --coin:#8B5CF6;
  --bull:#00FFA3; --sv1:#00FFA3; --sv2:#C8FF00; --sv3:#FFE500; --sv4:#FF8A00; --sv5:#FF3060; --bear:#FF2D55;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
  --radius:4px; --gap:8px;
  /* N2 — the news page's own sizes. THE TITLE IS THE UNIT. */
  --ttl:22px;          /* desktop headline: 20–24 px (Alan: "the titles need to be way bigger") */
  --meta:12.5px;       /* source · age · chips — readable, not the room's 7.5 px */
  --chip:12px;
}
*{ box-sizing:border-box; min-width:0; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; cursor:pointer; }
.sc-clip{ overflow:hidden; }

/* ── chrome ───────────────────────────────────────────────────────────────── */
.hd{ position:sticky; top:0; z-index:20; background:rgba(10,10,15,.92); backdrop-filter:blur(10px); border-bottom:1px solid var(--line2); }
.hd__row{ display:flex; align-items:center; gap:14px; padding:10px 18px 8px; }
.hd__brand{ font-family:var(--mono); font-size:13px; letter-spacing:.32em; color:var(--ink); text-transform:uppercase; white-space:nowrap; }
.hd__brand b{ color:var(--crk); font-weight:600; }
.hd__live{ display:inline-flex; align-items:center; gap:6px; font-family:var(--mono); font-size:10px; letter-spacing:.2em; color:var(--bull); text-transform:uppercase; }
.hd__live i{ width:7px; height:7px; border-radius:50%; background:var(--bull); box-shadow:0 0 8px var(--bull); animation:pulse 1.6s ease-in-out infinite; }
@keyframes pulse{ 0%,100%{ opacity:1 } 50%{ opacity:.35 } }
.hd__sp{ flex:1; }
.hd__search{ display:flex; align-items:center; gap:6px; }
.hd__search input{ width:120px; height:30px; padding:0 10px; background:var(--panel2); border:1px solid var(--line2); border-radius:var(--radius); color:var(--ink); font:600 13px var(--mono); letter-spacing:.08em; text-transform:uppercase; outline:none; }
.hd__search input:focus{ border-color:var(--hair); }
.hd__time{ font-family:var(--mono); font-size:11px; color:var(--ink3); letter-spacing:.08em; white-space:nowrap; }
.scopes{ display:flex; gap:4px; padding:0 14px 10px; overflow-x:auto; scrollbar-width:none; }
.scopes::-webkit-scrollbar{ display:none; }
.scope{ flex:none; padding:7px 12px; border:1px solid var(--line2); border-radius:3px; background:var(--panel); color:var(--ink3); font:600 11.5px var(--mono); letter-spacing:.12em; text-transform:uppercase; white-space:nowrap; }
.scope:hover{ color:var(--ink); border-color:var(--hair); }
.scope.is-on{ color:#061015; background:var(--crk); border-color:var(--crk); }
.scope.is-list{ color:var(--ink2); }
.scope.is-list.is-on{ color:#061015; }
.scope small{ margin-left:6px; opacity:.7; font-weight:400; }

/* ── layout ───────────────────────────────────────────────────────────────── */
.wrap{ display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:0 28px; padding:0 18px 60px; max-width:2400px; margin:0 auto; }
.feed{ min-width:0; }
.rail{ min-width:0; position:sticky; top:96px; align-self:start; max-height:calc(100vh - 110px); overflow:auto; padding-top:14px; }
@media (max-width:1100px){ .wrap{ grid-template-columns:minmax(0,1fr); } .rail{ position:static; max-height:none; order:-1; } }

/* ── groups ───────────────────────────────────────────────────────────────── */
.grp{ margin-top:18px; }
.grp__hd{ display:flex; align-items:baseline; gap:12px; padding:8px 0 6px; border-bottom:1px solid var(--line2); position:sticky; top:96px; background:var(--bg); z-index:5; }
.grp__ttl{ font:700 13px var(--mono); letter-spacing:.3em; text-transform:uppercase; color:var(--ink2); }
.grp__n{ font:600 12px var(--mono); color:var(--ink3); letter-spacing:.1em; }
.grp--hour .grp__ttl{ color:var(--bull); }
.grp--today .grp__ttl{ color:var(--crk); }
.grp--yday .grp__ttl{ color:var(--coin); }
.grp--old .grp__ttl{ color:var(--dim); }
.grp__hd .dot{ width:8px; height:8px; border-radius:50%; background:currentColor; align-self:center; }
.grp--hour .dot{ background:var(--bull); box-shadow:0 0 10px var(--bull); animation:pulse 1.6s ease-in-out infinite; }
.grp--today .dot{ background:var(--crk); } .grp--yday .dot{ background:var(--coin); } .grp--old .dot{ background:var(--mute); }
.grp__body{ column-gap:34px; }
@media (min-width:2000px){ .grp__body{ column-count:2; } .art{ break-inside:avoid; } }

/* ── one headline ─────────────────────────────────────────────────────────── */
.art{ display:grid; grid-template-columns:4px minmax(0,1fr); gap:0 14px; padding:13px 0 12px; border-bottom:1px solid var(--line); }
.art__edge{ border-radius:2px; background:var(--mute); margin:3px 0; }
.grp--hour .art__edge{ background:var(--bull); } .grp--today .art__edge{ background:rgba(0,212,255,.55); } .grp--yday .art__edge{ background:rgba(139,92,246,.6); }
.art.is-pr .art__edge{ background:var(--sv3); }
.art__ttl{ font-family:var(--sans); font-size:var(--ttl); line-height:1.22; font-weight:600; letter-spacing:-.005em; color:var(--ink);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.art__ttl a:hover{ color:var(--crk); }
.art__meta{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; margin-top:7px; font-family:var(--mono); font-size:var(--meta); color:var(--ink3); letter-spacing:.02em; }
.art__src{ color:var(--ink2); }
.art.is-pr .art__src{ color:var(--sv3); }
.art__src small{ margin-left:6px; padding:1px 5px; border:1px solid currentColor; border-radius:2px; font-size:9px; letter-spacing:.14em; vertical-align:1px; }
.art__age{ color:var(--ink3); font-variant-numeric:tabular-nums; }
.grp--hour .art__age{ color:var(--bull); }
.art__sep{ color:var(--mute); }
.chip{ display:inline-flex; align-items:center; height:22px; padding:0 8px; border:1px solid rgba(0,212,255,.45); border-radius:3px; background:rgba(0,212,255,.08); color:var(--crk); font:700 var(--chip) var(--mono); letter-spacing:.06em; }
.chip:hover{ background:var(--crk); color:#061015; }
.chip.is-mkt{ color:var(--ink3); border-color:var(--line2); background:var(--panel); font-weight:600; }
.chip.is-more{ color:var(--dim); border-style:dashed; }
.art__snip{ margin-top:6px; font-size:14px; line-height:1.4; color:var(--ink3); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.empty{ padding:40px 0; font:13px var(--mono); color:var(--dim); letter-spacing:.08em; }
.empty b{ color:var(--crk); }

/* ── rail: what moved ─────────────────────────────────────────────────────── */
.card{ border:1px solid rgba(0,212,255,.2); background:var(--panel); padding:14px 16px 12px; margin-bottom:14px; }
.card h4{ margin:0 0 10px; font:600 11px var(--mono); letter-spacing:.26em; text-transform:uppercase; color:var(--ink2); }
.card h4 b{ color:var(--crk); font-weight:600; }
.mv{ display:grid; grid-template-columns:72px minmax(0,1fr) 42px; gap:8px; align-items:center; padding:6px 0; border-bottom:1px solid var(--line); cursor:pointer; }
.mv:last-child{ border-bottom:0; }
.mv:hover .mv__tk{ color:#061015; background:var(--crk); }
.mv__tk{ justify-self:start; padding:2px 7px; border-radius:3px; color:var(--crk); font:700 13px var(--mono); letter-spacing:.06em; }
.mv__tk.is-mkt{ color:var(--ink3); }
.mv__bar{ height:10px; background:var(--panel2); border-radius:2px; overflow:hidden; }
.mv__bar i{ display:block; height:100%; background:linear-gradient(90deg, rgba(0,212,255,.55), var(--crk)); }
.mv.is-hot .mv__bar i{ background:linear-gradient(90deg, rgba(0,255,163,.55), var(--bull)); }
.mv__n{ text-align:right; font:600 13px var(--mono); color:var(--ink); font-variant-numeric:tabular-nums; }
.mv__n small{ display:block; font-size:9.5px; color:var(--ink3); font-weight:400; letter-spacing:.06em; }
.mv__last{ grid-column:1 / -1; font-size:12.5px; line-height:1.3; color:var(--ink3); margin:-2px 0 2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .leg{ margin-top:8px; font:10px var(--mono); color:var(--dim); letter-spacing:.08em; }

/* ── rail: notifications ──────────────────────────────────────────────────── */
.pushc p{ margin:0 0 10px; font-size:13px; line-height:1.45; color:var(--ink2); }
.pushc .st{ font:11px var(--mono); color:var(--ink3); letter-spacing:.06em; line-height:1.5; }
.pushc .st b{ color:var(--bull); font-weight:600; }
.pushc .st.is-err b{ color:var(--bear); }
.pushc input{ width:100%; height:32px; margin:6px 0 8px; padding:0 10px; background:var(--panel2); border:1px solid var(--line2); border-radius:3px; color:var(--ink); font:13px var(--sans); outline:none; }
.pushc input:focus{ border-color:var(--hair); }
.btn{ display:inline-flex; align-items:center; justify-content:center; height:34px; padding:0 14px; border:1px solid var(--crk); border-radius:3px; background:rgba(0,212,255,.1); color:var(--crk); font:700 11.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; }
.btn:hover{ background:var(--crk); color:#061015; }
.btn:disabled{ opacity:.45; cursor:default; }
.btn--quiet{ border-color:var(--line2); color:var(--ink3); background:none; }

/* ── phone ────────────────────────────────────────────────────────────────── */
@media (max-width:500px){
  :root{ --ttl:18px; --meta:12px; --chip:11.5px; }
  .hd__row{ padding:10px 14px 6px; gap:10px; }
  .hd__brand{ font-size:12px; letter-spacing:.24em; }
  .hd__time, .hd__live span{ display:none; }
  .hd__search input{ width:84px; }
  .wrap{ padding:0 14px 40px; gap:0; }
  .rail{ padding-top:10px; }
  .art{ padding:11px 0 10px; gap:0 10px; }
  .art__snip{ display:none; }
  .grp__hd{ top:88px; }
  .mv__last{ display:none; }
}
</style>
</head>
<body>
<header class="hd">
  <div class="hd__row">
    <span data-scnav-slot></span>
    <span class="hd__brand">SCINTILLA · <b>NEWS</b></span>
    <span class="hd__live"><i></i><span>live · news (DB)</span></span>
    <span class="hd__sp"></span>
    <form class="hd__search" id="qForm" autocomplete="off"><input id="q" placeholder="TICKER" aria-label="ticker" maxlength="10"></form>
    <span class="hd__time" id="clock">—</span>
  </div>
  <nav class="scopes" id="scopes" aria-label="scope"></nav>
</header>

<main class="wrap">
  <section class="feed" id="feed"><div class="empty">reading headlines …</div></section>
  <aside class="rail">
    <div class="card" id="moved"><h4>What moved · <b>today</b></h4><div class="empty" style="padding:12px 0">counting today's headlines …</div></div>
    <div class="card pushc" id="pushc">
      <h4>Notifications · <b>this device</b></h4>
      <p>A notification lands in Notification Center on this Mac, or on this iPhone when the Hub is on the home screen. One click, once per device.</p>
      <input id="devName" placeholder="name this device (e.g. iMac · Brave app)" maxlength="40">
      <button class="btn" id="allowBtn">Allow notifications</button>
      <div class="st" id="pushSt">checking …</div>
    </div>
  </aside>
</main>

<script>
"use strict";
/* ── the pull layer: the Hub's own address and key (public in index.html) ────────────────────────── */
const SB = "https://wadinxqplrggagkvrdag.supabase.co";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndhZGlueHFwbHJnZ2Fna3ZyZGFnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA1NDk0MTYsImV4cCI6MjA5NjEyNTQxNn0.1UKKUb_fY-xOy33vNUszDzxGECqQxdcwaxb9kN7KY";
const FN = SB.replace(".supabase.co", ".functions.supabase.co") + "/notify-push";
const el = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
async function pg(path, tries = 3) {
  let last;
  for (let i = 0; i < tries; i++) {
    try {
      const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: ANON, Authorization: "Bearer " + ANON } });
      if (r.ok) return r.json();
      if (r.status !== 503 && r.status !== 504 && r.status !== 429 && r.status !== 500) throw new Error("pg " + r.status);
      last = new Error("pg " + r.status);
    } catch (e) { last = e; }
    await new Promise((res) => setTimeout(res, 500 * (i + 1)));
  }
  throw last;
}
async function pgAll(path, cap = 12) { const out = []; for (let i = 0; i < cap; i++) { const rows = await pg(path + "&limit=1000&offset=" + i * 1000); out.push(...rows); if (rows.length < 1000) break; } return out; }

/* ── scopes: the Hub's lists and cohorts, read the way the Hub reads them ───────────────────────── */
const COHORTS = [["AI HW", "AI_HARDWARE"], ["AI SW", "AI_SOFTWARE"], ["MEGACAP", "MEGACAP"], ["BLUE CHIP", "BLUE_CHIP"], ["GROWTH", "GROWTH"], ["CRYPTO", "CRYPTO"], ["INTL", "INTL"],
  ["MACRO", "MACRO"], ["INDEXES", "INDEXES"], ["THEMATIC", "THEMATIC"], ["METALS", "METALS"], ["AI POWER", "AI_POWERTRAIN"]];
const LISTS = { RADAR: [], FAVORITES: [], LIKED: [] };
let COHSETS = {}, UNIVERSE = new Set();
const S = { scope: null, tq: "" };
function scopeMembers(k) {
  if (k === "ALL") return null;
  if (LISTS[k]) return LISTS[k];
  return Array.from(COHSETS[k] || []);
}
async function loadScopes() {
  const [coh, lists, liked] = await Promise.all([
    pgAll("ticker_cohorts?select=ticker,cohort&order=ticker.asc,cohort.asc"),
    pg("station_lists?select=list,position,ticker&list=in.(favorites,radar)&order=list.asc,position.asc").catch(() => []),
    pg("hub_favorites?select=ticker").catch(() => []),
  ]);
  for (const m of coh) { const t = String(m.ticker).toUpperCase(); (COHSETS[m.cohort] = COHSETS[m.cohort] || new Set()).add(t); UNIVERSE.add(t); }
  for (const r of lists) (r.list === "radar" ? LISTS.RADAR : LISTS.FAVORITES).push(String(r.ticker).toUpperCase());
  LISTS.LIKED = liked.map((r) => String(r.ticker).toUpperCase());
}
function bootScope() {
  const want = new URLSearchParams(location.search).get("scope") || localStorage.getItem("sc_news_scope") || "FAVORITES";
  if (want === "ALL" || LISTS[want] !== undefined || COHSETS[want]) return (LISTS[want] && !LISTS[want].length) ? (LISTS.LIKED.length ? "LIKED" : "ALL") : want;
  return "FAVORITES";
}
function paintScopes() {
  const tab = (k, label, cls) => '<button class="scope ' + (cls || "") + (k === S.scope ? " is-on" : "") + '" data-scope="' + k + '">' + label + "</button>";
  el("scopes").innerHTML = tab("RADAR", "⊙ RADAR", "is-list") + tab("FAVORITES", "★ FAVORITES", "is-list") + tab("LIKED", "♥ LIKED", "is-list") + tab("ALL", "ALL") +
    COHORTS.map(([l, k]) => tab(k, l)).join("");
  const on = el("scopes").querySelector(".is-on"); if (on && on.scrollIntoView) on.scrollIntoView({ inline: "center", block: "nearest" });
}

/* ── the pull: the newest 48 h of the scope, so YESTERDAY has something to say ─────────────────── */
const SEL = "select=ticker,title,snippet,site,feed,url,published_ts&order=published_ts.desc";
const CACHE = new Map();                                   // scope key → { items, ts }
const TTL = 60000;
function chunk(a, n) { const o = []; for (let i = 0; i < a.length; i += n) o.push(a.slice(i, i + n)); return o; }
async function pullScope(key) {
  const since = Math.floor(Date.now() / 1000) - 48 * 3600;
  if (key.indexOf("TQ|") === 0) return pg("news?ticker=like." + encodeURIComponent(key.slice(3)) + "*&published_ts=gte." + since + "&" + SEL + "&limit=200");
  if (key === "ALL") return pg("news?published_ts=gte." + since + "&" + SEL + "&limit=300");
  const m = scopeMembers(key) || [];
  if (!m.length) return [];
  const parts = await Promise.all(chunk(m, 35).map((ck) => pg("news?ticker=in.(" + ck.join(",") + ")&published_ts=gte." + since + "&" + SEL + "&limit=200").catch(() => [])));
  return parts.flat().sort((a, b) => (b.published_ts || 0) - (a.published_ts || 0)).slice(0, 400);
}
const scopeKey = () => (S.tq ? "TQ|" + S.tq : S.scope);
async function fill(force) {
  const key = scopeKey(), hit = CACHE.get(key);
  if (hit) paint(hit.items);
  if (hit && !force && Date.now() - hit.ts < TTL) return;
  if (!hit) el("feed").innerHTML = '<div class="empty">reading <b>' + esc(S.tq || S.scope) + "</b> …</div>";
  try { const items = await pullScope(key); CACHE.set(key, { items, ts: Date.now() }); if (scopeKey() === key) paint(items); }
  catch (e) { if (!CACHE.get(key)) el("feed").innerHTML = '<div class="empty">news pull failed — ' + esc(String(e.message || e)) + "</div>"; }
}

/* ── the same cleaning the Hub does, then: one story, every ticker it was filed under ───────────── */
const norm = (s) => String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, "");
function stripSrcTail(title, src) {
  const t = String(title == null ? "" : title).trim();
  const m = t.match(/^(.*\S)\s+[-–—|·]\s+(.{2,40})$/);
  if (!m) return t;
  const tail = norm(m[2]), s = norm(src);
  return (s && tail && (s.indexOf(tail) !== -1 || tail.indexOf(s) !== -1)) ? m[1] : t;
}
const stripMarkup = (s) => String(s == null ? "" : s).replace(/<[^>]*>/g, " ").replace(/&nbsp;/gi, " ").replace(/https?:\/\/\S+/g, " ").replace(/<[^>]*$/, " ").replace(/\s{2,}/g, " ").trim();
const PR = /prnewswire|globenewswire|businesswire|accesswire|newsfile|newswire|sec\.gov|edgar/i;
/* a cashtag or a universe name standing alone in the title counts as a mention; short English words that are also tickers do not */
const NOT_TICKERS = new Set(["AI", "US", "UK", "EU", "CEO", "CFO", "IPO", "ETF", "GDP", "CPI", "FED", "ALL", "NEW", "NOW", "ONE", "TWO", "BIG", "LOW", "TOP", "KEY", "SEE", "BUY", "GO", "ON", "IT", "AN", "AT", "BE", "SO", "UP", "FOR", "ARE", "CAN", "HAS", "OR", "NY", "PM", "AM", "ET", "Q1", "Q2", "Q3", "Q4", "EPS", "USA", "WSJ", "FAQ", "SEC", "DOJ", "FTC", "EV", "AR", "VR", "PC", "TV", "HR", "IT", "PE", "ARM", "DOW", "SPY", "QQQ"]);
function mentions(title) {
  const out = new Set();
  for (const m of String(title || "").matchAll(/\$([A-Z]{1,6})\b/g)) out.add(m[1]);
  for (const m of String(title || "").matchAll(/\b([A-Z]{2,5})\b/g)) if (UNIVERSE.has(m[1]) && !NOT_TICKERS.has(m[1])) out.add(m[1]);
  return out;
}
function dedupe(items) {
  const kept = [], out = [];
  for (const n of items || []) {
    const k = String(n.title || "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim().slice(0, 64);
    const t = String(n.ticker || "").toUpperCase();
    let dup = null;
    if (k) for (const kk of kept) if (kk.k === k || (kk.k.length >= 48 && k.length >= 48 && kk.k.slice(0, 48) === k.slice(0, 48))) { dup = kk; break; }
    if (dup) { if (t && t !== "_MARKET") dup.row.tickers.add(t); continue; }
    const row = Object.assign({}, n, { tickers: new Set(t && t !== "_MARKET" ? [t] : []) });
    for (const x of mentions(n.title)) row.tickers.add(x);
    kept.push({ k, row }); out.push(row);
  }
  return out;
}

/* ── time, New York ───────────────────────────────────────────────────────── */
const ET_HM = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const ET_DAY = new Intl.DateTimeFormat("en-CA", { timeZone: "America/New_York" });
const ET_MD = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", month: "short", day: "numeric" });
const ET_CLOCK = new Intl.DateTimeFormat("en-US", { timeZone: "America/New_York", weekday: "short", hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
function dayKey(d) { return ET_DAY.format(d); }
function ago(ts) {
  const s = Math.max(0, Math.floor(Date.now() / 1000 - ts));
  if (s < 60) return "just now"; const m = Math.floor(s / 60); if (m < 60) return m + " min ago";
  const h = Math.floor(m / 60); if (h < 24) return h + " h " + String(m % 60).padStart(2, "0") + " ago"; return Math.floor(h / 24) + " d ago";
}
function bucket(ts, now) {
  if (!ts) return "old";
  if (now / 1000 - ts < 3600) return "hour";
  const d = new Date(ts * 1000), today = dayKey(new Date(now)), yday = dayKey(new Date(now - 86400000));
  const k = dayKey(d);
  return k === today ? "today" : k === yday ? "yday" : "old";
}
const GROUPS = [["hour", "Last hour"], ["today", "Today"], ["yday", "Yesterday"], ["old", "Earlier"]];

/* ── paint ─────────────────────────────────────────────────────────────────── */
function artHTML(n, g) {
  const title = stripSrcTail(n.title, n.site || n.feed);
  const snip0 = stripMarkup(n.snippet), snip = snip0 && norm(snip0) === norm(title) ? "" : snip0;
  const src = n.site || n.feed || "";
  const isPR = PR.test(src) || PR.test(n.url || "");
  const tks = Array.from(n.tickers).sort();
  const chips = tks.slice(0, 6).map((t) => '<a class="chip" href="/#co=' + esc(t) + '" title="open $' + esc(t) + '">$' + esc(t) + "</a>").join("") +
    (tks.length > 6 ? '<span class="chip is-more">+' + (tks.length - 6) + "</span>" : "") +
    (!tks.length ? '<span class="chip is-mkt">MARKET</span>' : "");
  const ts = +n.published_ts || 0;
  return '<article class="art' + (isPR ? " is-pr" : "") + '"><span class="art__edge"></span><div>' +
    '<h2 class="art__ttl"><a href="' + esc(n.url || "#") + '" target="_blank" rel="noopener">' + esc(title) + "</a></h2>" +
    '<div class="art__meta"><span class="art__src">' + esc(src) + (isPR ? "<small>PR</small>" : "") + "</span>" +
      '<span class="art__sep">·</span><span class="art__age" title="' + (ts ? esc(ET_MD.format(new Date(ts * 1000)) + " " + ET_HM.format(new Date(ts * 1000)) + " ET") : "") + '">' + (ts ? esc(ago(ts)) : "—") + "</span>" +
      '<span class="art__sep">·</span>' + chips + "</div>" +
    (snip && g !== "old" ? '<div class="art__snip">' + esc(snip) + "</div>" : "") +
    "</div></article>";
}
function paint(items) {
  const now = Date.now();
  const shown = dedupe(items);
  if (!shown.length) { el("feed").innerHTML = '<div class="empty">No headlines for <b>' + esc(S.tq || S.scope) + "</b> in the last two days.</div>"; return; }
  const by = { hour: [], today: [], yday: [], old: [] };
  for (const n of shown) by[bucket(+n.published_ts, now)].push(n);
  el("feed").innerHTML = GROUPS.filter(([g]) => by[g].length).map(([g, label]) =>
    '<section class="grp grp--' + g + '"><div class="grp__hd"><span class="dot"></span><span class="grp__ttl">' + label + '</span><span class="grp__n">' + by[g].length + "</span></div>" +
    '<div class="grp__body">' + by[g].map((n) => artHTML(n, g)).join("") + "</div></section>").join("");
  document.title = "SCINTILLA · NEWS · " + (S.tq || S.scope);
}

/* ── what moved: the names with the most headlines today (every ticker-tagged row since midnight ET) ── */
async function loadMoved() {
  const midnight = (() => { const [y, m, d] = dayKey(new Date()).split("-").map(Number); let t = Date.UTC(y, m - 1, d, 4, 0, 0); /* 04:00Z is 00:00 ET in summer, 23:00 ET the day before in winter — corrected below */
    const back = new Date(t); if (dayKey(back) !== dayKey(new Date())) t += 3600000; return Math.floor(t / 1000); })();
  const rows = await pgAll("news?select=ticker,title,published_ts&published_ts=gte." + midnight + "&ticker=neq._MARKET&order=published_ts.desc", 10).catch(() => []);
  const counts = {}, last = {};
  for (const r of rows) { const t = String(r.ticker || "").toUpperCase(); if (!t) continue; counts[t] = (counts[t] || 0) + 1; if (!last[t]) last[t] = r; }
  const top = Object.entries(counts).sort((a, b) => b[1] - a[1] || a[0].localeCompare(b[0])).slice(0, 12);
  const max = top.length ? top[0][1] : 1;
  const inScope = (t) => { const m = scopeMembers(S.scope); return !m || m.indexOf(t) !== -1; };
  el("moved").innerHTML = "<h4>What moved · <b>today</b></h4>" + (top.length ? top.map(([t, c]) =>
    '<div class="mv' + (c >= 40 ? " is-hot" : "") + '" data-t="' + esc(t) + '" title="' + c + ' headlines today — show $' + esc(t) + '">' +
      '<span class="mv__tk' + (inScope(t) ? "" : " is-mkt") + '">$' + esc(t) + "</span>" +
      '<span class="mv__bar sc-clip"><i style="width:' + Math.max(4, Math.round(c / max * 100)) + '%"></i></span>' +
      '<span class="mv__n">' + c + "<small>today</small></span>" +
      '<div class="mv__last">' + esc(stripSrcTail(last[t].title, "")) + "</div></div>").join("") +
    '<div class="leg">' + rows.length.toLocaleString() + " ticker-tagged headlines since midnight ET · bar = share of the busiest name · dim name = outside this scope</div>"
    : '<div class="empty" style="padding:12px 0">no ticker-tagged headlines yet today.</div>');
}

/* ── notifications: ONE click on this device, by Alan ───────────────────────────────────────────── */
const DEV_KEY = "sc_push_device";
function guessDevice() {
  const ua = navigator.userAgent, standalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  const os = /iPhone/.test(ua) ? "iPhone" : /iPad|Macintosh.*Mobile/.test(ua) ? "iPad" : /Macintosh/.test(ua) ? "Mac" : "device";
  const br = /Brave/.test(ua) || (navigator.brave ? "Brave" : "") ? "Brave" : /CriOS|Chrome/.test(ua) ? "Chrome" : /Safari/.test(ua) ? "Safari" : "browser";
  return os + " · " + br + (standalone ? " app" : "");
}
async function pushStatus() {
  const st = el("pushSt"), btn = el("allowBtn");
  if (!("serviceWorker" in navigator) || !("PushManager" in window) || !("Notification" in window)) {
    st.innerHTML = /iPhone|iPad/.test(navigator.userAgent) && !navigator.standalone
      ? "on iPhone and iPad, add this page to the Home Screen first (Share › Add to Home Screen), then open it from there and allow"
      : "this browser cannot receive web push";
    btn.disabled = true; return;
  }
  const perm = Notification.permission;
  const dev = localStorage.getItem(DEV_KEY);
  if (!el("devName").value) el("devName").value = dev || guessDevice();
  if (perm === "denied") { st.className = "st is-err"; st.innerHTML = "<b>blocked</b> by this browser — allow notifications for this site in the browser's site settings, then reload"; btn.disabled = true; return; }
  const reg = await navigator.serviceWorker.getRegistration("/push/").catch(() => null);
  const sub = reg ? await reg.pushManager.getSubscription().catch(() => null) : null;
  if (perm === "granted" && sub) { st.className = "st"; st.innerHTML = "<b>allowed on this device</b> · " + esc(dev || "unnamed") + "<br>" + esc(new URL(sub.endpoint).host); btn.textContent = "Stop notifications here"; btn.dataset.mode = "off"; }
  else { st.className = "st"; st.innerHTML = "not yet allowed on this device"; btn.textContent = "Allow notifications"; btn.dataset.mode = "on"; }
  btn.disabled = false;
}
async function allow() {
  const st = el("pushSt"), btn = el("allowBtn"); btn.disabled = true;
  try {
    if (btn.dataset.mode === "off") {
      const reg = await navigator.serviceWorker.getRegistration("/push/"); const sub = reg && await reg.pushManager.getSubscription();
      if (sub) { await fetch(SB + "/rest/v1/push_subscriptions?endpoint=eq." + encodeURIComponent(sub.endpoint), { method: "DELETE", headers: { apikey: ANON, Authorization: "Bearer " + ANON } }).catch(() => {}); await sub.unsubscribe(); }
      localStorage.removeItem(DEV_KEY); return pushStatus();
    }
    st.textContent = "asking the browser …";
    const key = await fetch(FN + "?mode=vapid").then((r) => r.json());
    if (!key.publicKey) throw new Error("the notify-push function is not deployed yet (" + (key.error || "no key") + ")");
    const reg = await navigator.serviceWorker.register("/push-sw.js", { scope: "/push/" });
    await navigator.serviceWorker.ready.catch(() => {});
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("not allowed (" + perm + ")");
    const sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: key.publicKey });
    const j = sub.toJSON(), device = (el("devName").value || guessDevice()).slice(0, 40);
    const r = await fetch(SB + "/rest/v1/push_subscriptions", { method: "POST", headers: { apikey: ANON, Authorization: "Bearer " + ANON, "content-type": "application/json", Prefer: "resolution=ignore-duplicates,return=minimal" },
      body: JSON.stringify({ endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, device, ua: navigator.userAgent.slice(0, 200) }) });
    if (!r.ok) throw new Error("could not store the subscription (" + r.status + ": " + (await r.text()).slice(0, 120) + ")");
    localStorage.setItem(DEV_KEY, device);
    await pushStatus();
    st.innerHTML += "<br>stored · ask the coordinator for the test push";
  } catch (e) { st.className = "st is-err"; st.innerHTML = "<b>could not allow</b> · " + esc(String(e.message || e)); btn.disabled = false; }
}

/* ── wiring ───────────────────────────────────────────────────────────────── */
document.addEventListener("click", (e) => {
  const sc = e.target.closest("[data-scope]"); if (sc) { S.scope = sc.dataset.scope; S.tq = ""; el("q").value = ""; localStorage.setItem("sc_news_scope", S.scope); paintScopes(); fill(); loadMoved(); return; }
  const mv = e.target.closest(".mv[data-t]"); if (mv) { S.tq = mv.dataset.t; el("q").value = S.tq; history.replaceState(null, "", "#" + S.tq); fill(); return; }
  if (e.target.closest("#allowBtn")) allow();
});
el("qForm").addEventListener("submit", (e) => { e.preventDefault(); S.tq = el("q").value.trim().toUpperCase(); history.replaceState(null, "", S.tq ? "#" + S.tq : location.pathname); fill(); });
el("q").addEventListener("input", () => { if (!el("q").value) { S.tq = ""; fill(); } });
function clock() { el("clock").textContent = ET_CLOCK.format(new Date()) + " ET"; }
(async function boot() {
  clock(); setInterval(clock, 15000);
  try { await loadScopes(); } catch (e) { el("feed").innerHTML = '<div class="empty">could not read the lists — ' + esc(String(e.message || e)) + "</div>"; }
  S.scope = bootScope();
  const h = decodeURIComponent(location.hash.replace(/^#/, "")).toUpperCase();
  if (/^[A-Z0-9.\-]{1,10}$/.test(h)) { S.tq = h; el("q").value = h; }
  paintScopes(); fill(); loadMoved(); pushStatus();
  setInterval(() => { fill(); }, 60000);
  setInterval(() => { const hit = CACHE.get(scopeKey()); if (hit) paint(hit.items); }, 30000);   /* ages tick */
  setInterval(loadMoved, 5 * 60000);
})();
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
