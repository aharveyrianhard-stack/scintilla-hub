<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SCINTILLA · COMPS · LABELS, ROUND 3 · THE FOOTBALL FIELD</title>
<style>
/* greys only (every channel within 24 of the others, none above 210), plus the two direction colours
   Alan asked for everywhere: up = green, down = red. Here they carry the only directional fact on the
   chart: does today's price sit BELOW the peer median (room up, green) or ABOVE it (red). */
:root{color-scheme:dark;
 --bg:#0e0e0e;--panel:#141414;--sunk:#0a0a0a;
 --line:#2a2a2a;--line2:#363636;--line3:#4a4a4a;
 --ink:#cfcfcf;--ink2:#acacac;--dim:#8c8c8c;--mute:#6c6c6c;
 --box:#2a2a2e;--boxline:#5a5a60;--band:#34343a;
 --up:#4fae6a;--dn:#d0554a;
 --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink2)}
body{font-family:var(--mono);font-size:13px;line-height:1.5;letter-spacing:.02em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:1640px;margin:0 auto;padding:0 20px 80px;overflow-x:hidden}
.top{padding:16px 0 12px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.brand{font:400 12px/1.4 var(--mono);letter-spacing:.2em;color:var(--dim)}.brand b{color:var(--ink);font-weight:600}
.stamp{margin-left:auto;font:400 11px/1.5 var(--mono);color:var(--dim);letter-spacing:.06em;text-align:right}.stamp b{color:var(--ink2);font-weight:400}
h2{font:600 12px/1.4 var(--mono);letter-spacing:.22em;color:var(--ink);margin:30px 0 8px;text-transform:uppercase}
h2 small{font-weight:400;letter-spacing:.06em;color:var(--dim);text-transform:none;margin-left:10px;font-size:12px}
.panel{border:1px solid var(--line);background:var(--panel)}
.words{padding:12px 16px 14px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.words b{color:var(--ink);font-weight:600}
.words ul,.words ol{margin:4px 0 8px;padding-left:20px}
.words li{margin:4px 0}
.words li::marker{color:var(--mute)}
.words q{quotes:"“" "”";color:var(--ink)}
.words .up{color:var(--up)}.words .dn{color:var(--dn)}
.shot{padding:12px 16px 14px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--line2)}
.shot .clip{max-height:1300px;overflow:hidden;border:1px solid var(--line2)}
.shot .clip img{border:0}
.shot .clip.phone{width:390px;max-width:100%}
.shot small{display:block;margin-top:6px;font-size:11px;color:var(--dim)}
.two{display:grid;grid-template-columns:1fr 1fr}
.two > div + div{border-left:1px solid var(--line)}
.err{border:1px solid var(--line3);padding:14px;color:var(--ink);margin-top:20px}
.loading{padding:40px 0;color:var(--dim);letter-spacing:.2em}
/* the ticker switch */
.switch{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:12px 0 0}
.switch span{font:400 10.5px/1.4 var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase;margin-right:6px}
.switch button{-webkit-appearance:none;appearance:none;cursor:pointer;font:600 12px/1 var(--mono);letter-spacing:.14em;padding:8px 14px;background:var(--sunk);color:var(--dim);border:1px solid var(--line2);border-radius:3px}
.switch button[aria-pressed="true"]{color:var(--ink);border-color:var(--ink2);background:var(--panel)}
.switch button:hover{color:var(--ink)}

/* ---- the row: header | chart | upside ---- */
.colhead,.row{display:grid;grid-template-columns:240px minmax(0,1fr) 270px;gap:0 24px;align-items:center;padding:0 16px}
.colhead{padding-top:10px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.colhead span{font:400 10.5px/1.4 var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
.colhead span:last-child{text-align:right}
.row{padding-top:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .hd .nm{font:600 14px/1.3 var(--mono);color:var(--ink)}
.row .hd .bs{font:400 11.5px/1.5 var(--mono);color:var(--dim);margin-top:3px}
.row .hd .n{font:400 11px/1.5 var(--mono);color:var(--mute);margin-top:2px}
.row .ch{position:relative}
.row .ch svg{display:block;width:100%;height:auto;overflow:visible}
.row .ups{display:grid;grid-template-columns:auto 1fr;gap:1px 12px;font-size:12.5px;line-height:1.5;font-variant-numeric:tabular-nums}
.row .ups span{color:var(--dim)}
.row .ups b{color:var(--ink);font-weight:400;text-align:right;white-space:nowrap}
.row .ups b.med{font-weight:600}
.row .ups .today{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:12px;border-top:1px solid var(--line2);margin-top:5px;padding-top:5px}
.row .ups .today b{font-weight:600}
.row .ups .up{color:var(--up)}.row .ups .dn{color:var(--dn)}
.row .ups i{font-style:normal;color:var(--mute)}
.row .ups .no{grid-column:1/-1;color:var(--dim);font-size:11.5px}
/* the hero: the same row, larger */
.row.big{padding-top:22px;padding-bottom:22px}
.row.big .hd .nm{font-size:18px}
.row.big .hd .bs{font-size:12.5px}
.row.big .ups{font-size:14px;line-height:1.6}
.legend{display:flex;gap:18px 26px;flex-wrap:wrap;padding:10px 16px 12px;font-size:11px;color:var(--dim);border-top:1px solid var(--line);line-height:1.5}
.legend span{display:inline-block}
.legend i{display:inline-block;vertical-align:middle;margin-right:7px}
.legend svg{display:inline-block;vertical-align:middle;margin-right:7px}
.legend .caps{font-size:9px;letter-spacing:.14em;color:var(--dim);margin-right:7px}
/* the svg */
.wh{stroke:var(--ink2);stroke-width:2}
.box{fill:var(--box);stroke:var(--boxline);stroke-width:1}
.env{stroke:var(--line3);stroke-width:1;stroke-dasharray:2 3}
.inner{fill:var(--band);stroke:var(--boxline);stroke-width:1}
.med{stroke:var(--ink);stroke-width:3}
.own-line{stroke-width:1.5;stroke-dasharray:3 3}
.own-dot{stroke-width:1}
.up-stroke{stroke:var(--up)}.dn-stroke{stroke:var(--dn)}
.up-fill{fill:var(--up)}.dn-fill{fill:var(--dn)}
.arrow{stroke-width:1.5;fill:none}
.tie{stroke:var(--line3);stroke-width:1}
.tick{stroke:var(--ink2);stroke-width:1}
.word{font:500 8.5px var(--mono);fill:var(--dim);letter-spacing:.12em}
.word.own{font-weight:700}
.num{font:400 11.5px var(--mono);fill:var(--ink2)}
.num.bold{font-weight:700;fill:var(--ink)}
.price{font:400 11.5px var(--mono);fill:var(--ink2)}
.price.bold{font-weight:700}
.tag{font:400 9px var(--mono);fill:var(--dim);letter-spacing:.06em}
.uptext{font:600 10.5px var(--mono);letter-spacing:.04em;paint-order:stroke;stroke:var(--panel);stroke-width:4px;stroke-linejoin:round}
.pick .uptext{stroke:var(--sunk)}
.big .num,.big .price{font-size:13.5px}
.big .word{font-size:9.5px}
.big .uptext{font-size:12px}
.note{padding:8px 16px 10px;font-size:11.5px;color:var(--dim);border-top:1px solid var(--line)}
.note b{color:var(--ink2);font-weight:400}
/* the three ways */
.way .hd .nm{font-size:13px}
.way .hd .rule{font:400 11px/1.45 var(--mono);color:var(--dim);margin-top:4px}
.way.pick{background:var(--sunk)}
.way .hd .badge{display:inline-block;font:600 9px/1 var(--mono);letter-spacing:.16em;color:var(--ink);border:1px solid var(--ink2);padding:4px 6px;margin-bottom:6px}
table.t{width:100%;border-collapse:collapse;font-size:12px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:5px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th{font:400 10px/1.4 var(--mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t td{color:var(--ink2)}table.t td.k{color:var(--ink)}
table.t .up{color:var(--up)}table.t .dn{color:var(--dn)}
.tw{overflow-x:auto;padding:0 16px 10px}

@media(max-width:1000px){
 .colhead{display:none}
 .row{grid-template-columns:1fr;gap:10px 0}
 .row .ups{grid-template-columns:auto 1fr auto 1fr;gap:2px 10px}
 .row .ups .today{grid-column:1/-1}
 .row.big .hd .nm{font-size:16px}
}
@media(max-width:760px){
 .wrap{padding:0 12px 60px}
 .two{grid-template-columns:1fr}.two > div + div{border-left:0;border-top:1px solid var(--line)}
 .stamp{margin-left:0;text-align:left}
 .row .ups{grid-template-columns:auto 1fr}
 .row .ups b{padding-right:8px}
 .legend{gap:10px 18px}
}
</style></head>
<body>
<div class="wrap">
<div class="top"><span class="brand"><b>SCINTILLA</b> · COMPS · LABELS, ROUND 3 · THE FOOTBALL FIELD</span><span data-scnav-slot></span><span class="stamp" id="stamp">reading…</span></div>
<div class="switch" id="switch"><span>Company</span></div>
<div id="app" class="loading">READING…</div>
</div>

<script type="module">
import { rowMarks, rowScale, rowUpside, upsideTo, upsideWords, combined, combinedScale, basisLine, stagger, DEFAULT_WEIGHTS, MARK_WORDS } from "./labels-r3.mjs";
import { fmt, dateWord } from "../../20260927/comps-r3/r3.mjs";

const TICKERS = ["MU", "GEV", "NVDA"], DATE = "2026-09-28";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const X = (v) => fmt("x", v), P = (v) => fmt("price", v), MONEY = (v) => fmt("money", v), USD = (v) => fmt("usd2", v);
const P0 = (v) => v == null ? "—" : "$" + Math.round(v).toLocaleString("en-US");
const SVG = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => { const e = document.createElementNS(SVG, tag); for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v); if (text != null) e.textContent = text; return e; };
const SHORT = { pe_ttm: "P/E", pe_fwd: "P/E fwd", ev_sales: "EV/S", ev_ebitda: "EV/EBITDA", ps: "P/S", peg: "PEG" };
const WAY_WORDS = { A: { lo: "LOWEST MEDIAN", mid: "MEDIAN OF MEDIANS", hi: "HIGHEST MEDIAN" }, B: { lo: "LOW EDGE", mid: "CENTRE", hi: "HIGH EDGE" }, C: { lo: "LOW EDGE", mid: "CENTRE", hi: "HIGH EDGE" } };

let D = null, T = "MU";
async function load(t) { D = await (await fetch(`snapshot-${t}-${DATE}.json`, { cache: "no-store" })).json(); T = D.ticker; }

/* ---- the label lanes: measure, spread, tie ------------------------------------------------------- */
const widthOf = (t, fallback) => { try { const w = t.getComputedTextLength(); if (w > 0) return w; } catch (_) {} return fallback; };

/* ---- one valuation row --------------------------------------------------------------------------- */
function rowNode(row, { big = false } = {}) {
  const div = document.createElement("div");
  div.className = "row" + (big ? " big" : "");
  const U = rowUpside(row);
  const cell = (u, word, med) => { const w = upsideWords(u, P); return w ? `<span>to the ${word}</span><b class="${med ? "med " : ""}${w.up ? "up" : "dn"}">${esc(w.pct)} <i>·</i> ${esc(w.dollars)}</b>` : `<span>to the ${word}</span><b>—</b>`; };
  const ups = row.ok
    ? `${cell(U.q1, "25th")}${cell(U.median, "median", true)}${cell(U.q3, "75th")}<div class="today"><span>${esc(T)} today</span><b>${esc(P(row.own.price))} <i>·</i> ${esc(X(row.own.multiple))}</b></div>`
    : `<div class="no">${esc(row.reason || "this row cannot be priced")}</div>`;
  div.innerHTML = `
    <div class="hd"><div class="nm">${esc(row.label)}</div><div class="bs">${esc(basisLine(row, MONEY, USD))}</div><div class="n">${row.n} peer${row.n === 1 ? "" : "s"} carry it</div></div>
    <div class="ch"><svg></svg></div>
    <div class="ups">${ups}</div>`;
  const svg = div.querySelector("svg");
  const draw = () => drawRow(svg, row, { big, width: div.querySelector(".ch").clientWidth || 600 });
  new ResizeObserver(draw).observe(div.querySelector(".ch"));
  requestAnimationFrame(draw);
  return div;
}

/* The chart. Top lane: the mark's name in small caps over its MULTIPLE. The shapes: a line from the lowest
   peer to the highest, a box for the middle half, a thick tick at the median, and the company's own diamond
   on a dashed line in the direction colour. Under the box: the arrow from today to the median with the upside
   in words. Bottom lane: the PRICE each mark implies. */
function drawRow(svg, row, { big, width }) {
  const W = Math.max(200, Math.floor(width));
  const k = big ? 1.18 : 1;
  const wordH = 10 * k, numH = 13 * k, boxH = 22 * k, capH = 12 * k, arrowH = 30 * k, priceH = 16 * k;
  const marks = rowMarks(row, T);
  const s = rowScale(row, { width: W, pad: 12 });
  const x = (m) => Math.round(s.x(m) * 10) / 10;
  const b = row.band, own = marks.find((m) => m.own);
  const med = b.median, up = own ? own.multiple <= med : true;
  const dir = up ? "up" : "dn";
  // measure first: draw the texts at y=0, measure, then decide the tiers and the heights
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const tops = marks.map((m) => {
    const g = el("g", { class: "top" });
    const w = el("text", { class: "word" + (m.own ? " own" : ""), y: 0 }, m.word);
    const n = el("text", { class: "num" + (m.own ? " bold" : ""), y: 0 }, X(m.multiple));
    if (m.own) { w.setAttribute("fill", `var(--${dir})`); n.setAttribute("fill", `var(--${dir})`); }
    g.appendChild(w); g.appendChild(n); svg.appendChild(g);
    return { m, g, w, n, width: Math.max(widthOf(w, m.word.length * 6.4 * k), widthOf(n, X(m.multiple).length * 7.1 * k)) };
  });
  const bots = marks.map((m) => {
    const t = el("text", { class: "price" + (m.own ? " bold" : ""), y: 0 }, m.price != null ? P0(m.price) : "—");
    if (m.own) t.setAttribute("fill", `var(--${dir})`);
    svg.appendChild(t);
    return { m, t, width: widthOf(t, 7 * 7.1 * k) };
  });
  const topRes = stagger(tops.map((t) => ({ id: t.m.id, x: x(t.m.multiple), w: t.width, anchor: t.m.anchor })), { width: W, gap: 10 });
  const botRes = stagger(bots.map((t) => ({ id: t.m.id, x: x(t.m.multiple), w: t.width, anchor: t.m.anchor })), { width: W, gap: 10 });
  const topTiers = Math.max(...topRes.map((r) => r.tier)) + 1, botTiers = Math.max(...botRes.map((r) => r.tier)) + 1;
  const tierH = wordH + numH + 4;
  const yTop0 = 2 + (topTiers - 1) * tierH;                 // baseline area of tier 0 (nearest the shapes)
  const lineTop = yTop0 + wordH + numH + 6;
  const mid = lineTop + 4 + boxH / 2;
  const boxTop = mid - boxH / 2, boxBot = mid + boxH / 2;
  const yArrow = boxBot + 12 * k, yArrowText = yArrow + 13 * k;
  const yBot0 = boxBot + arrowH + 8 + priceH;               // tier 0 of the price lane
  const H = yBot0 + (botTiers - 1) * (priceH + 2) + 6;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  // shapes
  svg.appendChild(el("line", { class: "wh", x1: x(b.min), x2: x(b.max), y1: mid, y2: mid }));
  svg.appendChild(el("line", { class: "wh", x1: x(b.min), x2: x(b.min), y1: mid - capH / 2, y2: mid + capH / 2 }));
  svg.appendChild(el("line", { class: "wh", x1: x(b.max), x2: x(b.max), y1: mid - capH / 2, y2: mid + capH / 2 }));
  svg.appendChild(el("rect", { class: "box", x: x(b.q1), y: boxTop, width: Math.max(1, x(b.q3) - x(b.q1)), height: boxH }));
  svg.appendChild(el("line", { class: "med", x1: x(med), x2: x(med), y1: boxTop, y2: boxBot }));
  // the top lane
  topRes.forEach((r, i) => {
    const t = tops[i], m = t.m, cx = m.anchor === "start" ? r.left : m.anchor === "end" ? r.right : (r.left + r.right) / 2;
    const yWord = yTop0 - r.tier * tierH + wordH - 2, yNum = yWord + numH;
    t.w.setAttribute("y", yWord); t.n.setAttribute("y", yNum);
    const anchor = m.anchor === "start" ? "start" : m.anchor === "end" ? "end" : "middle";
    const ax = anchor === "start" ? r.left : anchor === "end" ? r.right : cx;
    t.w.setAttribute("text-anchor", anchor); t.n.setAttribute("text-anchor", anchor); t.w.setAttribute("x", ax); t.n.setAttribute("x", ax);
    const px = x(m.multiple);
    if (m.own) return;                                       // the own mark gets its dashed line below
    if (Math.abs(cx - px) > 4 || r.tier > 0) {               // a label that moved, or sits on the back tier: a thin tie to its mark
      const y1 = yNum + 3, y2 = m.id === "q1" || m.id === "q3" ? boxTop - 1 : m.id === "median" ? boxTop - 1 : mid - capH / 2 - 1;
      svg.appendChild(el("polyline", { class: "tie", fill: "none", points: `${cx},${y1} ${cx},${(y1 + y2) / 2} ${px},${(y1 + y2) / 2} ${px},${y2}` }));
    } else svg.appendChild(el("line", { class: "tick", x1: px, x2: px, y1: yNum + 3, y2: lineTop }));
  });
  // the bottom lane
  botRes.forEach((r, i) => {
    const t = bots[i], m = t.m, cx = m.anchor === "start" ? r.left : m.anchor === "end" ? r.right : (r.left + r.right) / 2;
    const y = yBot0 + r.tier * (priceH + 2);
    const anchor = m.anchor === "start" ? "start" : m.anchor === "end" ? "end" : "middle";
    t.t.setAttribute("text-anchor", anchor); t.t.setAttribute("x", anchor === "start" ? r.left : anchor === "end" ? r.right : cx); t.t.setAttribute("y", y);
    const px = x(m.multiple);
    if (m.own) return;
    const yTopOfText = y - priceH + 3, yFrom = m.id === "min" || m.id === "max" ? mid + capH / 2 + 1 : boxBot + 1;
    if (Math.abs(cx - px) > 4 || r.tier > 0) svg.appendChild(el("polyline", { class: "tie", fill: "none", points: `${px},${yFrom} ${px},${yArrowText + 6} ${cx},${yArrowText + 6} ${cx},${yTopOfText}` }));
    else svg.appendChild(el("line", { class: "tick", x1: px, x2: px, y1: yFrom, y2: yTopOfText, "stroke-dasharray": "1 3" }));
  });
  // the company's own mark: a dashed line from its top label to its bottom label, a diamond on the peer line
  if (own) {
    const px = x(own.multiple), rTop = topRes[tops.findIndex((t) => t.m.own)], rBot = botRes[bots.findIndex((t) => t.m.own)];
    const yTopLabel = yTop0 - rTop.tier * tierH + wordH + numH + 2, yBotLabel = yBot0 + rBot.tier * (priceH + 2) - priceH + 3;
    svg.appendChild(el("line", { class: `own-line ${dir}-stroke`, x1: px, x2: px, y1: yTopLabel, y2: yBotLabel }));
    const d = 5 * k;
    svg.appendChild(el("polygon", { class: `own-dot ${dir}-fill ${dir}-stroke`, points: `${px},${mid - d} ${px + d},${mid} ${px},${mid + d} ${px - d},${mid}` }));
    // the arrow from today to the median, with the upside in words
    const u = upsideTo(row.own.price, row.ends.median.price), words = upsideWords(u, P);
    const xm = x(med);
    if (words && Math.abs(xm - px) > 1) {
      const dirX = xm > px ? 1 : -1, ah = 4 * k;
      svg.appendChild(el("line", { class: `arrow ${dir}-stroke`, x1: px, x2: xm - dirX * ah, y1: yArrow, y2: yArrow }));
      svg.appendChild(el("polygon", { class: `${dir}-fill`, points: `${xm},${yArrow} ${xm - dirX * ah * 1.8},${yArrow - ah} ${xm - dirX * ah * 1.8},${yArrow + ah}` }));
      const t = el("text", { class: "uptext", fill: `var(--${dir})`, y: yArrowText }, words.line);
      svg.appendChild(t);
      const tw = widthOf(t, words.line.length * 6.6 * k), c = (px + xm) / 2;
      let left = Math.max(2, Math.min(W - tw - 2, c - tw / 2));
      t.setAttribute("x", left);
    } else if (words) {
      const t = el("text", { class: "uptext", fill: `var(--${dir})`, y: yArrowText }, "at the median today");
      svg.appendChild(t); const tw = widthOf(t, 20 * 6.6); t.setAttribute("x", Math.max(2, Math.min(W - tw - 2, px - tw / 2)));
    }
  }
}

/* ---- one way of the combined field, on the $ axis ------------------------------------------------ */
function wayNode(way, ways, { pick = false } = {}) {
  const div = document.createElement("div");
  div.className = "row way" + (pick ? " pick" : "");
  const price = D.price;
  const cell = (u, word, med) => { const w = upsideWords(u, P); return w ? `<span>to the ${word}</span><b class="${med ? "med " : ""}${w.up ? "up" : "dn"}">${esc(w.pct)} <i>·</i> ${esc(w.dollars)}</b>` : `<span>to the ${word}</span><b>—</b>`; };
  const lo = WAY_WORDS[way.way].lo.toLowerCase(), hi = WAY_WORDS[way.way].hi.toLowerCase(), mid = "centre";
  div.innerHTML = `
    <div class="hd">${pick ? `<div class="badge">RECOMMENDED FOR TRANCHES</div>` : ""}<div class="nm">${esc(way.way)} · ${esc(way.name)}</div><div class="rule">${esc(way.rule)}</div></div>
    <div class="ch"><svg></svg></div>
    <div class="ups">${way.ok ? `${cell(way.upside.lo, lo)}${cell(way.upside.mid, mid, true)}${cell(way.upside.hi, hi)}<div class="today"><span>${esc(T)} today</span><b>${esc(P(price))}</b></div>` : `<div class="no">${esc(way.reason)}</div>`}</div>`;
  const svg = div.querySelector("svg");
  const draw = () => drawWay(svg, way, ways, { width: div.querySelector(".ch").clientWidth || 600 });
  new ResizeObserver(draw).observe(div.querySelector(".ch"));
  requestAnimationFrame(draw);
  return div;
}

function drawWay(svg, way, ways, { width }) {
  const W = Math.max(200, Math.floor(width));
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  if (!way.ok) { svg.setAttribute("height", 20); return; }
  const wordH = 10, numH = 13, boxH = 22, capH = 12, priceH = 14;
  const s = combinedScale(ways, D.price, { width: W, pad: 12 });
  const x = (p) => Math.round(s.x(p) * 10) / 10;
  const price = D.price, up = price <= way.mid, dir = up ? "up" : "dn";
  const marks = [
    { id: "lo", word: WAY_WORDS[way.way].lo, price: way.lo, anchor: "start" },
    { id: "mid", word: WAY_WORDS[way.way].mid, price: way.mid, anchor: "middle" },
    { id: "hi", word: WAY_WORDS[way.way].hi, price: way.hi, anchor: "end" },
    { id: "own", word: `${T} TODAY`, price, anchor: "middle", own: true },
  ].sort((a, b) => a.price - b.price);
  const tops = marks.map((m) => {
    const g = el("g"); const w = el("text", { class: "word" + (m.own ? " own" : ""), y: 0 }, m.word); const n = el("text", { class: "num" + (m.own ? " bold" : ""), y: 0 }, P0(m.price));
    if (m.own) { w.setAttribute("fill", `var(--${dir})`); n.setAttribute("fill", `var(--${dir})`); }
    g.appendChild(w); g.appendChild(n); svg.appendChild(g);
    return { m, w, n, width: Math.max(widthOf(w, m.word.length * 6.4), widthOf(n, 7 * 7.1)) };
  });
  // the bottom lane: every metric's contribution, tagged with its short name
  const pts = (way.points || []).map((p) => ({ id: p.key, tag: SHORT[p.key] || p.key, price: p.price ?? p.mid, lo: p.lo, hi: p.hi }));
  const bots = pts.map((p) => { const t = el("text", { class: "tag", y: 0 }, p.tag); svg.appendChild(t); return { p, t, width: widthOf(t, p.tag.length * 5.6) }; });
  const topRes = stagger(tops.map((t) => ({ id: t.m.id, x: x(t.m.price), w: t.width, anchor: t.m.anchor })), { width: W, gap: 10 });
  const botRes = stagger(bots.map((t) => ({ id: t.p.id, x: x(t.p.price), w: t.width, anchor: "middle" })), { width: W, gap: 8 });
  const topTiers = Math.max(...topRes.map((r) => r.tier)) + 1, botTiers = bots.length ? Math.max(...botRes.map((r) => r.tier)) + 1 : 0;
  const tierH = wordH + numH + 4;
  const yTop0 = 2 + (topTiers - 1) * tierH, lineTop = yTop0 + wordH + numH + 6;
  const mid = lineTop + 4 + boxH / 2, boxTop = mid - boxH / 2, boxBot = mid + boxH / 2;
  const yArrow = boxBot + 12, yArrowText = yArrow + 13;
  const yTicks = yArrowText + 8, yBot0 = yTicks + 8 + priceH;
  const H = yBot0 + Math.max(0, botTiers - 1) * (priceH + 2) + 6;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);
  // shapes: the envelope (B), the band, the strict overlap (B), the centre
  if (way.envelope) svg.appendChild(el("line", { class: "env", x1: x(way.envelope.lo), x2: x(way.envelope.hi), y1: mid, y2: mid }));
  if (way.way === "A") {
    svg.appendChild(el("line", { class: "wh", x1: x(way.lo), x2: x(way.hi), y1: mid, y2: mid }));
    svg.appendChild(el("line", { class: "wh", x1: x(way.lo), x2: x(way.lo), y1: mid - capH / 2, y2: mid + capH / 2 }));
    svg.appendChild(el("line", { class: "wh", x1: x(way.hi), x2: x(way.hi), y1: mid - capH / 2, y2: mid + capH / 2 }));
  } else {
    svg.appendChild(el("rect", { class: "box", x: x(way.lo), y: boxTop, width: Math.max(1, x(way.hi) - x(way.lo)), height: boxH }));
    if (way.overlap) svg.appendChild(el("rect", { class: "inner", x: x(way.overlap.lo), y: boxTop + 5, width: Math.max(1, x(way.overlap.hi) - x(way.overlap.lo)), height: boxH - 10 }));
  }
  svg.appendChild(el("line", { class: "med", x1: x(way.mid), x2: x(way.mid), y1: boxTop, y2: boxBot }));
  // each metric: a small tick on the line (its median price) and, for B and C, a faint span of its middle half
  for (const p of pts) {
    if (p.lo != null && p.hi != null && way.way !== "A") svg.appendChild(el("line", { class: "env", x1: x(p.lo), x2: x(p.hi), y1: yTicks, y2: yTicks }));
    svg.appendChild(el("line", { class: "tick", x1: x(p.price), x2: x(p.price), y1: way.way === "A" ? mid - 5 : yTicks - 4, y2: way.way === "A" ? mid + 5 : yTicks + 4 }));
  }
  // top lane
  topRes.forEach((r, i) => {
    const t = tops[i], m = t.m, cx = m.anchor === "start" ? r.left : m.anchor === "end" ? r.right : (r.left + r.right) / 2;
    const yWord = yTop0 - r.tier * tierH + wordH - 2, yNum = yWord + numH;
    const anchor = m.anchor === "start" ? "start" : m.anchor === "end" ? "end" : "middle", ax = anchor === "start" ? r.left : anchor === "end" ? r.right : cx;
    for (const e of [t.w, t.n]) { e.setAttribute("text-anchor", anchor); e.setAttribute("x", ax); }
    t.w.setAttribute("y", yWord); t.n.setAttribute("y", yNum);
    const px = x(m.price);
    if (m.own) return;
    if (Math.abs(cx - px) > 4 || r.tier > 0) svg.appendChild(el("polyline", { class: "tie", fill: "none", points: `${cx},${yNum + 3} ${cx},${(yNum + 3 + boxTop) / 2} ${px},${(yNum + 3 + boxTop) / 2} ${px},${boxTop - 1}` }));
    else svg.appendChild(el("line", { class: "tick", x1: px, x2: px, y1: yNum + 3, y2: lineTop }));
  });
  // bottom lane: the metric tags
  botRes.forEach((r, i) => {
    const t = bots[i], cx = (r.left + r.right) / 2, y = yBot0 + r.tier * (priceH + 2);
    t.t.setAttribute("text-anchor", "middle"); t.t.setAttribute("x", cx); t.t.setAttribute("y", y);
    const px = x(t.p.price);
    if (Math.abs(cx - px) > 3 || r.tier > 0) svg.appendChild(el("polyline", { class: "tie", fill: "none", points: `${px},${yTicks + 4} ${px},${yTicks + 7} ${cx},${yTicks + 7} ${cx},${y - priceH + 4}` }));
    else svg.appendChild(el("line", { class: "tick", x1: px, x2: px, y1: yTicks + 4, y2: y - priceH + 4, "stroke-dasharray": "1 3" }));
  });
  // the company today: dashed line, diamond, the arrow to the centre
  const own = marks.find((m) => m.own), rTop = topRes[marks.indexOf(own)], px = x(price);
  svg.appendChild(el("line", { class: `own-line ${dir}-stroke`, x1: px, x2: px, y1: yTop0 - rTop.tier * tierH + wordH + numH + 2, y2: yTicks - 6 }));
  svg.appendChild(el("polygon", { class: `own-dot ${dir}-fill ${dir}-stroke`, points: `${px},${mid - 5} ${px + 5},${mid} ${px},${mid + 5} ${px - 5},${mid}` }));
  const words = upsideWords(way.upside.mid, P, "centre"), xm = x(way.mid);
  if (words && Math.abs(xm - px) > 1) {
    const dirX = xm > px ? 1 : -1, ah = 4;
    svg.appendChild(el("line", { class: `arrow ${dir}-stroke`, x1: px, x2: xm - dirX * ah, y1: yArrow, y2: yArrow }));
    svg.appendChild(el("polygon", { class: `${dir}-fill`, points: `${xm},${yArrow} ${xm - dirX * ah * 1.8},${yArrow - ah} ${xm - dirX * ah * 1.8},${yArrow + ah}` }));
    const t = el("text", { class: "uptext", fill: `var(--${dir})`, y: yArrowText }, words.line); svg.appendChild(t);
    const tw = widthOf(t, words.line.length * 6.6); t.setAttribute("x", Math.max(2, Math.min(W - tw - 2, (px + xm) / 2 - tw / 2)));
  }
}

    `${arrow}the arrow from ${esc(T)} today to the centre, with the upside in percent and dollars`,

  const thin = D.rows.filter((r) => r.n < 6).map((r) => `${r.label} (${r.n})`);

<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
