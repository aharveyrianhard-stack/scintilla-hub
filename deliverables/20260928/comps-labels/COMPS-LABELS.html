<!doctype html>
<html lang="en"><head><meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">
<title>SCINTILLA · COMPS · LABELS ON THE CHART</title>
<style>
/* The Hub's own :root, as the comps round-3 page uses it; the two direction steps only for MU's own readout. */
:root{color-scheme:dark;
 --bg:#0A0A0F;--panel:#0D0D14;--panel2:#0F0F1A;--sunk:#08080C;
 --line:#1A1A2A;--line2:#252538;--line3:#3A3F5C;
 --ink:#F2F2F8;--ink2:#C6C8DE;--ink3:#9A9AB6;
 --crk:#00D4FF;--good:#1DC98B;--bad:#FF2D55;
 --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;background:var(--bg);color:var(--ink2)}
body{font-family:var(--mono);font-size:13px;line-height:1.5;letter-spacing:.02em;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
.wrap{max-width:1640px;margin:0 auto;padding:0 20px 80px;overflow-x:hidden}
.top{padding:16px 0 12px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.brand{font:400 12px/1.4 var(--mono);letter-spacing:.2em;color:var(--ink3)}.brand b{color:var(--ink);font-weight:600}
.stamp{margin-left:auto;font:400 11px/1.5 var(--mono);color:var(--ink3);letter-spacing:.06em;text-align:right}.stamp b{color:var(--ink2);font-weight:400}
h2{font:600 12px/1.4 var(--mono);letter-spacing:.22em;color:var(--crk);margin:30px 0 6px;text-transform:uppercase}
h2 small{font-weight:400;letter-spacing:.06em;color:var(--ink3);text-transform:none;margin-left:10px;font-size:12px}
.panel{border:1px solid var(--line);background:var(--panel)}
.cap{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;padding:12px 16px 0}
.cap .t{font:600 16px/1.3 var(--mono);color:var(--ink)}
.cap .s{font-size:12px;color:var(--ink3)}
.cap .s b{color:var(--ink2);font-weight:400}
.chart{padding:4px 16px 8px}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.legend{display:flex;gap:22px;flex-wrap:wrap;padding:8px 16px 12px;font-size:11.5px;color:var(--ink3);border-top:1px solid var(--line)}
.legend i{display:inline-block;vertical-align:-2px;margin-right:6px}
.note{padding:10px 16px 12px;font-size:12.5px;color:var(--ink2);line-height:1.55;border-top:1px solid var(--line)}
.note b{color:var(--ink);font-weight:600}
.good{color:var(--good)}.bad{color:var(--bad)}
.words{padding:12px 16px 14px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
.words b{color:var(--ink);font-weight:600}
.words ul,.words ol{margin:4px 0 8px;padding-left:20px}
.words li{margin:3px 0}
.words li::marker{color:var(--ink3)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0}
.two > div + div{border-left:1px solid var(--line)}
.shot{padding:12px 16px 14px}
.shot img{display:block;width:100%;height:auto;border:1px solid var(--line2)}
.shot small{display:block;margin-top:6px;font-size:11px;color:var(--ink3)}
.err{border:1px solid var(--bad);padding:14px;color:var(--ink);margin-top:20px}
.loading{padding:40px 0;color:var(--ink3);letter-spacing:.2em}
/* the svg */
.ax{stroke:var(--line3);stroke-width:1}
.tk{stroke:var(--line3);stroke-width:1}
.tx{font:400 11px var(--mono);fill:var(--ink3)}
.tx.b{font-size:11.5px;fill:var(--ink2)}
.axt{font:400 10.5px var(--mono);fill:var(--ink3);letter-spacing:.14em;text-transform:uppercase}
.wh{stroke:var(--ink3);stroke-width:2}
.cap-l{stroke:var(--ink3);stroke-width:2}
.box{fill:#2E3248;stroke:#5A6088;stroke-width:1}
.med{stroke:var(--ink);stroke-width:3}
.me-line{stroke:var(--ink);stroke-width:2;stroke-dasharray:4 4}
.lead{stroke:var(--ink3);stroke-width:1}
.lead.me{stroke:var(--ink2)}
.dot{fill:var(--ink3);stroke:var(--panel);stroke-width:1.5}
.dot.end{fill:var(--ink2)}
.lab .h{font:400 10px var(--mono);fill:var(--ink3);letter-spacing:.14em}
.lab .v{font:400 12.5px var(--mono);fill:var(--ink)}
.lab.me .v{font-weight:600}
.lab .t{font:400 11.5px var(--mono);fill:var(--good)}
.lab .t.bad{fill:var(--bad)}
.lab .bg{fill:var(--panel);opacity:.92}
.pn{font:400 11px var(--mono);fill:var(--ink3)}
.pn.end{fill:var(--ink2)}
.pt{stroke:var(--line3);stroke-width:1}
.pt.end{stroke:var(--ink3)}
.pn .bad{fill:var(--bad)}

@media(max-width:760px){
 .wrap{padding:0 12px 60px}
 .two{grid-template-columns:1fr}.two > div + div{border-left:0;border-top:1px solid var(--line)}
 .stamp{margin-left:0;text-align:left}
 .cap .t{font-size:14px}
}
</style></head>
<body>
<div class="wrap">
<div class="top"><span class="brand"><b>SCINTILLA</b> · COMPS · LABELS ON THE CHART</span><span data-scnav-slot></span><span class="stamp" id="stamp">reading…</span></div>
<div id="app" class="loading">READING…</div>
</div>

<script type="module">
import { placeLabels, placeStrip, rowLabels, withoutPeers, sanity } from "./labels.mjs";
import { peerBand, niceTicks, fmt, dateWord } from "../../20260927/comps-r3/r3.mjs";

const SNAP = "snapshot-2026-09-28.json", CHECKS = "checks-2026-09-28.json";
const Q = new URLSearchParams(location.search);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const X = (v) => fmt("x", v), P = (v) => fmt("price", v), PC = (v) => fmt("pct", v);

/* ---- the numbers: the dated snapshot (taken on the live page's arithmetic), or live on the Hub with ?live=1 ---- */
let D = null;
async function load() {
  if (Q.get("live") === "1" && !["localhost", "127.0.0.1"].includes(location.hostname)) return live();
  D = await (await fetch(SNAP, { cache: "no-store" })).json();
  D.mode = "SNAPSHOT";
  D.checks = await (await fetch(CHECKS, { cache: "no-store" })).json();
}
/* Live: the same tables and the same arithmetic as snapshot.mjs, read in the browser with the Hub's own runtime key discovery. */
async function live() {
  const [{ buildInputs, compsRead, cohortFor }, { num, tsToISO }] = await Promise.all([import("../../20260927/comps-r3/r3.mjs"), import("../../20260925/knockout/field.mjs")]);
  const SB = "https://wadinxqplrggagkvrdag.supabase.co", API = "https://scintilla-massive-chart-api.fly.dev";
  let KEY = null;
  for (const page of ["/pip.html", "/index.html"]) { try { const m = (await (await fetch(page, { cache: "no-store" })).text()).match(/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_.\-]+/); if (m) { KEY = m[0]; break; } } catch (_) {} }
  if (!KEY) throw new Error("no read key could be found on this site");
  const pg = async (p) => { const r = await fetch(SB + "/rest/v1/" + p, { headers: { apikey: KEY, Authorization: "Bearer " + KEY } }); if (!r.ok) throw new Error(p.split("?")[0] + " → " + r.status); return r.json(); };
  const TICKER = (Q.get("t") || "MU").toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
  const TODAY = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
  const own = await pg(`ticker_cohorts?select=ticker,cohort&ticker=eq.${TICKER}`);
  const cohort = cohortFor(TICKER, [...new Set(own.map((x) => x.cohort))], Q.get("cohort"));
  if (!cohort) throw new Error(TICKER + " carries no cohort tag");
  const mem = await pg(`ticker_cohorts?select=ticker&cohort=eq.${encodeURIComponent(cohort)}&order=ticker.asc`);
  const T = [...new Set([TICKER, ...mem.map((m) => m.ticker)])], inq = "in.(" + T.join(",") + ")";
  const [fund, prof, quotes] = await Promise.all([
    pg(`fundamentals?select=ticker,price,market_cap,eps_ttm,adjusted_eps_ttm,revenue_ttm,trailing_pe,adjusted_pe,updated_ts&ticker=${inq}`),
    pg(`company_profile?select=ticker,name,industry,is_etf&ticker=${inq}`),
    fetch(`${API}/quotes?symbols=${encodeURIComponent(T.join(","))}`).then((r) => r.json()).catch((e) => ({ quotes: {}, error: String(e.message || e) })),
  ]);
  const qmap = quotes.quotes && typeof quotes.quotes === "object" ? quotes.quotes : {};
  const first = (rows, t) => rows.find((r) => r.ticker === t) || null;
  const src = (t) => { const f = first(fund, t) || {}, q = qmap[t] && qmap[t].price != null ? qmap[t] : null; return { ticker: t, profile: first(prof, t) || {}, tags: [], fundamentals: { ...f, date: tsToISO(f.updated_ts) }, quote: q, price_date: q && q.price_observation_utc ? String(q.price_observation_utc).slice(0, 10) : tsToISO(f.updated_ts), estimates: [], incQ: [], incFY: [], cfQ: [], cfFY: [], balance: [], next_report: null, target: null, geiger: null, heartbeat: null }; };
  const inputs = T.map((t) => buildInputs(src(t), TODAY)).filter((i) => i && i.ticker), me = inputs.find((i) => i.ticker === TICKER);
  const take = (outOut) => {
    const read = compsRead(me, inputs, { outOut }), rd = read.rows.find((r) => r.key === "pe_ttm"), bar = read.bars.find((b) => b.key === "pe_ttm");
    const peer = (x) => ({ ticker: x.ticker, name: (first(prof, x.ticker) || {}).name || x.ticker, multiple: x.value, implied: me.eps_ttm > 0 ? x.value * me.eps_ttm : null, price: num(inputs.find((i) => i.ticker === x.ticker)?.price), eps: num(inputs.find((i) => i.ticker === x.ticker)?.eps_ttm) });
    return { outOut, n: rd.n, sets: rd.sets, band: rd.band, ends: Object.fromEntries(Object.entries(bar.ends).map(([k, e]) => [k, { multiple: e.m, who: e.who, price: e.price }])), peers: rd.sets.sorted ? rd.sets.sorted.map(peer) : [], outliers: { rule: rd.outliers.rule, fence: rd.outliers.fence, out: rd.outliers.out.map((x) => ({ ...peer(x), side: x.side })) }, nm: rd.nm, missing: rd.missing, upside: bar.upside, ok: bar.ok, reason: bar.reason };
  };
  D = { mode: "LIVE", taken: new Date().toISOString(), today: TODAY, ticker: TICKER, name: (first(prof, TICKER) || {}).name || TICKER, cohort, label: "P/E, trailing", basis: "price ÷ EPS over the last twelve months",
    own: { multiple: compsRead(me, inputs).rows.find((x) => x.key === "pe_ttm").value, price: num(me.price), price_date: me.price_date, eps_ttm: num(me.eps_ttm), eps_date: src(TICKER).fundamentals.date },
    in: take(false), out: take(true), quotes_error: quotes.error || null };
  /* live: only the EPS check can run in the browser (today's market value comes from FMP, which the page cannot read) */
  const cp = D.in.peers.map((p) => { const s = sanity({ ticker: p.ticker, multiple: p.multiple, eps: p.eps, eps_adj: (first(fund, p.ticker) || {}).adjusted_eps_ttm ?? null }); return { ...p, eps_adj: (first(fund, p.ticker) || {}).adjusted_eps_ttm ?? null, pe_mcap: null, faults: s.faults }; });
  D.checks = { peers: cp, faulty: cp.filter((p) => p.faults.length).map((p) => p.ticker), live_only_eps: true };
}

/* ---- one labelled row --------------------------------------------------------------------------------------- */
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs = {}, text) => { const e = document.createElementNS(NS, tag); for (const k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; };

/** read: {ends, own:{price,multiple}, upside, peers:[{ticker,implied}], n}. Draws into host at its width; returns the height. */
function drawRow(host, read, { ticker, eps, faulty = [] }) {
  host.innerHTML = "";
  const W = Math.max(300, host.clientWidth - 32), narrow = W < 600;
  const ML = narrow ? 10 : 30, MR = narrow ? 10 : 30, IW = W - ML - MR;
  const top = Math.max(read.ends.max.price, read.own.price || 0) * 1.05;
  const ticks = niceTicks(0, top, narrow ? 4 : 8);
  const step = ticks.length > 1 ? ticks[1] - ticks[0] : top;
  const hi = Math.ceil(top / step) * step;
  const $ticks = []; for (let v = 0; v <= hi + 1e-9; v += step) $ticks.push(v);
  const x = (v) => ML + (v / hi) * IW;
  const svg = el("svg", { class: "row" });
  host.appendChild(svg);

  /* labels: measure first, then place */
  const labs = rowLabels(read, { ticker, eps: fmt("usd2", eps), fmtX: X, fmtPrice: P, fmtPct: PC, faulty, compact: narrow });
  const measured = labs.map((l) => {
    const g = el("g", { class: "lab" + (l.id === "me" ? " me" : "") });
    const lines = [el("text", { class: "h", x: 0, y: 0 }, l.head), el("text", { class: "v", x: 0, y: 14 }, l.text)];
    if (l.text2) lines.push(el("text", { class: "v", x: 0, y: 28 }, l.text2));
    if (l.tail) lines.push(el("text", { class: "t" + (l.good === false ? " bad" : ""), x: 0, y: 14 * lines.length }, l.tail));
    for (const t of lines) g.appendChild(t);
    svg.appendChild(g);
    const w = Math.max(...lines.map((t) => t.getBBox().width));
    return { ...l, g, w: w + 8, hpx: 16 + 14 * (lines.length - 1), px: x(l.x) - ML };
  });
  const LANE = Math.max(...measured.map((m) => m.hpx)) + 4;       // every lane is taller than the tallest label
  /* the company's dashed line runs down through every lane under the bar, so no label below the bar may cover it */
  const mePx = read.own.price != null ? x(read.own.price) - ML : null;
  const placed = placeLabels(measured.map((m) => ({ id: m.id, x: m.px, w: m.w, side: m.side, prio: m.prio })), { width: IW, lanes: 6, gap: 8, blocked: mePx != null ? [{ x: mePx, side: "below" }] : [] });
  host.__placed = { IW, mePx, labels: measured.map((m, i) => ({ id: m.id, w: m.w, px: m.px, ...placed[i] })) };   // read by the headless proof
  const lanesAbove = Math.max(0, ...placed.filter((p) => p.side === "above").map((p) => p.lane + 1));
  const lanesBelow = Math.max(0, ...placed.filter((p) => p.side === "below").map((p) => p.lane + 1));
  const meAbove = measured.find((m) => m.id === "me") && placed[measured.findIndex((m) => m.id === "me")].side === "above";

  /* vertical plan */
  const yTopAxis = 42;                                          // the multiple axis
  const aboveTop = yTopAxis + 14;
  const yBar = aboveTop + lanesAbove * LANE + 18;
  const boxH = 26, capH = 18;
  const belowTop = yBar + 24;
  const yAxis = belowTop + lanesBelow * LANE + 6;               // the $ axis
  const stripTop = yAxis + 74;                                 // room for the strip title above the brackets
  const peersPlaced = placeStrip(read.peers.filter((p) => p.implied != null).map((p) => ({ id: p.ticker, x: x(p.implied) - ML, w: p.ticker.length * 7.4 + 8 })), { width: IW, rows: narrow ? 6 : 4, gap: 6, charW: 7.4 });
  const stripRows = Math.max(1, ...peersPlaced.map((p) => p.row + 1));
  const H = stripTop + stripRows * 16 + 8;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.setAttribute("height", H);

  /* the multiple axis on top: what multiple of EPS each $ is */
  svg.appendChild(el("text", { class: "axt", x: ML, y: 11 }, narrow ? `PEER P/E × ${ticker} EPS ${fmt("usd2", eps)}` : `P/E MULTIPLE APPLIED TO ${ticker}'S EPS OF ${fmt("usd2", eps)}`));
  svg.appendChild(el("line", { class: "ax", x1: ML, x2: ML + IW, y1: yTopAxis, y2: yTopAxis }));
  for (const m of niceTicks(0, hi / eps, narrow ? 4 : 9)) {
    if (m * eps > hi) continue;
    svg.appendChild(el("line", { class: "tk", x1: x(m * eps), x2: x(m * eps), y1: yTopAxis - 5, y2: yTopAxis }));
    svg.appendChild(el("text", { class: "tx", x: x(m * eps), y: yTopAxis - 8, "text-anchor": m === 0 ? "start" : "middle" }, (Math.round(m) === m ? m : m.toFixed(1)) + "x"));
  }

  /* the bar: whisker, caps, box, median, MU's line */
  const E = read.ends;
  svg.appendChild(el("line", { class: "wh", x1: x(E.min.price), x2: x(E.max.price), y1: yBar, y2: yBar }));
  for (const k of ["min", "max"]) svg.appendChild(el("line", { class: "cap-l", x1: x(E[k].price), x2: x(E[k].price), y1: yBar - capH / 2, y2: yBar + capH / 2 }));
  svg.appendChild(el("rect", { class: "box", x: x(E.q1.price), y: yBar - boxH / 2, width: Math.max(1, x(E.q3.price) - x(E.q1.price)), height: boxH }));
  svg.appendChild(el("line", { class: "med", x1: x(E.median.price), x2: x(E.median.price), y1: yBar - boxH / 2 - 4, y2: yBar + boxH / 2 + 4 }));
  for (const p of read.peers) if (p.implied != null) svg.appendChild(el("circle", { class: "dot" + ([E.min.who[0], E.max.who[0], ...E.median.who].includes(p.ticker) ? " end" : ""), cx: x(p.implied), cy: yBar, r: 3.5 }));

  /* the $ axis */
  svg.appendChild(el("line", { class: "ax", x1: ML, x2: ML + IW, y1: yAxis, y2: yAxis }));
  for (const v of $ticks) {
    svg.appendChild(el("line", { class: "tk", x1: x(v), x2: x(v), y1: yAxis, y2: yAxis + 5 }));
    svg.appendChild(el("text", { class: "tx b", x: x(v), y: yAxis + 18, "text-anchor": v === 0 ? "start" : Math.abs(v - hi) < 1e-9 ? "end" : "middle" }, v === 0 ? "$0" : P(v)));
  }
  svg.appendChild(el("text", { class: "axt", x: ML, y: yAxis + 34 }, narrow ? `$ PER ${ticker} SHARE (P/E × EPS ${fmt("usd2", eps)})` : `$ PER ${ticker} SHARE AT EACH PEER MULTIPLE (MULTIPLE × ${ticker} EPS ${fmt("usd2", eps)})`));

  /* the peers, each at the price its multiple gives the company */
  svg.appendChild(el("text", { class: "axt", x: ML, y: stripTop - 16 }, narrow ? `THE ${read.n} PEERS AT THEIR P/E` : `THE ${read.n} PEERS, EACH AT THE PRICE ITS OWN P/E GIVES ${ticker}`));
  for (const p of peersPlaced) {
    const end = p.ids.some((t) => [E.min.who[0], E.max.who[0], ...E.median.who].includes(t));
    const bad = p.ids.some((t) => faulty.includes(t));
    const yTxt = stripTop + p.row * 16 + 12, yCol = stripTop - 2;
    for (const px of p.xs) svg.appendChild(el("line", { class: "pt" + (end ? " end" : ""), x1: ML + px, x2: ML + px, y1: yAxis, y2: yAxis + 4 }));
    if (p.xs.length > 1) {                                        // several peers too close to point at one by one: one bracket, one pointer
      svg.appendChild(el("line", { class: "pt" + (end ? " end" : ""), x1: ML + p.xs[0], x2: ML + p.xs[p.xs.length - 1], y1: yCol, y2: yCol }));
      for (const px of p.xs) svg.appendChild(el("line", { class: "pt" + (end ? " end" : ""), x1: ML + px, x2: ML + px, y1: yCol - 4, y2: yCol }));
    }
    svg.appendChild(el("line", { class: "pt" + (end ? " end" : ""), x1: ML + p.x, x2: ML + p.x, y1: yCol, y2: yTxt - 11 }));
    const t = el("text", { class: "pn" + (end ? " end" : ""), x: ML + p.cx, y: yTxt, "text-anchor": "middle" });
    p.ids.forEach((id, k) => { if (k) t.appendChild(el("tspan", { class: "sep" }, "·")); t.appendChild(el("tspan", faulty.includes(id) ? { class: "bad" } : {}, id + (faulty.includes(id) ? "*" : ""))); });
    if (bad) t.setAttribute("data-fault", "1");
    svg.appendChild(t);
  }

  /* place the labels and draw their pointers: a straight vertical line from the label's edge to its own mark */
  let meBottom = null;
  measured.forEach((m, i) => {
    const p = placed[i];
    const left = ML + p.left, top = p.side === "above" ? yBar - 22 - p.lane * LANE - (m.hpx - 4) : belowTop + p.lane * LANE;
    const g = m.g, mx = x(m.x);
    const edge = p.side === "above" ? top + m.hpx - 1 : top - 1;   // the label background's edge nearest the bar
    const ay = m.id === "me" ? null : m.id === "min" || m.id === "max" ? (p.side === "above" ? yBar - capH / 2 : yBar + capH / 2) : m.id === "median" ? (p.side === "above" ? yBar - boxH / 2 - 4 : yBar + boxH / 2 + 4) : (p.side === "above" ? yBar - boxH / 2 : yBar + boxH / 2);
    if (m.id === "me") meBottom = p.side === "above" ? edge : null;
    else if (p.leader) svg.appendChild(el("line", { class: "lead", x1: p.ok ? mx : Math.max(left + 4, Math.min(left + m.w - 4, mx)), y1: edge, x2: mx, y2: ay }));
    g.setAttribute("transform", `translate(${left + 4},${top + 10})`);
    const bg = el("rect", { class: "bg", x: -4, y: -11, width: m.w, height: m.hpx, rx: 2 });
    g.insertBefore(bg, g.firstChild);
    svg.appendChild(g);                                         // on top of everything
  });
  /* the company's own dashed line: from the bottom of its flag down to the $ axis (never up past its flag) */
  if (read.own.price != null) svg.insertBefore(el("line", { class: "me-line", x1: x(read.own.price), x2: x(read.own.price), y1: meBottom != null ? meBottom : yBar - boxH / 2 - 8, y2: yAxis }), svg.querySelector("g.lab"));
  return H;
}

/* ---- the page ------------------------------------------------------------------------------------------------ */
function render() {
  const d = D, me = d.own, eps = me.eps_ttm;
  document.getElementById("stamp").innerHTML = d.mode === "LIVE"
    ? `<b>LIVE</b> · read ${esc(new Date(d.taken).toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" }))} · price ${esc(dateWord(me.price_date))}`

<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
