<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 888" width="1600" height="888" font-family="ui-monospace,SFMono-Regular,Menlo,monospace"><rect width="1600" height="888" fill="#0B0B12"/><text x="24" y="30" font-size="20" fill="#C8C8D2" font-weight="600">Slope across the 100 rungs: rung vs the worst close in the next 60 sessions, with a 90% range</text><text x="24" y="56" font-size="14" fill="#8E8EA0">Dot = rank correlation of rung (1..100) with that rung's middle result. Bar = 90% range, whole calendar quarters resampled. Red = negative (lower rung, higher result);</text><text x="24" y="76" font-size="14" fill="#8E8EA0">green = positive. Faint = the range crosses zero. The US funds share one market and one period (2004–2026): read them as one observation, not many.</text><line x1="420" x2="420" y1="90" y2="838" stroke="#1C1C26" stroke-width="1"/><text x="420" y="858" font-size="14" fill="#8E8EA0" text-anchor="middle">-1</text><line x1="640" x2="640" y1="90" y2="838" stroke="#1C1C26" stroke-width="1"/><text x="640" y="858" font-size="14" fill="#8E8EA0" text-anchor="middle">-0.5</text><line x1="860" x2="860" y1="90" y2="838" stroke="#34343F" stroke-width="2"/><text x="860" y="858" font-size="14" fill="#8E8EA0" text-anchor="middle">0</text><line x1="1080" x2="1080" y1="90" y2="838" stroke="#1C1C26" stroke-width="1"/><text x="1080" y="858" font-size="14" fill="#8E8EA0" text-anchor="middle">+0.5</text><line x1="1300" x2="1300" y1="90" y2="838" stroke="#1C1C26" stroke-width="1"/><text x="1300" y="858" font-size="14" fill="#8E8EA0" text-anchor="middle">+1</text><text x="406" y="114" font-size="14" fill="#C8C8D2" text-anchor="end">S&amp;P 500 index</text><line x1="1088.8" x2="1229.6" y1="109" y2="109" stroke="#00FFA3" stroke-opacity="0.75" stroke-width="6"/><circle cx="1229.6" cy="109" r="5.5" fill="#00FFA3"/><text x="1320" y="114" font-size="14" fill="#00FFA3">+0.84  (0.52 to 0.84)</text><text x="406" y="140" font-size="14" fill="#8E8EA0" text-anchor="end">↳ S&amp