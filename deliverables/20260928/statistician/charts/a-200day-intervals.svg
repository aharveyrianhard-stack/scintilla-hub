<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="ui-monospace,Menlo,monospace"><rect width="1100" height="330" fill="#0B0B12"/><text x="60" y="30" fill="#C8C8D2" font-size="19" font-weight="600">SPY more than 10% below its 200-day: up 60 sessions later — 61.5% of 275 days</text><text x="60" y="52" fill="#9C9CAE" font-size="13">the same number, three ways of saying how sure · any day 72.1%</text><line x1="300" x2="300" y1="80" y2="280" stroke="#24242E"/><text x="300" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">30%</text><line x1="408.6" x2="408.6" y1="80" y2="280" stroke="#24242E"/><text x="408.6" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">40%</text><line x1="517.1" x2="517.1" y1="80" y2="280" stroke="#24242E"/><text x="517.1" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">50%</text><line x1="625.7" x2="625.7" y1="80" y2="280" stroke="#24242E"/><text x="625.7" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">60%</text><line x1="734.3" x2="734.3" y1="80" y2="280" stroke="#24242E"/><text x="734.3" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">70%</text><line x1="842.9" x2="842.9" y1="80" y2="280" stroke="#24242E"/><text x="842.9" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">80%</text><line x1="951.4" x2="951.4" y1="80" y2="280" stroke="#24242E"/><text x="951.4" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">90%</text><line x1="1060" x2="1060" y1="80" y2="280" stroke="#24242E"/><text x="1060" y="300" fill="#9C9CAE" font-size="12" text-anchor="middle">100%</text><line x1="757.1" x2="757.1" y1="70" y2="280" stroke="#9C9CAE" stroke-dasharray="4 4"/><text x="763.1" y="78" fill="#9C9CAE" font-size="12">any day 72.1%</text><text x="288" y="120" fill="#C8C8D2" font-size="13" text-anchor="end">counted as 275 coin flips (naive)</text><line x1="587.7" x2="691.9" y1="115" y2="115" stroke="#FF2D55" stroke-width="6" stroke-linecap="round"/><circle cx="642" cy="115" r="7" fill="#0B0B12" stroke="#C8C8D2" stroke-width="2"/><text x="579.7" y="120" fill="#9C9CAE" font-size="12" text-anchor="end">56.5%</text><text x="699.9" y="120" fill="#9C9CAE" font-size="12">66.1%</text><text x="288" y="182" fill="#C8C8D2" font-size="13" text-anchor="end">resampling runs of days (block 60)</text><line x1="425.9" x2="947.1" y1="177" y2="177" stroke="#00FFA3" stroke-width="6" stroke-linecap="round"/><circle cx="642" cy="177" r="7" fill="#0B0B12" stroke="#C8C8D2" stroke-width="2"/><text x="417.9" y="182" fill="#9C9CAE" font-size="12" text-anchor="end">41.6%</text><text x="955.1" y="182" fill="#9C9CAE" font-size="12">89.6%</text><text x="288" y="244" fill="#C8C8D2" font-size="13" text-anchor="end">worth ≈ 5.4 independent observations</text><text x="300" y="244" fill="#9C9CAE" font-size="12">33 visits in 8 years · runs of days: middle 2, longest 146 (2008–09)</text><text x="60" y="322" fill="#5A5A6C" font-size="12">90% ranges · naive = a coin-flip count · resampled = whole runs of days kept together, the way bear markets arrive</text></svg>