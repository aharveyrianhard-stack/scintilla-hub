<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>SCINTILLA · COMPARABLE COMPANIES · table, field, cards, knockout</title>
<style>
:root{color-scheme:dark;
 --bg:#0a0a0f;--panel:#0d0d14;--sunk:#08080c;--line:#1a1a2a;--line2:#252538;--band:#1f1f2e;--band2:#2a2a3c;
 --ink:#c6c8d2;--ink2:#9ea0b2;--dim:#8a8ca2;--mute:#4a4a62;--ghost:#33334a;
 --up:#2fa765;--dn:#c0463f;
 --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
 --sans:ui-sans-serif,-apple-system,"Helvetica Neue",Helvetica,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink2)}
body{font:15px/1.55 var(--sans);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line2);padding:6px 8px;border-radius:0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--dim)}
.wrap{max-width:min(1900px,100%);margin:0 auto;padding:0 18px 80px}
.top{padding:16px 0 12px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:baseline;flex-wrap:wrap}
.brand{font:400 11px/1 var(--mono);letter-spacing:.2em;color:var(--dim)}.brand b{color:var(--ink);font-weight:600}
.stamp{margin-left:auto;font:400 11px/1.5 var(--mono);color:var(--mute);letter-spacing:.06em;text-align:right}
.mono{font-family:var(--mono)}
.lbl{font:400 11px/1.4 var(--mono);letter-spacing:.16em;color:var(--mute);text-transform:uppercase}
h1{font:400 12px/1.4 var(--mono);letter-spacing:.2em;color:var(--dim);margin:26px 0 10px;text-transform:uppercase}
p{margin:0 0 12px;max-width:72ch}
.note{font-size:13px;color:var(--dim);max-width:80ch}
.up{color:var(--up)}.dn{color:var(--dn)}
/* progress strip */
.strip{display:flex;gap:0;margin:16px 0 8px;border:1px solid var(--line);background:var(--panel);overflow-x:auto}
.strip button{flex:1 1 0;min-width:120px;padding:10px 12px;text-align:left;border-right:1px solid var(--line);font:400 11px/1.5 var(--mono);letter-spacing:.14em;color:var(--mute)}
.strip button:last-child{border-right:0}
.strip button b{display:block;font-size:18px;letter-spacing:0;color:var(--dim);font-weight:400}
.strip button.on{background:var(--sunk);color:var(--ink);box-shadow:inset 0 -2px 0 var(--ink2)}
.strip button.on b{color:var(--ink)}
.strip button.done b{color:var(--ink2)}
/* filters */
.bar{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-end;margin:14px 0;padding:12px 14px;border:1px solid var(--line);background:var(--panel)}
.grp{display:flex;flex-direction:column;gap:6px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font:400 11px/1 var(--mono);letter-spacing:.1em;padding:7px 10px;border:1px solid var(--line2);color:var(--dim);background:var(--sunk)}
.chip.on{color:var(--ink);border-color:var(--ink2)}
.chip.tag{cursor:default;padding:5px 8px;font-size:10.5px}
.right{margin-left:auto}
/* cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.card{border:1px solid var(--line);background:var(--panel);padding:14px 14px 12px;display:flex;flex-direction:column;gap:10px;position:relative}
.card.out{opacity:.55}
.card.out .num b{color:var(--dim)}
.card .head{display:flex;gap:10px;align-items:baseline}
.card .tk{font:600 22px/1 var(--mono);color:var(--ink);letter-spacing:.04em}
.card .cap{font:400 10.5px/1 var(--mono);letter-spacing:.14em;color:var(--mute);text-transform:uppercase}
.card .nm{font-size:14px;color:var(--ink2);line-height:1.3}
.card .ind{font:400 11px/1.3 var(--mono);color:var(--mute)}
.card .px{font:400 13px/1.3 var(--mono);color:var(--ink)}.card .px small{color:var(--mute);font-size:11px;margin-left:8px}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px 12px;border-top:1px solid var(--line);padding-top:10px}
.num .lbl{font-size:10px}
.num b{display:block;font:400 17px/1.2 var(--mono);color:var(--ink);font-weight:400}
.num small{display:block;font:400 10.5px/1.3 var(--mono);color:var(--mute)}
.why{font-size:13.5px;line-height:1.45;color:var(--dim);border-top:1px solid var(--line);padding-top:9px}
.why b{color:var(--ink2);font-weight:600}
.care{color:var(--ink2)}
/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
.tbl th{font:400 10.5px/1.3 var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{font-family:var(--mono);color:var(--ink)}
.tbl th{white-space:normal;max-width:92px;vertical-align:bottom}
.tbl td:first-child,.tbl th:first-child{position:sticky;left:0;background:var(--panel,#0D0D14);z-index:1}
.tbl td small{display:block;font-size:10px;color:var(--mute)}
.tbl tr.out td{color:var(--mute)}
.scroll{overflow-x:auto;border:1px solid var(--line);background:var(--panel)}
/* fit form */
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin:12px 0}
.fld{border:1px solid var(--line);background:var(--panel);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fld input[type=text]{width:100%}
.seg{display:inline-flex;border:1px solid var(--line2)}
.seg button{padding:6px 10px;font:400 11px/1 var(--mono);letter-spacing:.12em;color:var(--mute);border-right:1px solid var(--line2)}
.seg button:last-child{border-right:0}.seg button.on{color:var(--ink);background:var(--sunk);box-shadow:inset 0 -2px 0 var(--ink2)}
.theme{display:grid;grid-template-columns:130px auto 1fr;gap:10px;align-items:center}
.theme .t{font:400 11px/1.3 var(--mono);letter-spacing:.1em;color:var(--ink2);text-transform:uppercase}
.go{display:inline-block;margin:14px 0;padding:11px 16px;border:1px solid var(--ink2);color:var(--ink);font:400 11px/1 var(--mono);letter-spacing:.18em}
.go:hover{background:var(--sunk)}
.go.dim{border-color:var(--line2);color:var(--dim)}
/* the field */
.field{border:1px solid var(--line);background:var(--panel)}
.frow{display:grid;grid-template-columns:230px 1fr 210px;gap:14px;align-items:center;padding:14px 14px;border-bottom:1px solid var(--line)}
.frow:last-child{border-bottom:0}
.frow .m{font:400 12px/1.4 var(--mono);letter-spacing:.08em;color:var(--ink2)}
.frow .m small{display:block;font-size:10.5px;color:var(--mute);letter-spacing:.06em}
.track{position:relative;height:82px}
.band{position:absolute;top:22px;height:12px;background:var(--band);border-left:1px solid var(--band2);border-right:1px solid var(--band2)}
.dot{position:absolute;top:19px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--ink2);border:2px solid var(--panel);cursor:pointer}
.dot:hover{background:var(--ink)}
.dot.out{background:transparent;border:2px solid var(--ghost)}
.dot .tkl{position:absolute;top:22px;left:50%;transform:translateX(-50%);font:400 10.5px/1 var(--mono);letter-spacing:.06em;color:var(--dim);white-space:nowrap}
.dot.out .tkl{color:var(--ghost)}
.dot.dir-up{background:var(--up)}.dot.dir-dn{background:var(--dn)}
.dot.out.dir-up,.dot.out.dir-dn{background:transparent}
.tick{position:absolute;top:4px;width:0;height:0;margin-left:-6px;border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid var(--ink)}
.ends{font:400 11px/1.6 var(--mono);color:var(--dim);text-align:right}.ends b{color:var(--ink);font-weight:400}
.ends small{color:var(--mute)}
/* timing */
.trow{display:grid;grid-template-columns:150px 1fr 1fr 1.2fr 1.4fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.trow:last-child{border-bottom:0}
.trow .tk{font:600 17px/1.2 var(--mono);color:var(--ink)}
.trow .tk small{display:block;font-weight:400;font-size:11px;color:var(--mute)}
.kv b{display:block;font:400 16px/1.2 var(--mono);color:var(--ink);font-weight:400}
.kv small{display:block;font:400 10.5px/1.4 var(--mono);color:var(--mute)}
.flag{display:inline-block;margin-top:4px;font:400 10px/1 var(--mono);letter-spacing:.12em;padding:4px 6px;border:1px solid var(--ink2);color:var(--ink)}
.evt{font:400 11px/1.5 var(--mono);color:var(--dim)}
/* final */
.drow{display:grid;grid-template-columns:150px auto 1fr;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:start}
.drow textarea{width:100%;min-height:54px;resize:vertical}
.drow .dt{display:flex;gap:8px;align-items:center;margin-top:6px;font:400 11px/1 var(--mono);color:var(--mute)}
.list{border:1px solid var(--line);background:var(--panel);margin-top:14px}
.list div{padding:9px 14px;border-bottom:1px solid var(--line);font-size:13.5px;color:var(--dim)}
.list div:last-child{border-bottom:0}.list b{font-family:var(--mono);color:var(--ink);font-weight:400;margin-right:8px}
.src{margin-top:26px;border-top:1px solid var(--line);padding-top:10px}
.src summary{cursor:pointer;font:400 11px/1.6 var(--mono);letter-spacing:.16em;color:var(--mute)}
.src table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
.src td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--dim)}.src td:first-child{font-family:var(--mono);color:var(--ink2);white-space:nowrap}
.err{border:1px solid var(--dn);padding:10px 12px;color:var(--ink);font-size:13px;margin:12px 0}
.loading{font:400 11px/1 var(--mono);letter-spacing:.18em;color:var(--mute);padding:40px 0}
@media(max-width:900px){.frow{grid-template-columns:1fr;gap:8px}.ends{text-align:left}.trow{grid-template-columns:1fr 1fr}.drow{grid-template-columns:1fr}.theme{grid-template-columns:1fr}}
@media(max-width:560px){.wrap{padding:0 12px 60px}.cards{grid-template-columns:1fr}.trow{grid-template-columns:1fr}.strip button{min-width:96px;padding:8px 8px}.strip button b{font-size:15px}}

/* scenario tabs */
.tabs{display:flex;gap:0;border:1px solid var(--line);background:var(--panel);margin:14px 0 0;overflow-x:auto}
.tabs button{padding:10px 16px;font:400 11px/1.5 var(--mono);letter-spacing:.16em;color:var(--mute);border-right:1px solid var(--line);white-space:nowrap}
.tabs button:last-child{border-right:0}.tabs button.on{color:var(--ink);background:var(--sunk);box-shadow:inset 0 2px 0 var(--ink2)}
.tabs button small{display:block;letter-spacing:.06em;font-size:10px;color:var(--mute)}
/* the theme step (client designer idiom) */
.themes{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
.tb{padding:10px 14px;border:1px solid var(--line2);background:var(--sunk);color:var(--dim);font-size:13.5px;text-align:left;min-width:180px}
.tb b{display:block;font:400 10.5px/1.4 var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase;margin-top:3px}
.tb.on{color:var(--ink);border-color:var(--ink2)}.tb.rec{border-style:double}.tb:disabled{opacity:.4;cursor:not-allowed}
.tb .rc{font:400 10px/1 var(--mono);letter-spacing:.14em;color:var(--ink2);margin-left:6px}
.pal{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:10px 14px;border:1px solid var(--line);background:var(--panel);margin:12px 0;font:400 12px/1.5 var(--mono);color:var(--dim)}
.pal b{color:var(--ink);font-weight:400}
.slot{display:inline-block;width:12px;height:12px;border:1px solid var(--ink2);margin-right:3px;vertical-align:-2px}.slot.full{background:var(--ink2)}
.ta{width:100%;border-collapse:collapse;font-size:13px;margin:8px 0}
.ta th,.ta td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.ta th{font:400 10.5px/1.3 var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.ta td.n{font-family:var(--mono);color:var(--ink);text-align:right}.ta th.n{text-align:right}
.ta td small{color:var(--mute);font-family:var(--mono);font-size:11px}
/* round robin */
.st{width:100%;border-collapse:collapse;font-size:13px}
.st th,.st td{padding:8px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.st th{font:400 10.5px/1.3 var(--mono);letter-spacing:.12em;color:var(--mute);text-transform:uppercase}
.st td{font-family:var(--mono);color:var(--ink)}.st td:nth-child(2),.st th:nth-child(2){text-align:left}
.st td.seed{color:var(--mute)}.st tr.out td{color:var(--ghost)}
.st .bar{position:relative;display:inline-block;width:90px;height:8px;background:var(--band);vertical-align:middle;margin-left:8px;padding:0;border:0}
.st .bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink2)}
.mx td{font-size:11.5px}
.dot.seed1{box-shadow:0 0 0 2px var(--ink)}
</style></head>
<body>
<div class="wrap">
<div class="top"><span class="brand"><b>SCINTILLA</b> · COMPARABLE COMPANIES · <span id="scenName">…</span></span><span data-scnav-slot></span><span class="stamp" id="stamp">reading the Hub's own tables…</span></div>
<div id="tabs" class="tabs"><button data-scenario="UTILITIES" data-act="scenario" data-v="UTILITIES">UTILITIES<small>the cohort as it stands today</small></button><button data-scenario="AI_POWERTRAIN" data-act="scenario" data-v="AI_POWERTRAIN">AI POWERTRAIN<small>the cohort as it stands today</small></button><button data-scenario="STATION" data-act="scenario" data-v="STATION">STATION TARGETS<small>Alan's eight, in position order</small></button></div>
<div id="strip" class="strip"><button data-stage="TABLE">the source</button><button data-stage="FIELD">the field</button><button data-stage="CARDS">the cards</button><button data-stage="FIT">round 1 · fit</button><button data-stage="COMPS">round 2 · comps</button><button data-stage="TIMING">round 3 · timing</button><button data-stage="FINAL">pick · pass · later</button></div>
<div id="stage" class="loading">READING…</div>
<details class="src" id="sources"><summary>WHERE EACH NUMBER COMES FROM · MEASURED DATES</summary><div id="srcBody"></div></details>
</div>

<script type="module">
import { METRICS, metric, CAP_TAGS, CAP_LABEL, DEFAULT_PREFS, CLASS_TOGGLE, RISK_LEVEL, applyToggles, fieldRow, toggleOut, fit, buildRow, fmtMetric, money, dateWord, ageDays,
  sigmaEvents, themeWord, num, SIGMA_LOOKBACK, SIGMA_X, THEMES, themeByKey, themeFit, themeAnalysis, inferTheme, lcSplit, SLEEVE_CAPS, sleeveOf, pickAllowed,
  roundRobin, SCENARIOS, scenarioFor, orderRows } from "./field.mjs";

/* ---- where the reads go --------------------------------------------------------------- */
const SB = "https://wadinxqplrggagkvrdag.supabase.co";
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const API = LOCAL ? "/__chart" : (window.SC_CHART_API || "https://scintilla-massive-chart-api.fly.dev");
let KEY = null;
async function readKey() {           // the same runtime discovery the allocation sub-page uses; nothing is stored in this file
  if (window.SC_ANON_KEY) return (KEY = window.SC_ANON_KEY);
  for (const page of ["/pip.html", "/index.html"]) {
    try {
      const t = await (await fetch(page, { cache: "no-store" })).text();
      const m = t.match(/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_.\-]+/);
      if (m) return (KEY = m[0]);
    } catch (_) {}
  }
  return null;
}
async function pg(path) {
  const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: KEY, Authorization: "Bearer " + KEY } });
  if (!r.ok) throw new Error(path.split("?")[0] + " → " + r.status);
  return r.json();
}
async function api(path) { const r = await fetch(API + path); if (!r.ok) throw new Error(path.split("?")[0] + " → " + r.status); return r.json(); }

/* ---- state ------------------------------------------------------------------------------ */
const Q = new URLSearchParams(location.search);
const TODAY = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
const daysAgo = (n) => new Date(Date.parse(TODAY + "T00:00:00Z") - n * 86400e3).toISOString().slice(0, 10);
const STAGES = ["TABLE", "FIELD", "CARDS", "FIT", "COMPS", "TIMING", "FINAL"];
const SUB = { TABLE: "the source", FIELD: "the field", CARDS: "the cards", FIT: "round 1 · fit", COMPS: "round 2 · comps", TIMING: "round 3 · timing", FINAL: "pick · pass · later" };
const S = {
  scenario: scenarioFor(Q.get("scenario"), Q.get("cohort")),
  stage: STAGES.includes((Q.get("stage") || "").toUpperCase()) ? Q.get("stage").toUpperCase() : "TABLE",
  view: Q.get("view") === "table" ? "table" : "cards",
  rows: [], out: new Set(), metricsOff: new Set((Q.get("off") || "").split(",").filter(Boolean)),
  prefs: null, theme: null, decisions: {}, allDecisions: {}, liked: new Set(), split: null,
  filters: { cap: "ALL", theme: "ALL", within: "ANY" }, timing: {}, statsBuilt: null, sources: [], quotesErr: null,
};
const LS = { prefs: "k1.prefs", dec: (c) => "k1.decisions." + c, out: (c) => "k1.out." + c, theme: (c) => "k1.theme." + c };
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (_) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const DEFAULT_THEME = { UTILITIES: "DEFENSIVE", AI_POWERTRAIN: "POWER_FOR_AI", STATION: "ANY" };
function loadState() {
  const p = lsGet(LS.prefs, null);
  S.prefs = p && typeof p === "object" ? { ...JSON.parse(JSON.stringify(DEFAULT_PREFS)), ...p } : JSON.parse(JSON.stringify(DEFAULT_PREFS));
  if (Q.get("cls") || Q.get("risk")) S.prefs = applyToggles(S.prefs, { cls: Q.get("cls"), risk: Q.get("risk") });
  S.theme = (Q.get("theme") || lsGet(LS.theme(S.scenario.key), DEFAULT_THEME[S.scenario.key] || "ANY")).toUpperCase();
  S.decisions = lsGet(LS.dec(S.scenario.key), {});
  S.out = new Set(Q.has("out") ? Q.get("out").split(",").filter(Boolean) : lsGet(LS.out(S.scenario.key), []));
  for (const d of (Q.get("dec") || "").split("|").filter(Boolean)) {   // a run can be handed over in the URL: dec=GEV:PICK:reason|CEG:LATER:reason
    const [t, decision, ...rest] = d.split(":");
    if (t && ["PICK", "PASS", "LATER"].includes(decision)) S.decisions[t] = { decision, reason: decodeURIComponent(rest.join(":")), made_at: new Date().toISOString(), cohort: S.scenario.key };
  }
  S.allDecisions = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith("k1.decisions.")) S.allDecisions[k.slice(13)] = lsGet(k, {}); } } catch (_) {}
  S.allDecisions[S.scenario.key] = S.decisions;
}
const savePrefs = () => lsSet(LS.prefs, S.prefs);
const saveDecisions = () => { lsSet(LS.dec(S.scenario.key), S.decisions); S.allDecisions[S.scenario.key] = S.decisions; };
const saveOut = () => lsSet(LS.out(S.scenario.key), [...S.out]);
const saveTheme = () => lsSet(LS.theme(S.scenario.key), S.theme);
loadState();

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const theme = () => themeByKey(THEMES, S.theme);
const fitOf = (r) => {
  const t = themeFit(r, theme());
  const f = fit({ ticker: r.ticker, mcap: r.mcap, mcap_date: r.mcap_date, eps_ttm: r.eps_ttm, eps_date: r.eps_date, tags: r.tags, all_tags: r.all_tags, is_etf: r.is_etf }, S.prefs);
  const why = (t.fits ? [] : [t.why]).concat(f.in ? [] : f.why);
  return { in: t.fits && f.in, care: f.care, why: why.length ? why : f.why, theme: t };
};
const companies = () => S.rows.filter((r) => !r.is_etf);
const r1in = () => companies().filter((r) => fitOf(r).in);
const r2in = () => r1in().filter((r) => !S.out.has(r.ticker));
const fieldIn = () => companies().filter((r) => !S.out.has(r.ticker));
const themesInGroup = () => [...new Set(S.rows.flatMap((r) => r.all_tags || r.tags))].filter((t) => !CAP_TAGS.includes(t)).sort();
const gClass = (v) => v == null ? "" : v >= 0 ? "up" : "dn";
const metricsOn = () => new Set(METRICS.filter((m) => m.better && (S.metricsOff.has(m.key) ? false : (m.plays || S.metricsOff.has("!" + m.key)))).map((m) => m.key));
const picksAll = () => Object.entries(S.allDecisions).flatMap(([c, d]) => Object.entries(d).filter(([, v]) => v && v.decision === "PICK").map(([t, v]) => ({ ticker: t, cohort: c, sleeve: v.sleeve || "LC" })));

/* ---- reads ------------------------------------------------------------------------------ */
async function load() {
  if (!(await readKey())) throw new Error("no read key could be found on this site");
  let T, pos = {};
  if (S.scenario.kind === "targets") {
    const st = await pg("station_targets?select=ticker,position,updated_at&order=position.asc");

  const [tags, fund, est, bal, gg, earn, hb, prof, liked, idx, quotes] = await Promise.all([

    pg(`balance_history?select=ticker,fiscal_date,net_debt,total_debt,cash_and_equiv&period=eq.FY&ticker=${inq}&order=ticker.asc,fiscal_date.desc`),
    pg(`composite_staged?select=ticker,composite,trend,momentum,updated_ts&tf=eq.D&ticker=${inq}&order=ticker.asc,updated_ts.desc`),
    pg(`earnings_events?select=ticker,date,eps_estimate&ticker=${inq}&date=gte.${TODAY}&order=ticker.asc,date.asc`),
    pg(`ticker_heartbeat_daily?select=ticker,date,usual_day_20,usual_day_60,usual_day_250&ticker=${inq}&date=gte.${daysAgo(10)}&order=date.desc`),   // newest row per name is found first
    pg(`company_profile?select=ticker,name,industry,is_etf&ticker=${inq}`),
    pg(`hub_favorites?select=ticker`).catch(() => []),
    pg(`composite_staged?select=ticker,composite,updated_ts&tf=eq.D&ticker=in.(SPY,IWM)`).catch(() => []),
    api(`/quotes?symbols=${encodeURIComponent(T.join(","))}`).catch((e) => ({ quotes: {}, error: String(e.message || e) })),
  ]);
  const first = (rows, t) => rows.find((r) => r.ticker === t) || null;
  const qmap = quotes.quotes && typeof quotes.quotes === "object" ? quotes.quotes : {};
  S.quotesErr = quotes.error || null;
  S.liked = new Set(liked.map((x) => x.ticker));

  S.split = { ...lcSplit(gS && gS.composite, gI && gI.composite), spy: gS, iwm: gI };
  S.rows = orderRows(T.map((t) => buildRow({
    ticker: t, cohort: S.scenario.cohort, position: pos[t] ?? null, cohorts: tags.filter((x) => x.ticker === t).map((x) => x.cohort),
    fundamentals: first(fund, t), estimates: est.filter((e) => e.ticker === t), balance: first(bal, t),
    geiger: first(gg, t), earnings: earn.filter((e) => e.ticker === t), heartbeat: first(hb, t), profile: first(prof, t),

}
async function loadTiming() {
  if (S.timingLoaded) return; S.timingLoaded = true;
  const names = companies();
  await Promise.all([
    ...names.map(async (r) => {
      try {
        const j = await api(`/candles?symbol=${encodeURIComponent(r.ticker)}&tf=1d&limit=${SIGMA_LOOKBACK + 5}`);
        const closes = (j.series || []).map((b) => b.c);
        const ev = sigmaEvents(closes, r.metrics.usual);
        const ts = (j.series || []).map((b) => new Date(b.t).toISOString().slice(0, 10));
        ev.events = ev.events.map((e) => ({ ...e, date: ts[e.i] }));
        S.timing[r.ticker] = { ...(S.timing[r.ticker] || {}), sigma: ev, newest: j.newest ? String(j.newest).slice(0, 10) : null };
      } catch (e) { S.timing[r.ticker] = { ...(S.timing[r.ticker] || {}), sigma: { count: null, events: [], reason: String(e.message || e) } }; }
    }),
    (async () => {
      try {
        const j = await (await fetch("/research/statistics/data/summary.json", { cache: "no-store" })).json();
        S.statsBuilt = j.built_utc || null;
        for (const r of names) {
          const s = j.symbols && j.symbols[r.ticker];
          const rsi = s && s.indicators && s.indicators.rsi14;
          const w = rsi && rsi.windows && rsi.windows["1y"];
          S.timing[r.ticker] = { ...(S.timing[r.ticker] || {}), rsi: rsi ? { today: rsi.today, pct: w ? w.percentile : null, n: w ? w.n : null, date: s.source_date } : null };
        }
      } catch (e) { for (const r of names) S.timing[r.ticker] = { ...(S.timing[r.ticker] || {}), rsi: null, rsiErr: String(e.message || e) }; }
    })(),
  ]);
  render();
}

const dateCell = (d) => d ? (String(d).startsWith("FY") ? esc(d) : "measured " + dateWord(d)) : "not on file";

/* FIELD — the football field. names: which rows stand on it; knock: names can be knocked out here. */
function fieldHTML(names, { showSeeds = null } = {}) {
  const rows = METRICS.map((m) => {
    const fr = fieldRow(names.map((r) => ({ ticker: r.ticker, value: r.metrics[m.key] })), S.out);
    const pts = fr.points.filter((p) => p.x != null);
    const missing = fr.points.filter((p) => p.x == null).map((p) => p.ticker);
    const off = S.metricsOff.has(m.key) || (!m.plays && !S.metricsOff.has("!" + m.key));
    /* labels: points closer than 4% of the track share a column, so their names take turns on three rows under the band */
    const sorted = [...pts].sort((a, b) => a.x - b.x); const rowOf = {}; let lastX = -1, k = 0;
    for (const p of sorted) { k = (p.x - lastX) < 0.04 ? (k + 1) % 3 : 0; rowOf[p.ticker] = k; lastX = p.x; }
    const dot = (p) => { const r = names.find((n) => n.ticker === p.ticker); const dir = m.direction ? " dir-" + gClass(p.value) : ""; const seed = showSeeds && showSeeds[p.ticker] === 1 ? " seed1" : "";
      return `<button class="dot ${p.in ? "" : "out"}${dir}${seed}" style="left:${(p.x * 100).toFixed(2)}%" data-act="knock" data-v="${esc(p.ticker)}" title="${esc(p.ticker)} ${fmtMetric(m, p.value)} · ${esc(r && r.dates[m.key] ? String(r.dates[m.key]) : "")} · click to knock out or bring back"><span class="tkl" style="top:${22 + rowOf[p.ticker] * 12}px">${esc(p.ticker)}</span></button>`; };
    const dates = [...new Set(names.filter((r) => !S.out.has(r.ticker)).map((r) => r.dates[m.key]).filter(Boolean))];
    const dateNote = dates.length === 1 ? (String(dates[0]).startsWith("FY") ? dates[0] : "measured " + dateWord(dates[0])) : dates.length ? "measured " + dateWord(dates.sort()[0]) + "–" + dateWord(dates[dates.length - 1]) : "";
    return `<div class="frow" style="${off && S.stage === "COMPS" ? "opacity:.45" : ""}"><div class="m"><button data-act="metric" data-v="${m.key}" title="${m.better ? (off ? "click to put this row into the round robin" : "click to take this row out of the round robin") : "this row describes; it never judges"}" style="text-align:left;color:inherit">${esc(m.label)}${m.better ? `<span class="chip tag" style="margin-left:8px">${off ? "sits out" : "plays"}</span>` : ""}</button><small>${esc(dateNote)}${m.low_is ? " · lower is " + m.low_is : m.high_is ? " · higher is " + m.high_is : ""}${missing.length ? " · no value: " + esc(missing.join(", ")) : ""}</small></div>

}

/* CARDS — the cardified table, the plant-library idiom. */
function chips(r) {
  const g = r.metrics.geiger, gAge = ageDays(r.dates.geiger, TODAY);

    ...r.tags.filter((t) => !CAP_TAGS.includes(t)).slice(0, 3).map((t) => `<span class="chip tag">${esc(themeWord(t))}</span>`)];

function statusSentence(r) {
  if (r.is_etf) return { out: true, html: `<b>reference only:</b> ${esc(r.ticker)} is a fund, not a company; it stays on the table and takes no part in the rounds.` };
  const f = fitOf(r);
  if (!f.in) return { out: true, html: `<b>out because</b> ${esc(f.why[0])}` };
  if (S.out.has(r.ticker)) return { out: true, html: `<b>out:</b> you knocked ${esc(r.ticker)} off the field. Click it there to bring it back.` };
  const d = S.decisions[r.ticker];
  if (d && d.decision) return { out: d.decision === "PASS", html: `<b>${esc(d.decision)}</b> — ${esc(d.reason || "no reason written yet")}` };
  const w = f.care.length ? f.care[0] : f.why[0];
  return { out: false, html: `<b>still in because</b> ${esc(w.replace(/^\S+ (stays in(, with care)?|fits the theme|plays): ?/, ""))}` };
}
function passesFilters(r) {

/* ROUND 1 · FIT — the client designer's mechanic: state the theme, then the two toggles, then the rules. */
function renderFit() {
  const P = S.prefs, largeOnly = P.class_toggle !== "LARGE_AND_SMALL";
  const analysis = themeAnalysis(companies(), THEMES, SLEEVE_CAPS, largeOnly);
  const inferred = inferTheme(companies(), S.liked, THEMES);
  const rec = inferred.top ? inferred.top.key : null;
  const themeBtns = THEMES.map((t) => {
    const a = analysis.find((x) => x.key === t.key);
    const n = a ? a.n : companies().length;
    const viable = !a || a.viable;
    return `<button class="tb ${S.theme === t.key ? "on" : ""} ${rec === t.key ? "rec" : ""}" data-act="theme-pick" data-v="${t.key}" ${viable ? "" : "disabled"} title="${esc(a ? a.verdict : "every name may play")}">${esc(t.label)}${rec === t.key ? `<span class="rc">LIKED SAYS SO</span>` : ""}<b>${n} of ${companies().length} fit · ${esc(a ? a.verdict : "no narrowing")}</b></button>`;
  }).join("");
  const sp = S.split || {};
  const splitLine = sp.lc == null ? "The tool's own split cannot be read: " + esc(sp.reason || "") :
    `The allocation tool's own split today reads <b>large ${sp.lc.toFixed(0)}% / small ${sp.sc.toFixed(0)}%</b> — from SPY ${fmtMetric(metric("geiger"), sp.spy.composite)} and IWM ${fmtMetric(metric("geiger"), sp.iwm.composite)}, both measured ${dateWord(new Date(sp.spy.updated_ts * 1000).toISOString())}. That sets how much money each sleeve gets; which names may play is the toggle below.`;
  const floors = [[0, "no floor"], [2e9, "$2B"], [10e9, "$10B"], [50e9, "$50B"], [100e9, "$100B"]];
  const state = (t) => P.themes_out[t] != null ? "OUT" : P.themes_care[t] != null ? "CARE" : "IN";
  const form = `
    <h1>1 · state the theme</h1>
    <p class="note">As in the client designer: you say the theme you want, and the report fills each sleeve from the names that fit it. A theme is a set of tags; a name with none of them is greyed with the sentence that says so. The reverse direction reads your LIKED list first: <em>${esc(inferred.sentence)}</em></p>
    <div class="themes">${themeBtns}</div>
    <details><summary class="lbl" style="cursor:pointer">which themes can carry this group · the numbers behind the buttons</summary>
    <table class="ta"><tr><th>theme</th><th class="n">large caps</th><th class="n">small caps</th><th>verdict (sleeves of ${SLEEVE_CAPS.LC} and ${SLEEVE_CAPS.SC})</th><th>names</th></tr>
    ${analysis.map((a) => `<tr><td>${esc(a.label)}</td><td class="n">${a.lc}</td><td class="n">${a.sc}</td><td>${esc(a.verdict)}</td><td><small>${esc(a.names.join(", ") || "—")}</small></td></tr>`).join("")}</table>
    <p class="note">"Cannot fill" is group-specific, the way "cannot fill deep shade" was spot-specific: it says this group has no such name, not that the theme is wrong. You can still pick a thin theme and fill the sleeve from another cohort.</p></details>
    <h1>2 · the allocation tool's two toggles</h1>
    <p class="note">${splitLine}</p>
    <div class="form">
      <div class="fld"><span class="lbl">which cap class may play</span><div class="seg">${Object.entries(CLASS_TOGGLE).map(([k, v]) => `<button class="${P.class_toggle === k ? "on" : ""}" data-act="toggle" data-k="cls" data-v="${k}">${v.label.toUpperCase()}</button>`).join("")}</div><small class="note">${esc(CLASS_TOGGLE[P.class_toggle]?.why || "")}</small></div>
      <div class="fld"><span class="lbl">risk exposure</span><div class="seg">${Object.entries(RISK_LEVEL).map(([k, v]) => `<button class="${P.risk_level === k ? "on" : ""}" data-act="toggle" data-k="risk" data-v="${k}">${v.label.toUpperCase()}</button>`).join("")}</div><small class="note">${esc(RISK_LEVEL[P.risk_level]?.why || "")}</small></div>
    </div>
    <h1>3 · the rules under them · editable defaults</h1>
    <div class="form">
    <div class="fld"><span class="lbl">market value floor</span><div class="seg">${floors.map(([v, l]) => `<button class="${Number(P.cap_floor_usd) === v ? "on" : ""}" data-act="pref" data-k="cap_floor_usd" data-v="${v}">${l}</button>`).join("")}</div>
      <input type="text" data-pref="cap_floor_reason" value="${esc(P.cap_floor_reason)}" placeholder="why, in your words"></div>
    <div class="fld"><span class="lbl">earnings</span><div class="seg"><button class="${P.needs_earnings ? "on" : ""}" data-act="pref" data-k="needs_earnings" data-v="1">MUST EARN</button><button class="${!P.needs_earnings ? "on" : ""}" data-act="pref" data-k="needs_earnings" data-v="0">ANY</button></div>
      <input type="text" data-pref="needs_earnings_reason" value="${esc(P.needs_earnings_reason)}" placeholder="why, in your words"></div>
    <div class="fld" style="grid-column:1/-1"><span class="lbl">theme tags in play · out · handle with care</span>
      ${themesInGroup().map((t) => `<div class="theme"><span class="t">${esc(themeWord(t))}</span>
        <div class="seg">${["IN", "CARE", "OUT"].map((s) => `<button class="${state(t) === s ? "on" : ""}" data-act="theme" data-t="${esc(t)}" data-v="${s}">${s}</button>`).join("")}</div>
        <input type="text" data-theme-reason="${esc(t)}" value="${esc(P.themes_out[t] ?? P.themes_care[t] ?? "")}" placeholder="${state(t) === "IN" ? "in play — no reason needed" : "why, in your words"}" ${state(t) === "IN" ? "disabled" : ""}></div>`).join("")}
      <p class="note">These are your defaults. They are saved in this browser and seed every cohort until you change them. The reasons are the ones the write-up keeps, and the ones the proposed operator_preferences table would hold.</p>
    </div></div>`;
  const cards = `<h1>4 · who may play</h1><div class="cards">${companies().map((r) => { const f = fitOf(r); const sentences = f.in ? [{ out: false, html: esc(f.theme.why) }].concat(f.care.map((w) => ({ out: false, html: esc(w) }))) : f.why.map((w) => ({ out: true, html: esc(w) })); if (f.in && S.out.has(r.ticker)) sentences.push({ out: true, html: `You knocked ${esc(r.ticker)} off the field as an outlier; it stays out until you bring it back there.` }); return cardHTML(r, sentences); }).join("")}</div>`;
  return `<p class="note">Round 1 asks nothing about price. It asks whether a name may play at all: the theme you state, the allocation tool's two toggles, and the rules under them. A name that fails is greyed with the sentence that failed it.</p>${form}${cards}
    <p class="note" style="margin-top:12px">${r1in().length} of ${companies().length} go through to round 2.</p>${next("COMPS", "ROUND 2 · COMPS")}`;
}

/* ROUND 2 · COMPS — the round robin (group stage) and the field (elimination). */
function renderComps() {
  const names = r1in();
  if (!names.length) return `<p class="note">No name passed round 1. Loosen a rule or widen the theme to put names on the field.</p>`;
  const on = metricsOn();
  const rr = roundRobin(names, S.out, on);
  const seeds = Object.fromEntries(rr.standings.map((s) => [s.ticker, s.seed]));
  const alive = r2in();
  const bestPct = rr.standings[0] && rr.standings[0].pct != null ? rr.standings[0].pct : 1;
  const onList = METRICS.filter((m) => on.has(m.key));
  const standings = `<div class="scroll"><table class="st"><thead><tr><th>seed</th><th>name</th><th>points</th><th>games</th><th>won</th><th>drew</th><th>lost</th>${onList.map((m) => `<th title="${esc(m.label)}">${esc(m.label.split(",")[0].replace("P/E on the FY estimate", "P/E fwd").replace("Analyst target over price", "target room"))}</th>`).join("")}</tr></thead>
    <tbody>${rr.standings.map((s) => `<tr><td class="seed">${s.seed}</td><td>${esc(s.ticker)}</td><td>${s.points % 1 ? s.points.toFixed(1) : s.points}<span class="bar"><i style="width:${s.pct == null ? 0 : (s.pct / bestPct * 100).toFixed(0)}%"></i></span></td><td>${s.played}</td><td>${s.wins}</td><td>${s.draws}</td><td>${s.losses}</td>${onList.map((m) => `<td>${s.byMetric[m.key] == null ? "—" : (s.byMetric[m.key] % 1 ? s.byMetric[m.key].toFixed(1) : s.byMetric[m.key])}</td>`).join("")}</tr>`).join("")}
    ${[...S.out].filter((t) => names.some((n) => n.ticker === t)).map((t) => `<tr class="out"><td>—</td><td>${esc(t)}</td><td colspan="${6 + onList.length}">knocked out · sits out of the round robin</td></tr>`).join("")}</tbody></table></div>`;
  const matrix = `<details style="margin-top:10px"><summary class="lbl" style="cursor:pointer">head to head · games won against each name</summary><div class="scroll"><table class="st mx"><thead><tr><th></th>${alive.map((r) => `<th>${esc(r.ticker)}</th>`).join("")}</tr></thead><tbody>
    ${alive.map((a) => `<tr><td style="text-align:left">${esc(a.ticker)}</td>${alive.map((b) => { const c = rr.matrix[a.ticker][b.ticker]; return `<td>${a.ticker === b.ticker ? "·" : c && c.played ? `${c.for}–${c.against}${c.draws ? " (" + c.draws + " drawn)" : ""}` : "no game"}</td>`; }).join("")}</tr>`).join("")}</tbody></table></div></details>`;
  return `<p class="note"><b>Group stage.</b> Every name still in plays every other once on every row that plays: ${onList.map((m) => m.label).join(", ")}. The better number wins the game — cheaper multiple, faster growth, lighter debt, more room to the target; equal numbers draw; a game where either side has no number is not played and counts against nobody. ${rr.games} games. The standings seed the elimination; they knock nobody out.</p>
    ${standings}${matrix}
    <h1>elimination · the field of the names still in</h1>
    <p class="note">Now the fights. Click a name to knock it out or bring it back; the band and the median recompute from the names left. Seed 1 wears a ring. Click a row's name to take that metric out of the game (or put a resting one in) — that is how a filter gets knocked out, not just a name.</p>
    ${fieldHTML(names, { showSeeds: seeds })}
    <p class="note" style="margin-top:12px">${alive.length} of ${names.length} still in${S.out.size ? " · out: " + esc([...S.out].join(", ")) : ""}.</p>${next("TIMING", "ROUND 3 · TIMING")}`;
}

/* ROUND 3 · TIMING */
function renderTiming() {
  loadTiming();
  const names = r2in();
  const within = Number(S.prefs.reports_within_sessions) || 20;
  const rows = names.map((r) => {
    const t = S.timing[r.ticker] || {}; const g = r.metrics.geiger; const gAge = ageDays(r.dates.geiger, TODAY);
    const rsi = t.rsi, sig = t.sigma;
    return `<div class="trow">
      <div class="tk">${esc(r.ticker)}<small>${esc(r.name || "")}</small></div>
      <div class="kv"><span class="lbl">geiger now</span><b class="${gClass(g)}">${g == null ? "—" : fmtMetric(metric("geiger"), g)}</b><small>${r.dates.geiger ? "measured " + dateWord(r.dates.geiger) + (gAge > 7 ? " · " + gAge + " days old" : "") : "no date"} · board source</small></div>
      <div class="kv"><span class="lbl">rsi(14) · 1-year percentile</span><b>${rsi && rsi.pct != null ? rsi.pct.toFixed(0) + "th" : t.rsiErr ? "—" : t.rsi === null ? "—" : "…"}</b><small>${rsi ? "RSI " + rsi.today.toFixed(1) + " · of " + rsi.n + " prior days · measured " + dateWord(rsi.date) : t.rsiErr ? "statistics package not reached" : t.rsi === null ? "not in the statistics package" : "reading"}</small></div>
      <div class="kv"><span class="lbl">next report</span><b>${r.next_report ? "in " + r.next_report.days + " d" : "—"}</b><small>${r.next_report ? esc(r.next_report.date) + " · " + r.next_report.sessions + " sessions" + (r.next_report.eps_estimate != null ? " · EPS est " + r.next_report.eps_estimate.toFixed(2) : "") : "no date on file"}</small>${r.next_report && r.next_report.sessions <= within ? `<span class="flag">REPORTS INSIDE ${within} SESSIONS</span>` : ""}</div>
      <div class="kv"><span class="lbl">sigma events · last ${SIGMA_LOOKBACK} sessions</span><b>${sig ? (sig.count == null ? "—" : sig.count) : "…"}</b><small>${sig ? (sig.count == null ? esc(sig.reason) : "moves of " + SIGMA_X + "x the usual day (" + fmtMetric(metric("usual"), r.metrics.usual) + ") or more · " + sig.checked + " bars to " + esc(t.newest || "")) : "reading"}</small>
        ${sig && sig.events.length ? `<div class="evt">${sig.events.map((e) => `${esc(e.date || "")} <span class="${e.move >= 0 ? "up" : "dn"}">${e.move >= 0 ? "+" : "−"}${Math.abs(e.move).toFixed(1)}%</span> (${e.x.toFixed(1)}x)`).join(" · ")}</div>` : ""}</div>
    </div>`;
  }).join("");
  return `<p class="note">Round 3 is about when, not what. The Geiger is the board's own reading with its date. Its own 1-year percentile is not reachable — no Geiger history is stored — so the closest reachable read is RSI(14) against its own prior year, from the statistics package${S.statsBuilt ? " (built " + esc(S.statsBuilt.slice(0, 10)) + ")" : ""}.</p>
    <div class="field">${rows || `<div class="trow">no name is still in</div>`}</div>
    <p class="note" style="margin-top:12px">Nothing is knocked out automatically here. Go back to round 2 to knock a name out on what you see.</p>${next("FINAL", "FINAL · PICK / PASS / LATER")}`;
}

/* FINAL — under the sleeve caps and the book-wide hard cap (the one rule that narrows as you go). */
function renderFinal() {
  const names = r2in();
  const picks = picksAll();
  const here = picks.filter((p) => p.cohort === S.scenario.key);
  const lc = here.filter((p) => p.sleeve === "LC").length, sc = here.filter((p) => p.sleeve === "SC").length;
  const slots = (n, cap) => Array.from({ length: cap }, (_, i) => `<span class="slot ${i < n ? "full" : ""}"></span>`).join("");
  const pal = `<div class="pal"><span>PICKS SO FAR</span><span>${slots(lc, SLEEVE_CAPS.LC)} <b>large-cap sleeve ${lc} of ${SLEEVE_CAPS.LC}</b></span><span>${slots(sc, SLEEVE_CAPS.SC)} <b>small-cap sleeve ${sc} of ${SLEEVE_CAPS.SC}</b></span><span><b>book-wide ${picks.length} of ${SLEEVE_CAPS.total}</b> across every cohort in this browser${picks.length ? ": " + esc(picks.map((p) => p.ticker).join(", ")) : ""}</span></div>`;
  const rows = names.map((r) => { const d = S.decisions[r.ticker] || {}; const allow = pickAllowed(r, picks, SLEEVE_CAPS, S.scenario.key); const isPick = d.decision === "PICK"; return `<div class="drow">
    <div class="tk mono" style="font-size:17px;color:var(--ink)">${esc(r.ticker)}<small style="display:block;font-size:11px;color:var(--mute);font-family:var(--mono)">${esc(r.name || "")} · ${sleeveOf(r) === "LC" ? "large-cap sleeve" : "small-cap sleeve"}</small></div>
    <div><div class="seg">${["PICK", "PASS", "LATER"].map((v) => `<button class="${d.decision === v ? "on" : ""}" data-act="decide" data-t="${esc(r.ticker)}" data-v="${v}" ${v === "PICK" && !isPick && !allow.ok ? "disabled title=\"" + esc(allow.why) + "\"" : ""}>${v}</button>`).join("")}</div>
      ${d.decision === "LATER" ? `<div class="dt">look again on <input type="date" data-expires="${esc(r.ticker)}" value="${esc(d.expires_on || "")}"></div>` : ""}
      ${!isPick && !allow.ok ? `<div class="note" style="margin-top:6px;font-size:12.5px">${esc(allow.why)}</div>` : ""}</div>
    <div><textarea data-reason="${esc(r.ticker)}" placeholder="why — a full sentence you would still agree with in a month">${esc(d.reason || "")}</textarea></div>
  </div>`; }).join("");
  const all = S.rows.map((r) => { const d = S.decisions[r.ticker];
    if (r.is_etf) return `<div><b>${esc(r.ticker)}</b>reference · a fund, never in the rounds</div>`;
    const f = fitOf(r);
    if (!f.in) return `<div><b>${esc(r.ticker)}</b>OUT · round 1 · ${esc(f.why[0])}</div>`;
    if (S.out.has(r.ticker)) return `<div><b>${esc(r.ticker)}</b>OUT · knocked off the field</div>`;
    if (d && d.decision) return `<div><b>${esc(r.ticker)}</b>${esc(d.decision)}${d.expires_on ? " until " + esc(d.expires_on) : ""} · ${esc(d.reason || "no reason yet")} <span class="mono" style="color:var(--mute)">· heat ${r.metrics.geiger == null ? "—" : fmtMetric(metric("geiger"), r.metrics.geiger)} (${r.dates.geiger ? dateWord(r.dates.geiger) : "?"}) · ${esc((d.made_at || "").slice(0, 10))}</span></div>`;
    return `<div><b>${esc(r.ticker)}</b>still in · no decision yet</div>`; }).join("");
  return `<p class="note">Every name that reached the final gets one of three words and a reason. PICK is a name you would buy when the Geiger says so; PASS is out for now; LATER carries a date to look again. The sleeve caps and the book-wide hard cap are the allocation tool's own (${SLEEVE_CAPS.LC} large, ${SLEEVE_CAPS.SC} small, ${SLEEVE_CAPS.total} in all): as in the designer, the one rule that narrows the options as you go.</p>
    ${pal}
    <div class="field">${rows || `<div class="drow">no name reached the final</div>`}</div>
    <h1>the whole run · ${esc(S.scenario.label)}</h1><div class="list">${all}</div>
    <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="go" data-act="export">DOWNLOAD THIS RUN (JSON)</button><button class="go dim" data-act="clear">CLEAR DECISIONS FOR THIS GROUP</button><button class="go dim" data-act="clear-out">BRING EVERY NAME BACK ON THE FIELD</button></div>
    <p class="note">Saved in this browser only (localStorage). The proposed tables operator_decisions and operator_preferences are in the migration beside this page; nothing here writes to them.</p>`;
}

/* ---- actions ---------------------------------------------------------------------------- */
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === "scenario") { const u = new URL(location.href); u.search = "?scenario=" + v + "&stage=" + S.stage; location.href = u.toString(); return; }
  if (act === "stage") { S.stage = v; render(); window.scrollTo(0, 0); return; }
  if (act === "view") { S.view = v; render(); return; }
  if (act === "filter") { S.filters[b.dataset.k] = v; render(); return; }
  if (act === "knock") { S.out = toggleOut(S.out, v); saveOut(); render(); return; }
  if (act === "metric") { const m = metric(v); if (!m || !m.better) return; const on = metricsOn().has(v); S.metricsOff.delete(v); S.metricsOff.delete("!" + v); if (on) S.metricsOff.add(v); else if (!m.plays) S.metricsOff.add("!" + v); render(); return; }
  if (act === "theme-pick") { S.theme = v; saveTheme(); render(); return; }
  if (act === "toggle") { S.prefs = applyToggles(S.prefs, { [b.dataset.k]: v }); savePrefs(); render(); return; }
  if (act === "pref") { S.prefs[b.dataset.k] = b.dataset.k === "needs_earnings" ? v === "1" : Number(v); savePrefs(); render(); return; }
  if (act === "theme") { const t = b.dataset.t; const reason = S.prefs.themes_out[t] ?? S.prefs.themes_care[t] ?? "";
    delete S.prefs.themes_out[t]; delete S.prefs.themes_care[t];
    if (v === "OUT") S.prefs.themes_out[t] = reason; if (v === "CARE") S.prefs.themes_care[t] = reason;
    savePrefs(); render(); return; }
  if (act === "decide") { const t = b.dataset.t; const r = S.rows.find((x) => x.ticker === t);
    S.decisions[t] = { ...(S.decisions[t] || {}), decision: v, sleeve: r ? sleeveOf(r) : "LC", heat_at: r ? r.metrics.geiger : null, heat_date: r ? r.dates.geiger : null, made_at: new Date().toISOString(), cohort: S.scenario.key };
    saveDecisions(); render(); return; }
  if (act === "export") { const blob = new Blob([JSON.stringify({ scenario: S.scenario.key, today: TODAY, theme: S.theme, prefs: S.prefs, metrics_off: [...S.metricsOff], knocked_out: [...S.out], decisions: S.decisions }, null, 1)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `comps-${S.scenario.key}-${TODAY}.json`; a.click(); return; }
  if (act === "clear") { S.decisions = {}; saveDecisions(); render(); return; }
  if (act === "clear-out") { S.out = new Set(); saveOut(); render(); return; }
});
document.addEventListener("input", (e) => {
  const t = e.target;
  if (t.dataset.pref) { S.prefs[t.dataset.pref] = t.value; savePrefs(); }
  if (t.dataset.themeReason != null) { const k = t.dataset.themeReason; if (k in S.prefs.themes_out) S.prefs.themes_out[k] = t.value; else if (k in S.prefs.themes_care) S.prefs.themes_care[k] = t.value; savePrefs(); }
  if (t.dataset.reason) { S.decisions[t.dataset.reason] = { ...(S.decisions[t.dataset.reason] || {}), reason: t.value, cohort: S.scenario.key }; saveDecisions(); }
  if (t.dataset.expires) { S.decisions[t.dataset.expires] = { ...(S.decisions[t.dataset.expires] || {}), expires_on: t.value }; saveDecisions(); }
});
document.addEventListener("change", (e) => { if (e.target.dataset.pref || e.target.dataset.themeReason != null) render(); });

load().then(() => { render(); if (S.stage === "TIMING" || S.stage === "FINAL") loadTiming(); })
  .catch((e) => { const el = document.getElementById("stage"); el.className = ""; el.innerHTML = `<div class="err">The workshop could not read the Hub: ${esc(e.message || e)}. Nothing is shown rather than something invented.</div>`; });
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
