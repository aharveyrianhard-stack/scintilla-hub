<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>Geiger in motion · B · the field</title>
<link rel="stylesheet" href="gv.css">
<style>
.gv-body{overflow:hidden}
.tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line2);padding:6px 8px;font-size:11px;color:var(--ink2);display:none;white-space:nowrap}
.tip b{color:var(--ink);font-weight:500}
</style></head>
<body>
<div class="gv-app">
  <div class="gv-top">
    <div class="gv-title"><b>GEIGER IN MOTION</b> · B · the field</div>
    <div id="coh"></div>
    <div id="tr"></div><span data-scnav-slot></span>
  </div>
  <div class="gv-body" id="field"><div class="tip" id="tip"></div></div>
  <div class="gv-foot"><span>across: today's move in <b>usual days</b> (the day's % ÷ its mean absolute day over 20) · up: the <b>Geiger</b> reading · size: market cap · depth: dollar liquidity, the thin names sit back and dim · green/red: the day's direction</span><span id="perf"></span></div>
</div>
<script src="data.js"></script><script src="gv-common.js"></script>
<script>
(function(){
  const host=document.getElementById("field"), tip=document.getElementById("tip");
  const C=GV.canvas(host), ctx=C.ctx;
  let cohort="AI_HARDWARE", names=[], P={}, hover=null;
  const clock=GV.clock(frame); GV.transport(document.getElementById("tr"),clock);
  GV.chips(document.getElementById("coh"),[["AI_HARDWARE","AI HW"],["FAV","LIKED"]],cohort,(k)=>{cohort=k;build();clock.dirty=true;});
  function build(){
    names=GV.cohort(cohort); P={};
    const caps=names.map(GV.mcap).filter(Boolean), liqs=names.map(GV.liq).filter(Boolean);
    const cmin=Math.sqrt(Math.min(...caps)), cmax=Math.sqrt(Math.max(...caps));
    const lsort=liqs.slice().sort((a,b)=>a-b);
    names.forEach(t=>{ const cap=GV.mcap(t), liq=GV.liq(t);
      const size=cap?(Math.sqrt(cap)-cmin)/((cmax-cmin)||1):0.2;
      const depth=liq?lsort.indexOf(liq)/((lsort.length-1)||1):0;   /* 0 = thinnest, 1 = deepest liquidity */
      P[t]={size,depth,x:null,y:null,trail:[]}; });
    /* draw order: thin names first (they sit at the back), deep liquidity on top */
    names.sort((a,b)=>P[a].depth-P[b].depth);
  }
  const BULL=GV.css("--bull"), BEAR=GV.css("--bear"), INK=GV.css("--ink"), INK2=GV.css("--ink2"), DIM=GV.css("--dim"), MUTE=GV.css("--mute"), LINE=GV.css("--line2");
  function frame(pos,dt){
    const {w,h}=C.fit(); const phone=w<560;
    const pad={l:phone?34:56,r:phone?12:40,t:phone?14:22,b:phone?26:34};
    const X=(u)=>pad.l+((Math.max(-3.5,Math.min(3.5,u))+3.5)/7)*(w-pad.l-pad.r);
    const Y=(g)=>pad.t+((1-g)/2)*(h-pad.t-pad.b);
    ctx.clearRect(0,0,w,h);
    /* the floor: a perspective grid, the "3D" is depth, not decoration */
    ctx.strokeStyle=LINE; ctx.lineWidth=1;
    const vpx=w/2, vpy=pad.t-h*0.9;
    for(let k=0;k<=8;k++){ const x=pad.l+(k/8)*(w-pad.l-pad.r); ctx.globalAlpha=0.55; ctx.beginPath(); ctx.moveTo(x,h-pad.b); ctx.lineTo(vpx+(x-vpx)*0.55,pad.t); ctx.stroke(); }
    for(let k=0;k<=4;k++){ const y=pad.t+(k/4)*(h-pad.t-pad.b); ctx.globalAlpha=k===2?0.9:0.4; ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(w-pad.r,y); ctx.stroke(); }
    ctx.globalAlpha=1;
    /* the two axes, named in words */
    ctx.fillStyle=DIM; ctx.font=(phone?9:10)+"px "+GV.css("--mono"); ctx.textAlign="center";
    ctx.fillText("−3 usual days",X(-3),h-pad.b+(phone?14:18)); ctx.fillText("flat on the day",X(0),h-pad.b+(phone?14:18)); ctx.fillText("+3 usual days",X(3),h-pad.b+(phone?14:18));
    ctx.textAlign="right"; ctx.fillText("bull +1",pad.l-6,Y(1)+4); ctx.fillText("0",pad.l-6,Y(0)+4); ctx.fillText("bear −1",pad.l-6,Y(-1)+4);
    if(!phone){ ctx.textAlign="left"; ctx.fillStyle=MUTE; ctx.font="10px "+GV.css("--mono"); ctx.fillText("UP MORE THAN USUAL · BULL READING",X(0.4),pad.t+14); ctx.fillText("UP MORE THAN USUAL · BEAR READING",X(0.4),h-pad.b-8); ctx.textAlign="right"; ctx.fillText("DOWN MORE THAN USUAL · BULL READING",X(-0.4),pad.t+14); ctx.fillText("DOWN MORE THAN USUAL · BEAR READING",X(-0.4),h-pad.b-8); }
    /* the names */
    const rmin=phone?3:4, rmax=phone?13:22, labelled=[];
    const capOrder=names.slice().sort((a,b)=>(GV.mcap(b)||0)-(GV.mcap(a)||0)).slice(0,phone?6:12);
    for(const t of names){
      const p=P[t], g=GV.geigerAt(t,pos), u=GV.vsUsualAt(t,pos), c=GV.chgAt(t,pos);
      if(g==null||u==null) continue;
      const tx=X(u), ty=Y(g);
      /* the drift: each dot eases to where the day puts it, so a scrub or a speed change never jumps */
      const ox=p.x,oy=p.y; p.x=p.x==null?tx:GV.approach(p.x,tx,dt,120); p.y=p.y==null?ty:GV.approach(p.y,ty,dt,120); if(ox==null||Math.abs(p.x-ox)+Math.abs(p.y-oy)>0.05) clock.dirty=true;
      const r=rmin+(rmax-rmin)*p.size*(0.7+0.3*p.depth), a=0.35+0.55*p.depth;
      const col=c>=0?BULL:BEAR;
      /* a short trail of where it has just been - the motion is legible in a still frame */
      p.trail.push([p.x,p.y]); if(p.trail.length>14) p.trail.shift();
      if(p.trail.length>2){ ctx.beginPath(); ctx.moveTo(p.trail[0][0],p.trail[0][1]); for(const q of p.trail) ctx.lineTo(q[0],q[1]); ctx.strokeStyle=GV.rgba(col,0.18*a); ctx.lineWidth=Math.max(1,r*0.5); ctx.lineCap="round"; ctx.stroke(); }
      ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fillStyle=GV.rgba(col,a*0.55); ctx.fill();
      ctx.lineWidth=1.2; ctx.strokeStyle=GV.rgba(col,Math.min(1,a+0.25)); ctx.stroke();
      if(capOrder.indexOf(t)>=0||hover===t) labelled.push([t,p.x,p.y,r,g,c,u]);
      p.r=r;
    }
    ctx.font=(phone?10:11)+"px "+GV.css("--mono"); ctx.textAlign="left";
    const placed=[]; labelled.sort((a,b)=>b[3]-a[3]);
    for(const [t,x,y,r] of labelled){ const lx=x+r+4, ly=y+4; if(hover!==t && placed.some(q=>Math.abs(q[1]-ly)<11 && Math.abs(q[0]-lx)<44)) continue; placed.push([lx,ly]); ctx.fillStyle=hover===t?INK:INK2; ctx.fillText(t,lx,ly); }
    if(hover&&P[hover]&&P[hover].x!=null){ const p=P[hover]; ctx.beginPath(); ctx.arc(p.x,p.y,p.r+3,0,Math.PI*2); ctx.strokeStyle=INK; ctx.lineWidth=1; ctx.stroke(); }
  }
  host.addEventListener("mousemove",(e)=>{ const b=host.getBoundingClientRect(), mx=e.clientX-b.left, my=e.clientY-b.top; let best=null,bd=1e9;
    for(const t of names){ const p=P[t]; if(p.x==null) continue; const d=Math.hypot(p.x-mx,p.y-my); if(d<Math.max(10,p.r+4)&&d<bd){bd=d;best=t;} }
    if(hover!==best) clock.dirty=true; hover=best; if(best){ const g=GV.geigerAt(best,clock.pos), c=GV.chgAt(best,clock.pos), u=GV.vsUsualAt(best,clock.pos);
      tip.style.display="block"; tip.style.left=(mx+14)+"px"; tip.style.top=(my-10)+"px";
      tip.innerHTML="<b>"+best+"</b> · "+GV.name(best).slice(0,26)+"<br>geiger <b>"+GV.fmtG(g)+"</b> · day "+GV.fmtPct(c)+" = "+(u==null?"—":u.toFixed(1))+"× its usual day<br>cap "+GV.fmtCap(GV.mcap(best)); }
    else tip.style.display="none"; });
  host.addEventListener("mouseleave",()=>{hover=null;clock.dirty=true;tip.style.display="none";});
  build(); clock.start(); clock.play();
  setInterval(()=>{ document.getElementById("perf").textContent="frames "+window.__GV.frames; },1000);
})();
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
</body></html>
