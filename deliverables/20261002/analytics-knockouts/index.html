<script type="module">
import { COMPARISONS, BASELINE as KB, withToggles, roundRobin, game } from "./bracket.mjs";
import { allocate, BASELINE as AB } from "./allocate.mjs";
import { stretchPercentile, agreement, num } from "./stats.mjs";

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const PCT = (v, d) => v == null ? "—" : (v < 0 ? "(" : "") + Math.abs(v).toFixed(d ?? (Math.abs(v) >= 10 ? 0 : 1)) + "%" + (v < 0 ? ")" : "");
const X = (v) => v == null ? "—" : (v < 0 ? "(" : "") + Math.abs(v).toFixed(Math.abs(v) >= 100 ? 0 : 1) + "x" + (v < 0 ? ")" : "");
const SG = (v) => v == null ? "—" : (v < 0 ? "(" : "") + Math.abs(v).toFixed(2) + (v < 0 ? ")" : "");
const USD = (v) => v == null ? "—" : "$" + (Math.abs(v) >= 100 ? Math.round(v).toLocaleString("en-US") : v.toFixed(2));
const CAP = (v) => v == null ? "—" : v >= 1e12 ? "$" + (v / 1e12).toFixed(2) + "T" : v >= 1e9 ? "$" + (v / 1e9).toFixed(0) + "B" : "$" + (v / 1e6).toFixed(0) + "M";
const P0 = (v) => v == null ? "—" : Math.round(v).toString();
const ORD = (v) => { if (v == null) return "—"; const n = Math.round(v), r = n % 100; return n + (r >= 11 && r <= 13 ? "th" : ["th", "st", "nd", "rd"][n % 10] || "th"); };
const dir = (v) => v == null ? "" : v >= 0 ? " up" : " dn";
const FMT = { pct: (v) => PCT(v), x: X, signed: SG, pctile: ORD, usd2: (v) => v == null ? "—" : "$" + v.toFixed(2) };
const MEASURES = [["pe_ttm", "P/E", "x"], ["pe_fwd", "P/E fwd", "x"], ["ev_ebitda", "EV/EBITDA", "x"], ["ev_sales", "EV/S", "x"], ["ps", "P/S", "x"], ["peg", "PEG", "x"], ["rev_g_ttm", "Rev TTM", "pct"], ["rev_g_fy", "Rev next FY", "pct"], ["eps_g_fy", "EPS next FY", "pct"], ["gm", "Gross", "pct"], ["om", "Operating", "pct"], ["fcfm", "FCF", "pct"], ["nd_ebitda", "ND/EBITDA", "x"], ["capex_rev", "CapEx/rev", "pct"], ["capex_g", "CapEx g", "pct"], ["rev_per_capex", "Rev per CapEx $", "usd2"]];
const MGROUPS = [["valuation", 6], ["growth", 3], ["margins", 3], ["balance sheet", 1], ["capex", 3]];
const SB = "https://wadinxqplrggagkvrdag.supabase.co", LS = "sc_knockout_swipes";
const TODAY = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });

/* ---- state: every toggle is Alan's assumption with a baseline ----------------------------------------------- */
const S = {
  data: null, group: null, heat: { extended_at: 90, oversold_at: 10, lean_n: 2, hide_thin: false }, field: { disagree_at: 15 },
  ko: { overrides: {}, advance: KB.advance, tolerance: KB.tolerance, min_played: KB.min_played }, pair: null,
  alloc: { cash_pct: AB.cash_pct, lead_weights: AB.lead_weights.slice(), balance_weight: AB.balance_weight, extended_at: AB.extended_at, extended_cut: AB.extended_cut },
  swipes: [], swipeMode: "—", key: null, writes: { db: 0, local: 0, refused: 0 },
};
const HEAT_BASE = { ...S.heat }, FIELD_BASE = { ...S.field }, ALLOC_BASE = { ...S.alloc, lead_weights: S.alloc.lead_weights.slice() };

async function main() {
  const app = document.getElementById("app");
  let file = `data-${TODAY}.json`;
  try {
    let r = await fetch(file, { cache: "no-store" });
    if (!r.ok) { file = "data-2026-10-02.json"; r = await fetch(file, { cache: "no-store" }); }
    if (!r.ok) throw new Error(file + " → " + r.status);
    S.data = await r.json(); S.file = file;
  } catch (e) { app.innerHTML = `<div class="err">The data file could not be read: ${esc(e.message)}. Run <code>node build.mjs</code> beside this page.</div>`; return; }
  S.group = S.data.fields[0] ? S.data.fields[0].id : null;
  document.getElementById("stamp").textContent = `A1 · data of ${S.data.today} (last finished session ${S.data.last_session}) · read ${S.data.taken.slice(0, 16).replace("T", " ")}Z · ${S.file}`;
  await loadKeyAndSwipes();
  render();
}
async function loadKeyAndSwipes() {
  /* the page's public key, read from the Hub's own page when this page is served beside it; nothing is stored */
  try { const t = await (await fetch("/index.html", { cache: "no-store" })).text(); const m = t.match(/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_.\-]+/); if (m) S.key = m[0]; } catch (_) {}
  const local = (() => { try { return JSON.parse(localStorage.getItem(LS) || "[]"); } catch (_) { return []; } })();
  if (S.key) {
    try { const rows = await (await fetch(SB + "/rest/v1/comps_decisions?select=company,peer,reason,off,set_by,set_at,source&source=eq.analytics-knockouts&order=set_at.asc", { headers: { apikey: S.key, Authorization: "Bearer " + S.key } })).json(); S.swipes = (Array.isArray(rows) ? rows : []).concat(local.map((r) => ({ ...r, local: true }))); S.swipeMode = "public.comps_decisions"; return; } catch (_) {}
  }
  S.swipes = local.map((r) => ({ ...r, local: true })); S.swipeMode = "this browser only (no key or no table)";
}
/* the swipe is one append-only row: company = the name, peer = the name itself, measure ALL, off = PASS, reason = KEEP | PASS | LATER + the group; reversible by a later row */
async function swipe(ticker, verdict, group) {
  const row = { company: ticker, peer: ticker, measure: "ALL", off: verdict === "PASS", reason: `${verdict} · ${group} · knockout of ${S.data.today}`, set_by: "alan", source: "analytics-knockouts" };
  let saved = false;
  if (S.key) { try { const r = await fetch(SB + "/rest/v1/comps_decisions", { method: "POST", headers: { apikey: S.key, Authorization: "Bearer " + S.key, "Content-Type": "application/json", Prefer: "return=minimal" }, body: JSON.stringify([row]) }); if (r.ok) { saved = true; S.writes.db++; } else S.writes.refused++; } catch (_) { S.writes.refused++; } }
  if (!saved) { try { const all = JSON.parse(localStorage.getItem(LS) || "[]"); all.push({ ...row, set_at: new Date().toISOString() }); localStorage.setItem(LS, JSON.stringify(all)); S.writes.local++; } catch (_) {} }
  S.swipes.push({ ...row, set_at: new Date().toISOString(), local: !saved });
  render();
}
const latestSwipe = (t) => { const rows = S.swipes.filter((r) => r.company === t); if (!rows.length) return null; const r = rows[rows.length - 1]; return (r.reason || "").split(" · ")[0]; };

/* ---- the balance sentence the heat implies ------------------------------------------------------------------- */
function balance(sectors) {
  const H = S.heat, ok = sectors.filter((s) => s.geiger != null && s.rank_rotation != null);
  const extended = ok.filter((s) => s.stretch != null && s.stretch >= H.extended_at).map((s) => s.label);
  const oversold = ok.filter((s) => s.stretch != null && s.stretch <= H.oversold_at).map((s) => s.label);
  /* the heat and the rotation together: the sum of the Geiger rank and the rotation rank, lowest first */
  const both = (s) => (s.rank_geiger ?? 99) + (s.rank_rotation ?? 99);
  const lean = ok.filter((s) => !(s.stretch >= H.extended_at)).slice().sort((a, b) => both(a) - both(b) || a.rank_rotation - b.rank_rotation).slice(0, H.lean_n).map((s) => s.label);
  const away = ok.slice().sort((a, b) => both(b) - both(a) || b.rank_rotation - a.rank_rotation).slice(0, 1).map((s) => s.label);
  const words = `Lean toward ${lean.join(" and ") || "nothing"}, away from ${away.join(", ") || "nothing"}` + (extended.length ? `; ${extended.join(", ")} ${extended.length > 1 ? "are" : "is"} extended` : "; nothing is extended") + (oversold.length ? `. Oversold against itself: ${oversold.join(", ")}.` : ".");
  return { words, lean, away, extended, oversold };
}
const spark = (vals, w = 70, h = 14) => { const v = (vals || []).filter((x) => x != null); if (v.length < 2) return ""; const lo = Math.min(...v, -1), hi = Math.max(...v, 1); const pts = v.map((x, i) => `${(i / (v.length - 1)) * w},${h - ((x - lo) / (hi - lo)) * h}`).join(" "); const z = h - ((0 - lo) / (hi - lo)) * h; return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><line x1="0" x2="${w}" y1="${z}" y2="${z}" stroke="#3a3a3a" stroke-width="1"/><polyline points="${pts}" fill="none" stroke="${v[v.length - 1] >= v[v.length - 2] ? "#4fae6a" : "#d0554a"}" stroke-width="1.2"/></svg>`; };
const stretchBar = (p) => p == null ? "—" : `<span class="bar${p >= S.heat.extended_at ? " ext" : p <= S.heat.oversold_at ? " os" : ""}"><i style="width:${p}%"></i></span>${ORD(p)}`;

/* ---- render ------------------------------------------------------------------------------------------------ */
function render() {
  const D = S.data, h = [];
  /* 1 · HEAT */
  const B = balance(D.sectors);
  h.push(`<h2 id="heat">1 · heat <small>where the market is strong and weak now, read down the tree: sector, then industry group</small></h2>
  <div class="panel"><div class="say"><b>${esc(B.words)}</b> <span class="n">Rule: lean toward the ${S.heat.lean_n} sectors that rank best on the Geiger and the rotation together (the sum of the two ranks) and are not extended; away from the sector that ranks worst on both together; extended = at or above the ${S.heat.extended_at}th percentile of its own history; oversold = at or below the ${S.heat.oversold_at}th. Each line is a toggle below.</span></div>
  <div class="ctl"><span class="lab">extended at</span><span class="seg">${[80, 90, 95].map((v) => `<button data-set="heat.extended_at" data-v="${v}" class="${S.heat.extended_at === v ? "on" : ""}">${v}th</button>`).join("")}</span><span class="lab">oversold at</span><span class="seg">${[5, 10, 20].map((v) => `<button data-set="heat.oversold_at" data-v="${v}" class="${S.heat.oversold_at === v ? "on" : ""}">${v}th</button>`).join("")}</span><span class="lab">lean toward</span><span class="seg">${[1, 2, 3].map((v) => `<button data-set="heat.lean_n" data-v="${v}" class="${S.heat.lean_n === v ? "on" : ""}">${v}</button>`).join("")}</span><span class="lab">thin groups</span><span class="seg"><button data-set="heat.hide_thin" data-v="0" class="${!S.heat.hide_thin ? "on" : ""}">show</button><button data-set="heat.hide_thin" data-v="1" class="${S.heat.hide_thin ? "on" : ""}">hide</button></span><span class="mute">baseline: ${HEAT_BASE.extended_at}th · ${HEAT_BASE.oversold_at}th · ${HEAT_BASE.lean_n} · show</span></div>
  <h3 style="padding:0 14px">sectors · ${D.sectors.length}</h3>
  <div class="tw"><table class="t"><thead><tr><th class="l tk">sector</th><th>served</th><th>Geiger · 7 rungs</th><th>Hub's Geiger</th><th>daily rung · 500 sessions</th><th>stretch vs its own history</th><th>rotation · 72 sess</th><th>rank</th><th>· 16 sess</th><th>rank</th><th>&lt; 7 rungs</th></tr></thead><tbody>
  ${D.sectors.map((s) => `<tr><td class="l tk">${esc(s.label)}</td><td>${s.served}</td><td class="k${dir(s.geiger)}">${SG(s.geiger)}</td><td>${SG(s.geiger_hub)}</td><td>${spark(s.sparkline)}${SG(s.daily_today)}</td><td>${stretchBar(s.stretch)}</td><td class="${dir(s.rs_medium)}">${PCT(s.rs_medium, 1)}</td><td class="k">${s.rank_rotation ?? "—"}</td><td class="${dir(s.rs_short)}">${PCT(s.rs_short, 1)}</td><td>${s.rank_rotation_short ?? "—"}</td><td>${s.lt7 || "—"}</td></tr>`).join("")}
  </tbody></table></div>
  <h3 style="padding:0 14px">industry groups · ${D.industries.length} on the served names · ${D.industries.filter((i) => i.thin).length} thin (fewer than ${D.sources.groups.min_served_for_the_field} served names)${D.thin_above.length ? ` · ranked above the chosen leaders but thin: ${D.thin_above.map((t) => `${esc(t.label)} (${t.served})`).join(", ")}` : ""}</h3>
  <div class="tw" style="max-height:520px;overflow-y:auto"><table class="t"><thead><tr><th class="l tk">group</th><th class="l">sector</th><th>served</th><th>Geiger · 7</th><th>stretch</th><th>rotation 72</th><th>rank of ${D.industries.length}</th><th>16</th><th>&lt; 7 rungs</th><th class="l">in the field</th></tr></thead><tbody>
  ${D.industries.filter((i) => !(S.heat.hide_thin && i.thin)).map((i) => { const fg = D.field_groups.find((g) => g.id === i.id); return `<tr class="${i.thin ? "thin" : ""}${fg ? " pick" : ""}"><td class="l tk">${esc(i.label)}${i.thin ? '<span class="flag">thin</span>' : ""}</td><td class="l">${esc(i.sector)}</td><td>${i.served}</td><td class="k${dir(i.geiger)}">${SG(i.geiger)}</td><td>${stretchBar(i.stretch)}</td><td class="${dir(i.rs_medium)}">${PCT(i.rs_medium, 1)}</td><td>${i.rank_rotation ?? "—"}</td><td>${i.rank_rotation_short ?? "—"}</td><td>${i.lt7 || "—"}</td><td class="l">${fg ? (fg.role === "lead" ? "leader" : "the oversold leg") : ""}</td></tr>`; }).join("")}
  </tbody></table></div>

  /* 3 · THE KNOCKOUT */
  const cmp = withToggles(S.ko.overrides), names = F ? F.rows.map(toPlayer) : [], R = roundRobin(names, cmp, { advance: S.ko.advance, tolerance: S.ko.tolerance, min_played: S.ko.min_played });

  <div class="ctl"><span class="lab">advance</span><span class="seg">${[2, 3, 4].map((v) => `<button data-set="ko.advance" data-v="${v}" class="${S.ko.advance === v ? "on" : ""}">${v}</button>`).join("")}</span><span class="lab">a draw within</span><span class="seg">${[0, 0.02, 0.05].map((v) => `<button data-set="ko.tolerance" data-v="${v}" class="${S.ko.tolerance === v ? "on" : ""}">${v ? Math.round(v * 100) + "%" : "exact"}</button>`).join("")}</span><span class="lab">a game needs</span><span class="seg">${[1, 3, 5].map((v) => `<button data-set="ko.min_played" data-v="${v}" class="${S.ko.min_played === v ? "on" : ""}">${v}</button>`).join("")}</span><button data-reset="ko">reset to the baselines</button><span class="mute">baseline: advance ${KB.advance} · exact ties only · ${KB.min_played} comparisons played</span></div>
  </div><div>
  <h3 style="padding:0 14px">standings · ${names.length} names · ${R.games.length} games · a win is one point, a draw a half; ties by the head-to-head, then comparison points</h3>

  ${R.standings.map((s) => `<tr class="${R.advance.includes(s.ticker) ? "pick" : ""}"><td>${s.place}</td><td class="l tk">${esc(s.ticker)}${R.advance.includes(s.ticker) ? '<span class="flag">advances</span>' : ""}</td><td class="k">${s.points}</td><td>${s.wins}</td><td>${s.draws}</td><td>${s.losses}</td><td>${s.unplayed || "—"}</td><td class="l mute">${Object.entries(s.rowWins).sort((a, b) => b[1] - a[1]).slice(0, 3).map(([k, n]) => `${shortLabel(k)} ${n}/${s.rowPlayed[k]}`).join(" · ") || "—"}</td></tr>`).join("")}
  </tbody></table></div></div></div>

  <h3 style="padding:0 14px">the table of results · row beats column: <span class="up">won</span> · <span class="dn">lost</span> · <span class="mute">drawn</span> · <span class="mute">×</span> not played · click a cell for the comparisons</h3>
  <div class="tw" style="max-height:600px;overflow:auto"><table class="t mx"><thead><tr><th class="tk l"></th>${R.standings.map((s) => `<th>${esc(s.ticker)}</th>`).join("")}</tr></thead><tbody>

  </tbody></table></div>

  <div class="src"><b>Rule.</b> A game is decided by the comparisons that are on: a comparison with a missing number on either side is not played (a blank, never a loss); a game with fewer than ${S.ko.min_played} comparisons played is not played at all, so a name with blanks cannot collect draws; the side with more weighted comparison points takes the game; equal points is a draw. The top ${S.ko.advance} of the standings advance. Changing any toggle re-runs every game on this page. Numbers: upside by the three ways and the measures from step 2; Geiger and stretch from step 1. Date: ${D.today}.</div></div>`);

  /* 4 · THE SWIPE */
  const finalists = D.fields.map((f) => { const n = f.rows.map(toPlayer); const r = f.id === (F && F.id) ? R : roundRobin(n, cmp, { advance: S.ko.advance, tolerance: S.ko.tolerance, min_played: S.ko.min_played }); return { f, r }; });
  h.push(`<h2 id="swipe">4 · the swipe <small>keep · pass · later for the finalists of every group, saved as one append-only row each; a later row reverses an earlier one</small></h2>

  <div class="counter">decisions go to <b>${esc(S.swipeMode)}</b> · this visit: ${S.writes.db} saved to the table, ${S.writes.local} kept in this browser, ${S.writes.refused} refused · on file for this page: ${S.swipes.length} row${S.swipes.length === 1 ? "" : "s"} (source analytics-knockouts)</div>
  <div class="src"><b>Shape.</b> One row in public.comps_decisions per swipe: company and peer are the name, measure ALL, off is true only for PASS, the reason carries the verdict, the group and the date, source analytics-knockouts. Append-only; nothing is updated or deleted. In a test browser every write is blocked and counted by the harness.</div></div>`);

  /* 5 · WHAT IT SAYS TODAY */
  const groupsIn = D.fields.map((f) => { const fr = finalists.find((x) => x.f.id === f.id).r; return { id: f.id, label: f.label, sector: f.sector, role: f.role, stretch: f.stretch, served: f.served, finalists: fr.advance, passed: new Set(fr.advance.filter((t) => latestSwipe(t) === "PASS")) }; });
  const A = allocate(groupsIn, S.alloc), leanS = B;
  const thinNames = D.fields.flatMap((f) => f.rows.filter((r) => r.rungs != null && r.rungs < 7).map((r) => `${r.ticker} (${r.rungs})`));
  h.push(`<h2 id="today">5 · what it says today <small>the pipe end to end on ${D.today} data, under the baselines above: heat → groups → knockout → the first allocation read</small></h2>

  <div class="say"><b>Names that survive.</b> ${finalists.map(({ f, r }) => `${esc(f.label)}: ${r.advance.map((t) => `<b>${esc(t)}</b>${latestSwipe(t) ? " (" + esc(latestSwipe(t).toLowerCase()) + ")" : ""}`).join(", ") || "none"}`).join("; ")}.</div>

  <div class="ctl"><span class="lab">cash</span><span class="seg">${[10, 25, 40].map((v) => `<button data-set="alloc.cash_pct" data-v="${v}" class="${S.alloc.cash_pct === v ? "on" : ""}">${v}%</button>`).join("")}</span><span class="lab">leaders' shares</span><span class="seg">${[["3,2,1", [3, 2, 1]], ["1,1,1", [1, 1, 1]], ["4,2,1", [4, 2, 1]]].map(([l, v]) => `<button data-set="alloc.lead_weights" data-v="${l}" class="${S.alloc.lead_weights.join(",") === l ? "on" : ""}">${l}</button>`).join("")}</span><span class="lab">oversold leg</span><span class="seg">${[0.5, 1, 2].map((v) => `<button data-set="alloc.balance_weight" data-v="${v}" class="${S.alloc.balance_weight === v ? "on" : ""}">${v}</button>`).join("")}</span><span class="lab">extended at</span><span class="seg">${[80, 90, 95].map((v) => `<button data-set="alloc.extended_at" data-v="${v}" class="${S.alloc.extended_at === v ? "on" : ""}">${v}th</button>`).join("")}</span><span class="lab">extended keeps</span><span class="seg">${[0.25, 0.5, 1].map((v) => `<button data-set="alloc.extended_cut" data-v="${v}" class="${S.alloc.extended_cut === v ? "on" : ""}">${v * 100}%</button>`).join("")}</span><span class="mute">baseline: cash ${ALLOC_BASE.cash_pct}% · ${ALLOC_BASE.lead_weights.join(",")} · leg ${ALLOC_BASE.balance_weight} · ${ALLOC_BASE.extended_at}th · keeps ${ALLOC_BASE.extended_cut * 100}%</span></div>
  <div class="tw"><table class="t"><thead><tr><th class="l tk">group</th><th class="l">sector</th><th class="l">role</th><th>share weight</th><th>stretch</th><th>served</th><th>weight</th><th class="l">by name</th><th>to cash (passed)</th></tr></thead><tbody>
  ${A.groups.map((g) => `<tr><td class="l tk">${esc(g.label)}${g.extended ? '<span class="flag">extended</span>' : ""}${g.thin ? '<span class="flag">thin</span>' : ""}</td><td class="l">${esc(g.sector || "—")}</td><td class="l">${g.role === "lead" ? "leader" : "oversold leg"}</td><td>${g.base}${g.extended ? " × " + S.alloc.extended_cut : ""}</td><td>${ORD(g.stretch)}</td><td>${g.served}</td><td class="k">${g.held.toFixed(1)}%</td><td class="l">${g.names.map((n) => `${esc(n.ticker)} ${n.pct.toFixed(1)}%`).join(" · ") || "—"}</td><td>${g.to_cash ? g.to_cash.toFixed(1) + "%" : "—"}</td></tr>`).join("")}
  <tr><td class="l tk">cash</td><td></td><td></td><td></td><td></td><td></td><td class="k">${A.cash.toFixed(1)}%</td><td class="l mute">the remainder</td><td></td></tr>
  </tbody></table></div>
  <div class="words"><p><b>What is thin.</b> ${D.industries.filter((i) => i.thin).length} of ${D.industries.length} industry groups have fewer than ${D.sources.groups.min_served_for_the_field} served names and did not run a field; among the chosen, ${A.groups.filter((g) => g.thin).map((g) => g.label).join(", ") || "none"} is thin. Names in the chosen groups with fewer than 7 Geiger rungs: ${thinNames.length ? thinNames.join(", ") : "none"}. Sectors with members under 7 rungs: ${D.sectors.filter((s) => s.lt7).map((s) => `${esc(s.label)} ${s.lt7}`).join(", ") || "none"}.</p>
  <p><b>Rule for the weights.</b> The invested part (100 minus cash) is split among the groups that ran in the proportions ${S.alloc.lead_weights.join(" : ")} for the heat's first, second and third and ${S.alloc.balance_weight} for the oversold leg; a group at or above the ${S.alloc.extended_at}th percentile of its own history keeps ${S.alloc.extended_cut * 100}% of its share and the rest goes to cash; inside a group the names that advanced share equally; a name swiped PASS gives its share to cash. No name is sized on anything but these toggles.</p></div>
  <div class="src"><b>Sources.</b> Every number above is from the blocks of steps 1 to 3 on this page, built ${D.taken.slice(0, 16).replace("T", " ")}Z from ${esc(D.sources.geiger_seven.url)} (as of ${D.sources.geiger_seven.as_of}), ${esc(D.sources.replay.url)} (${D.sources.replay.sessions} sessions to ${D.sources.replay.to}), the Hub's tables (${D.sources.tables.list.join(", ")}) and ${esc(D.sources.comps.what)}. Nothing here is advice and nothing is a trade: it is what the pipe says under the stated baselines.</div></div>`);

  document.getElementById("app").innerHTML = h.join("");
  wire();
}
const shortLabel = (k) => ({ up_a: "upside A", up_b: "upside B", up_c: "upside C", rev_g_fy: "revenue g", eps_g_fy: "EPS g", om: "op margin", fcfm: "FCF margin", nd_ebitda: "net debt", geiger: "Geiger", stretch: "stretch" }[k] || k);
function toPlayer(r) { return { ticker: r.ticker, up_a: r.up.A, up_b: r.up.B, up_c: r.up.C, rev_g_fy: r.measures.rev_g_fy, eps_g_fy: r.measures.eps_g_fy, om: r.measures.om, fcfm: r.measures.fcfm, nd_ebitda: r.measures.nd_ebitda, geiger: r.geiger, stretch: r.stretch }; }

function fieldHTML(F) {

  <div class="tw" style="max-height:620px;overflow:auto"><table class="t"><thead><tr><th class="grp" colspan="5"></th><th class="grp" colspan="4">upside to the centre</th><th class="grp" colspan="3">condition</th>${MGROUPS.map(([g, n]) => `<th class="grp" colspan="${n}">${g}</th>`).join("")}</tr>
  <tr><th class="l tk">name</th><th class="l">company</th><th>price</th><th>mkt value</th><th>set</th><th>A</th><th>B</th><th>C</th><th>spread</th><th>Geiger</th><th>rungs</th><th>stretch</th>${MEASURES.map(([k, l]) => `<th>${l}</th>`).join("")}</tr></thead><tbody>

  </tbody></table></div>

  <p><b>Where the ways disagree</b> by more than ${dis}% of the price: ${F.rows.filter((r) => r.spread != null && r.spread > dis).map((r) => `${esc(r.ticker)} ${r.spread.toFixed(0)}%`).join(", ") || "none"}. A and B share a centre by construction (the middle of the six medians); C weighs the rows by their reliability in this set.</p></div>

}
function pairHTML(R, names) {
  if (!S.pair) return `<span class="mute">Click a cell in the table of results to see the comparisons of that pairing, each with its two numbers.</span>`;
  const [a, b] = S.pair, A = names.find((n) => n.ticker === a), Bn = names.find((n) => n.ticker === b);
  if (!A || !Bn) return "";
  const g = game(A, Bn, S.cmp, { tolerance: S.ko.tolerance, min_played: S.ko.min_played });
  return `<div style="font-size:12px;margin-bottom:6px"><b class="k">${esc(a)}</b> v <b class="k">${esc(b)}</b> · ${g.winner == null ? "not played: " + esc(g.not_played_why) : g.winner === "draw" ? "a draw" : (g.winner === "A" ? a : b) + " takes it"} · points ${g.points.a} to ${g.points.b} · ${g.played} of ${g.rows.length} comparisons played</div>
  <div class="g"><span class="h">comparison</span><span class="h">${esc(a)}</span><span class="h">${esc(b)}</span><span class="h">result</span>
  ${g.rows.map((r) => { const c = S.cmp.find((x) => x.key === r.key); const f = FMT[c.fmt] || SG; return `<span>${esc(c.label)} <span class="mute">· ${c.better} wins · ×${c.weight}</span></span><span class="${r.winner === "A" ? "up" : ""}">${f(r.a)}</span><span class="${r.winner === "B" ? "up" : ""}">${f(r.b)}</span><span class="${r.played ? "" : "mute"}">${!r.played ? "not played: " + r.why : r.winner === "draw" ? "draw" : (r.winner === "A" ? a : b)}</span>`; }).join("")}</div>`;
}
function wire() {
  document.querySelectorAll("[data-set]").forEach((b) => b.addEventListener("click", () => { const [o, k] = b.dataset.set.split("."); let v = b.dataset.v; if (k === "lead_weights") v = v.split(",").map(Number); else if (k === "hide_thin") v = v === "1"; else v = Number(v); S[o][k] = v; render(); }));
  document.querySelectorAll("[data-group]").forEach((b) => b.addEventListener("click", () => { S.group = b.dataset.group; S.pair = null; render(); }));
  document.querySelectorAll("[data-ko]").forEach((b) => b.addEventListener("click", () => { const k = b.dataset.ko, f = b.dataset.k; let v = b.dataset.v; if (f === "on") v = v === "1"; else if (f === "weight") v = Number(v); S.ko.overrides[k] = { ...(S.ko.overrides[k] || {}), [f]: v }; render(); }));
  document.querySelectorAll("[data-reset]").forEach((b) => b.addEventListener("click", () => { S.ko = { overrides: {}, advance: KB.advance, tolerance: KB.tolerance, min_played: KB.min_played }; render(); }));
  document.querySelectorAll("[data-pair]").forEach((td) => td.addEventListener("click", () => { S.pair = td.dataset.pair.split("|"); render(); document.getElementById("pair").scrollIntoView({ block: "nearest" }); }));
  document.querySelectorAll("[data-swipe]").forEach((b) => b.addEventListener("click", () => swipe(b.dataset.swipe, b.dataset.v, b.dataset.g)));
}
main();
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
