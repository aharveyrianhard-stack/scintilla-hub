<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SCINTILLA · PORTFOLIO ALLOCATION</title>
<meta name="robots" content="noindex">
<style>
/* PA2 · portfolio allocation (5 Oct 2026). The Hub's look — the company tabs are the reference: dark panels, mono uppercase labels,
   no boxes around content, cyan as chrome only, direction in green/red, no sentence inside a panel (they live in PAGE SPECS). */
:root{ --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A; --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34);
  --ink:#C6C8DE; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52; --crk:#00D4FF; --bull:#00FFA3; --bear:#FF2D55; --warn:#e0a24a;
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace; --sans:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif; }
*{ box-sizing:border-box; min-width:0 }
html{ scroll-behavior:smooth; scroll-padding-top:92px }
html,body{ margin:0; background:var(--bg); color:var(--ink) }
body{ font:12px/1.45 var(--sans); padding:0 0 60px }
a{ color:var(--ink); text-decoration:none }
.wrap{ max-width:1880px; margin:0 auto; padding:0 16px }
header{ display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:12px 16px 10px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:6 }
header .brand{ font:700 11px var(--mono); letter-spacing:.18em; color:var(--crk); text-transform:uppercase; margin-left:150px }
header .brand span{ color:var(--ink3) }
header .meta{ margin-left:auto; font:10px var(--mono); letter-spacing:.06em; color:var(--dim); text-transform:uppercase; white-space:nowrap }
header .meta b{ color:var(--ink); font-weight:600 }
nav.tabs{ position:sticky; top:45px; z-index:5; background:var(--bg); border-bottom:1px solid var(--line); display:flex; gap:0; overflow-x:auto; padding:0 16px }
nav.tabs a{ flex:none; font:600 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; padding:10px 14px; color:var(--ink3); border-bottom:2px solid transparent; white-space:nowrap }
nav.tabs a.on{ color:var(--crk); border-bottom-color:var(--crk) }
h2{ font:600 11px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--ink3); margin:26px 0 10px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap }
h2 small{ font:10px var(--mono); letter-spacing:.08em; color:var(--dim); text-transform:none }
h2 .n{ margin-left:auto; font:10px var(--mono); color:var(--dim); letter-spacing:.08em }
.panel{ background:var(--panel); border:1px solid var(--line); border-radius:4px; padding:10px 12px }
.up{ color:var(--bull) } .dn{ color:var(--bear) } .flat{ color:var(--ink3) }
.err{ color:var(--bear); font:11px var(--mono); padding:16px 0 }
.age{ display:flex; flex-wrap:wrap; gap:6px 18px; font:9.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim); margin-top:8px }
.age b{ color:var(--ink3); font-weight:500 }
/* NOW — the first screen */
.now{ display:grid; grid-template-columns:minmax(300px,1fr) minmax(320px,1.1fr); gap:16px; align-items:stretch }
.now .say{ padding:18px 20px; display:flex; flex-direction:column; gap:12px }
.say .big{ font:300 56px/1 var(--mono); letter-spacing:-.02em; color:var(--ink) }
.say .big small{ font:600 11px var(--mono); letter-spacing:.2em; color:var(--dim); margin-left:8px; vertical-align:middle }
.say .cash{ font:400 24px/1 var(--mono); color:var(--ink3) } .say .cash small{ font:600 10px var(--mono); letter-spacing:.2em; color:var(--dim); margin-left:8px }
.say .read{ display:flex; flex-wrap:wrap; gap:6px 18px; font:10px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim) } .say .read b{ color:var(--ink); font-weight:600 }
.say .list{ display:grid; grid-template-columns:auto 1fr auto; gap:6px 12px; align-items:center; font:11px var(--mono); margin-top:4px }
.say .list .lbl{ letter-spacing:.14em; text-transform:uppercase; color:var(--ink3) } .say .list .lbl.cash{ font-size:11px; color:var(--dim) }
.say .list .bar{ height:6px; background:var(--line2); border-radius:2px; overflow:hidden } .say .list .bar i{ display:block; height:100%; background:var(--ink3) } .say .list .bar i.cash{ background:var(--mute) }
.say .list .v{ font-variant-numeric:tabular-nums; color:var(--ink); text-align:right }
.say .list .sub{ grid-column:1 / -1; display:flex; flex-wrap:wrap; gap:4px 14px; font:9.5px var(--mono); color:var(--dim); letter-spacing:.06em; padding-left:16px; margin:-2px 0 2px }
.say .list .sub b{ color:var(--ink3); font-weight:500 }
.say .bring{ margin-top:auto; font:9.5px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim); border-top:1px solid var(--line); padding-top:10px }
.pie{ display:flex; align-items:center; justify-content:center; padding:10px }
.pie svg{ width:100%; max-width:440px; height:auto; display:block }
.pie path{ stroke:var(--bg); stroke-width:1.2; transition:opacity .15s } .pie path:hover{ stroke:var(--crk); stroke-width:1 }
.pie text{ font:600 9.5px var(--mono); letter-spacing:.08em; fill:var(--ink); text-anchor:middle; pointer-events:none; text-transform:uppercase }
.pie text.v{ font-weight:400; fill:var(--ink); font-size:10px } .pie text.c{ font-size:8px; fill:var(--ink) }
.pie .mid{ font:300 22px var(--mono); fill:var(--ink) } .pie .midl{ font:600 8.5px var(--mono); letter-spacing:.2em; fill:var(--dim) }
/* EQUALIZER — the Hub's Equalizer look (the OPERATOR · EQUALIZER sheet): chips, a cyan slider, a baseline tick, mono labels */
.eq{ display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px 22px; padding:14px 16px }
.eq .grp{ display:flex; flex-direction:column; gap:9px; min-width:0 }
.eq .grp h3{ font:600 9.5px var(--mono); letter-spacing:.2em; text-transform:uppercase; color:var(--crk); margin:0 0 2px; display:flex; gap:8px; align-items:baseline; border-bottom:1px solid var(--line); padding-bottom:6px }
.eq .grp h3 span{ color:var(--dim); letter-spacing:.1em; font-weight:400 }
.knob{ display:grid; grid-template-columns:1fr 64px; gap:2px 10px; align-items:center }
.knob .lab{ font:9.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--ink3); grid-column:1 / -1; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap }
.knob .lab .new{ font-size:8px; letter-spacing:.14em; color:var(--bull); border:.6px solid rgba(0,255,163,.4); border-radius:10px; padding:1px 6px }
.knob .lab .was{ color:var(--dim); letter-spacing:.06em; text-transform:none }
.knob .sl{ position:relative; height:18px; display:flex; align-items:center }
.knob input[type=range]{ width:100%; margin:0; accent-color:var(--crk); height:3px; cursor:pointer; background:transparent }
.knob .tick{ position:absolute; top:13px; width:1px; height:6px; background:var(--dim); pointer-events:none }
.knob .val{ font:11px var(--mono); font-variant-numeric:tabular-nums; color:var(--ink); text-align:right; white-space:nowrap }
.knob .val.moved{ color:var(--crk) }
.knob .chips{ display:flex; border:.8px solid rgba(0,212,255,.14); grid-column:1 / -1; max-width:360px }
.knob .chips button{ flex:1; font:9px var(--mono); letter-spacing:.14em; text-transform:uppercase; padding:6px 4px; background:none; border:0; border-right:.6px solid var(--line); color:var(--dim); cursor:pointer; white-space:nowrap }
.knob .chips button:last-child{ border-right:0 } .knob .chips button.on{ color:var(--crk) }
.eqbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap; padding:12px 16px; border-top:1px solid var(--line) }
.eqbar .note{ font:8.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim) }
.eqbar button{ font:9px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--crk); background:none; border:.7px solid rgba(0,212,255,.4); border-radius:20px; padding:8px 16px; cursor:pointer }
/* HEAT — the sector name, one bar, one number, HOT / COLD */
.heat{ display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); gap:6px }
.heat .col{ padding:10px 8px 8px; border-radius:3px; background:var(--panel2); display:flex; flex-direction:column; gap:6px; align-items:center; text-align:center; min-height:96px; border:1px solid transparent }
.heat .col.hot{ border-color:rgba(0,255,163,.35) } .heat .col.cold{ border-color:rgba(255,45,85,.35) }
.heat .tag{ font:600 8px var(--mono); letter-spacing:.2em } .hot .tag{ color:var(--bull) } .cold .tag{ color:var(--bear) } .col:not(.hot):not(.cold) .tag{ visibility:hidden }
.heat .lbl{ font:600 9.5px var(--mono); letter-spacing:.12em; text-transform:uppercase; color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:100% }
.heat .bar{ width:100%; height:6px; background:var(--line2); border-radius:2px; overflow:hidden } .heat .bar i{ display:block; height:100%; background:var(--ink3) } .hot .bar i{ background:var(--bull) } .cold .bar i{ background:var(--bear) }
.heat .num{ font:400 15px var(--mono); font-variant-numeric:tabular-nums }
/* THEMES — chips: the name, the members, one Geiger number */
.themes{ display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,1fr)); gap:10px }
.theme .sec{ font:600 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--ink3); margin-bottom:6px; display:flex; gap:10px; align-items:baseline } .theme .sec span{ color:var(--dim); font-weight:400; letter-spacing:.08em }
.chips2{ display:flex; flex-wrap:wrap; gap:6px }
.chip{ display:inline-flex; align-items:baseline; gap:8px; padding:6px 10px; border-radius:3px; background:var(--panel2); border:1px solid var(--line); font:10px var(--mono); letter-spacing:.06em }
.chip b{ color:var(--ink); font-weight:600; letter-spacing:.1em; text-transform:uppercase } .chip .k{ color:var(--dim) } .chip.off{ opacity:.5 } .chip.on{ border-color:var(--hair) }
details.cold{ margin-top:10px } details.cold>summary, details.ring>summary, details.more>summary, details.disc>summary{ cursor:pointer; font:600 10px var(--mono); letter-spacing:.16em; text-transform:uppercase; color:var(--dim); padding:6px 0; list-style:none; display:flex; gap:12px; align-items:baseline; flex-wrap:wrap }
summary::-webkit-details-marker{ display:none } summary::before{ content:"▸"; color:var(--dim); margin-right:6px } details[open]>summary::before{ content:"▾" }
/* RINGS — the fundamentals table, scrolling left-to-right like the company tabs */
details.ring{ margin:8px 0 } details.ring>summary b{ color:var(--ink); letter-spacing:.14em } details.ring>summary span{ font-weight:400; letter-spacing:.08em }
.tbl{ overflow-x:auto; -webkit-overflow-scrolling:touch; border:1px solid var(--line); border-radius:4px; background:var(--panel) }
table{ border-collapse:collapse; width:100%; font:11px var(--mono); font-variant-numeric:tabular-nums; white-space:nowrap }
th{ font:600 8.5px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim); text-align:right; padding:8px 8px 6px; border-bottom:1px solid var(--line2); position:sticky; top:0; background:var(--panel) }
th.g{ color:var(--ink3); border-left:1px solid var(--line2) } td.g{ border-left:1px solid var(--line) }
td{ padding:5px 8px; text-align:right; border-bottom:1px solid var(--line); color:var(--ink) }
th:first-child, td:first-child{ text-align:left; position:sticky; left:0; background:var(--panel); z-index:1; width:34px; color:var(--dim) }
th:nth-child(2), td:nth-child(2){ text-align:left; position:sticky; left:34px; background:var(--panel); z-index:1; font-weight:600; letter-spacing:.06em }
td .pm{ display:block; font-size:9px; color:var(--dim); letter-spacing:.04em; line-height:1.1 }
td .rs{ display:inline-block; width:38px; height:3px; background:var(--line2); margin-left:6px; vertical-align:middle; border-radius:1px } td .rs i{ display:block; height:100%; background:var(--ink3) }
tr.surv td{ color:var(--ink) } tr.surv td:nth-child(2){ color:var(--bull) } tr.surv td.v{ color:var(--bull) }
tr.outl td{ color:var(--dim) } tr.outl td.v{ color:var(--warn) } tr.blank td{ color:var(--mute) } tr.out td{ color:var(--ink3) }
tr.nm td{ display:none } tr:nth-child(n+9):not(.show) td{ display:none } details.ring.all tr td{ display:table-cell } tr.outl.show td, tr.blank.show td{ display:table-cell }
.tbl .more{ padding:6px 10px; border-top:1px solid var(--line) } .tbl .more>summary{ padding:2px 0 }
/* PICKS */
.picks{ display:grid; grid-template-columns:repeat(auto-fill,minmax(400px,1fr)); gap:10px }
.pick{ padding:10px 12px; background:var(--panel); border:1px solid var(--line); border-radius:4px; display:flex; flex-direction:column; gap:6px }
.pick .t{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap } .pick .t b{ font:700 14px var(--mono); letter-spacing:.12em; color:var(--ink) } .pick .t span{ font:10px var(--mono); letter-spacing:.08em; color:var(--dim); text-transform:uppercase } .pick .t .sh{ margin-left:auto; color:var(--ink3) }
.pick .why{ font:10.5px var(--mono); color:var(--ink3); letter-spacing:.02em; line-height:1.5 }
.pick .lv{ display:flex; flex-wrap:wrap; gap:4px 16px; font:9.5px var(--mono); letter-spacing:.1em; text-transform:uppercase; color:var(--dim) } .pick .lv b{ display:block; color:var(--ink); font-weight:500; letter-spacing:.02em; text-transform:none; font-size:11px }
.pick .lv .op b{ color:var(--crk) }
/* DISCUSSION */
.disc2{ display:grid; grid-template-columns:1fr 1fr; gap:12px } .side h3{ font:600 10px var(--mono); letter-spacing:.2em; margin:4px 0 6px } .side.s h3{ color:var(--bull) } .side.w h3{ color:var(--bear) }
.row{ display:grid; grid-template-columns:20px 60px 1fr; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); font:10.5px var(--mono); color:var(--ink3); align-items:baseline } .row .no{ color:var(--dim) } .row .tk{ color:var(--ink); font-weight:600; letter-spacing:.1em }
/* PAGE SPECS */
details.sc-pagespecs{ margin-top:26px; border-top:1px solid var(--line2); padding-top:8px; color:var(--ink3); font:12px/1.55 var(--sans) }
details.sc-pagespecs>summary{ cursor:pointer; font:600 10px var(--mono); letter-spacing:.18em; text-transform:uppercase; color:var(--dim); padding:6px 0 }
details.sc-pagespecs h4{ font:600 10px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--ink3); margin:14px 0 4px }
details.sc-pagespecs p, details.sc-pagespecs li{ margin:4px 0; max-width:1100px } details.sc-pagespecs code{ font:11px var(--mono); color:var(--ink) } details.sc-pagespecs a{ color:var(--crk) }
@media (max-width:1400px){ .heat{ grid-template-columns:repeat(6,minmax(0,1fr)) } }
@media (max-width:900px){ .now{ grid-template-columns:1fr } .disc2{ grid-template-columns:1fr } .heat{ grid-template-columns:repeat(3,minmax(0,1fr)) } header .brand{ margin-left:0; width:100% } header .meta{ white-space:normal; margin-left:0 } nav.tabs{ top:0; position:sticky } header{ position:static } .say .big{ font-size:44px } .picks{ grid-template-columns:1fr } html{ scroll-padding-top:44px } }
@media (max-width:480px){ .heat{ grid-template-columns:repeat(2,minmax(0,1fr)) } .eq{ grid-template-columns:1fr } }
</style>

<body>
<header>
  <span data-scnav-slot></span>
  <span class="brand">SCINTILLA <span>· PORTFOLIO ALLOCATION</span></span>
  <span class="meta" id="meta">reading…</span>
</header>
<nav class="tabs" id="tabs"><a href="#now">NOW</a><a href="#equalizer">EQUALIZER</a><a href="#heat">HEAT</a><a href="#themes">THEMES</a><a href="#rings">RINGS</a><a href="#picks">PICKS</a><a href="#specs">SPECS</a></nav>
<div class="wrap" id="app"><div class="err" id="err" hidden></div></div>
<script type="module">
import { DIALS, fillDials, heat, knockout, dedupePicks, fullChain, howMuch, book, num } from "./chain.mjs";
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const sg = (v, d = 2) => v == null ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d);
const pc = (v, d = 0) => v == null ? "—" : (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(d) + "%";
const p1 = (v) => v == null ? "—" : (Math.round(v * 10) / 10).toFixed(1) + "%";
const xx = (v, d = 1) => v == null ? "—" : (+v).toFixed(d) + "×";
const px = (v) => v == null ? "—" : Math.abs(v) >= 1000 ? "$" + Math.round(v).toLocaleString("en-US") : "$" + (+v).toFixed(2);
const cls = (v) => v == null ? "flat" : v > 0 ? "up" : v < 0 ? "dn" : "flat";
const age = (iso) => { if (!iso) return "—"; const m = Math.round((Date.now() - Date.parse(iso)) / 60000); return m < 90 ? m + " min" : m < 2880 ? Math.round(m / 60) + " h" : Math.round(m / 1440) + " d"; };
const rsBar = (v) => v == null ? "" : `<span class="rs"><i style="width:${Math.round(v * 100)}%"></i></span>`;
const dateWords = (iso) => { const d = new Date(iso + "T12:00:00Z"); return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric", timeZone: "UTC" }); };
let DATA = null, D = fillDials(null);
try { const saved = JSON.parse(localStorage.getItem("pa2.equalizer") || "null"); if (saved) D = fillDials(saved); } catch (_) {}

/* ---- the model, under the equalizer ---------------------------------------------------------------------------- */
function run() {
  const H = heat(DATA.sectors, D), bySec = Object.fromEntries(H.ranked.map((s) => [s.key, s]));
  const kos = DATA.knockouts.filter((k) => !k.error).map((k) => { const c = DATA.cohorts.find((x) => x.id === k.cohort) || {}; const K = knockout(k.members, D); return { ...k, cohortRow: c, K }; });
  const rows = kos.flatMap((k) => k.K.members.filter((m) => m.score != null).map((m) => ({ ...m, cohort: k.cohortRow, sector_key: k.sector_key, sector: bySec[k.sector_key] || null, ko_label: k.label })));
  const own = howMuch(DATA.sectors, D), B = book(H, kos, D, own.invested);
  const picks = dedupePicks(rows.filter((r) => H.hot.includes(r.sector_key) && r.verdict === "SURVIVES")).map((r) => ({ ...r, share: B.names[r.ticker] || 0 }));
  return { H, kos, rows, picks, own, B, FC: fullChain(rows, H.ranked, D) };
}

/* ---- NOW: the answer first ----------------------------------------------------------------------------------------- */
const GREYS = ["#9496AE", "#7A7C94", "#63657B", "#4E5064", "#3C3E50"], CASHC = "#1E1F2A";
function arc(cx, cy, r0, r1, a0, a1) { const p = (r, a) => [cx + r * Math.cos(a), cy + r * Math.sin(a)]; const big = a1 - a0 > Math.PI ? 1 : 0; const [x0, y0] = p(r1, a0), [x1, y1] = p(r1, a1), [x2, y2] = p(r0, a1), [x3, y3] = p(r0, a0); return `M${x0.toFixed(2)},${y0.toFixed(2)}A${r1},${r1},0,${big},1,${x1.toFixed(2)},${y1.toFixed(2)}L${x2.toFixed(2)},${y2.toFixed(2)}A${r0},${r0},0,${big},0,${x3.toFixed(2)},${y3.toFixed(2)}Z`; }
function pieSVG(B) {
  const cx = 220, cy = 220, R = 214, R1 = 156, r1 = 146, r0 = 108, out = [], lab = [];
  const items = B.sectors.map((s, i) => ({ label: s.label, share: s.share, color: GREYS[i % GREYS.length], cohorts: s.cohorts, title: `${s.label} · ${p1(s.share)} of the book · heat #${s.heat_rank}` }));
  items.push({ label: "CASH", share: B.cash, color: CASHC, cohorts: [], title: `CASH · ${p1(B.cash)} of the book` });
  let a = -Math.PI / 2; const total = items.reduce((t, x) => t + x.share, 0) || 100;
  for (const it of items) {
    const sw = it.share / total * 2 * Math.PI; if (sw <= 0) continue; const a1 = a + sw, mid = (a + a1) / 2;
    out.push(`<path d="${arc(cx, cy, R1, R, a, a1)}" fill="${it.color}"><title>${esc(it.title)}</title></path>`);
    if (it.share / total > 0.045) { const rr = (R + R1) / 2, x = cx + rr * Math.cos(mid), y = cy + rr * Math.sin(mid); lab.push(`<text x="${x.toFixed(1)}" y="${(y - 2).toFixed(1)}">${esc(it.label)}</text><text class="v" x="${x.toFixed(1)}" y="${(y + 10).toFixed(1)}">${p1(it.share)}</text>`); }
    let b = a; const cts = it.cohorts.filter((c) => c.share > 0), ct = cts.reduce((t, c) => t + c.share, 0) || 1;
    cts.forEach((c, j) => { const cw = sw * (c.share / ct), b1 = b + cw, m2 = (b + b1) / 2, col = shade(it.color, 1 - 0.18 * (j % 3)); out.push(`<path d="${arc(cx, cy, r0, r1, b, b1)}" fill="${col}"><title>${esc(c.label)} · ${p1(c.share)} of the book · ${c.names.map((n) => n.ticker + " " + p1(n.share)).join(" · ")}</title></path>`); if (c.share / total > 0.07) { const rr = (r0 + r1) / 2, x = cx + rr * Math.cos(m2), y = cy + rr * Math.sin(m2); lab.push(`<text class="c" x="${x.toFixed(1)}" y="${(y + 3).toFixed(1)}">${esc(short(c.label))}</text>`); } b = b1; });
    a = a1;
  }
  return `<svg viewBox="0 0 440 440" role="img" aria-label="the book by sector (outer ring) and by theme (inner ring)">${out.join("")}${lab.join("")}<text class="midl" x="${cx}" y="${cy - 8}">INVESTED</text><text class="mid" x="${cx}" y="${cy + 16}">${B.invested == null ? "—" : B.invested + "%"}</text></svg>`;
}

/* ---- PAGE SPECS: every explanatory sentence, the statistics, the sources, the previous page -------------------------- */
function specsHTML(R) {

  const fences = R.kos.map((k) => `${short(k.label)}: ring standard error ${k.se ?? "—"} · rotation 72 ${sg(k.rotation, 1)} · outlier fence ${k.K.outliers.fence ? pc(k.K.outliers.fence.lo) + " … " + pc(k.K.outliers.fence.hi) : "off"} (${D.outlier_mad} MAD) · ${k.cohortRow.fallback ? "the sector's own names (no sound theme today)" : k.where}`).join("; ");
  return `<details class="sc-pagespecs" id="specs"><summary>PAGE SPECS</summary>
  <h4>What this page is</h4><p>Alan's chain (25 Sep 2026): how much to own → which sectors carry it → the themes inside them → the ring inside each theme → the names. "Fundamentals tell what to buy, the Geiger tells when." Everything on it is what the Hub already has, put in that order, under his equalizer. The page shows the model's answer under the baselines first; every knob is an assumption with a baseline; moving one re-runs the page in the browser. Nothing is written anywhere. No line calls anything oversold, extended or a buy: every level is a rank among its own peers and the entry is the operator's. How to deploy the purchases (sizes, timing, levels) is not built — Alan brings that.</p>
  <h4>What each knob does</h4><ul>
  <li><b>What counts as the market's reading</b> — AVERAGE SCORE = the mean live Geiger over every served company (${R.own.names_n} today); HOW MANY RISING = twice the share reading above zero, minus one. Both run −1 … +1.</li>
  <li><b>A flat market means this much invested</b> — the anchor: the invested share when the reading is zero.</li>
  <li><b>How hard the reading moves that number</b> — at 1.0× a full reading (+1.0) adds 50 points to the anchor, −1.0 takes 50 off; 0.5× is half that.</li>
  <li><b>Cash you always keep</b> — the invested share never passes 100 minus this.</li>
  <li><b>How many sectors carry weight</b> — the top N by heat are HOT and hold the book; the bottom N are COLD and run their rings for the discussion. Today's file read rings for 3 and 3; a higher N shows more sectors as hot but no new ring until the next read.</li>
  <li><b>The most any one sector may hold</b> — a cap on the sector's share of the book; the excess is spread over the other hot sectors in proportion to their heat; what cannot be placed stays in cash and is printed.</li>
  <li><b>How far back a sector has to prove itself</b> — the tape leg uses the fund's 72-session return against SPY (one swing cycle) or the 16-session one.</li>
  <li><b>Our names · the sector funds · the tape · the bow tie</b> — the four legs of the heat; each sector's rank on each leg (0 = coldest, 1 = hottest) is averaged with these weights. The bow tie (equal-weight fund minus the cap-weight mean; below zero the giants carry the sector) is printed on hover and ranked only when its weight is above zero.</li>
  <li><b>Themes that run a ring in each sector</b> — the K soundest themes (lowest standard error) of each hot and cold sector; today's file read 3 per sector.</li>
  <li><b>Names held in each ring</b> — how many survive the ring and go to the picks.</li>
  <li><b>Kick off the outliers</b> — a member whose comps upside sits further than this many MADs (×1.4826) from the ring's median upside is a candidate for elimination and sits out of the ranking, shown as OUTLIER (◌). The same rule C5 uses inside the field. 0 turns it off; a ring under 5 readings never fences.</li>
  <li><b>How the book splits inside a sector</b> — EQUAL: its rings split the sector's share evenly and each ring's names split evenly; TILT TO STRENGTH: rings by the mean score of their names that hold, names by their score.</li>
  <li><b>The ring's readings</b> — seven weights. Each reading becomes a rank score inside the ring (the share of the other members it beats; a member without the reading is not scored on it, never zeroed). The score is the weighted mean of the rank scores the member has. <b>The multiples against its peers</b>: C5's business-first set (≥ 15¢ of every revenue dollar in a shared line; size a soft weight; revenue segments pulled on Fly 3 Oct), the field with its own MAD-3 outliers out per measure, PEG from forward growth, and the way-C centre = the weighted median of every peer's implied price on every priced measure; the reading is the upside from today's price to that centre. <b>Growth</b> = the mean of revenue growth TTM, revenue growth next FY and EPS growth next FY (the ones on file). <b>Margins</b> = the mean of gross, operating and free-cash-flow margin. <b>Leverage</b> = net debt / EBITDA, lower is better, blank when EBITDA is not positive. <b>The analysts' target</b>: analyst_target_news, A4-cleaned (quality not quarantine, the split-checked target), each firm's newest note inside 183 days → median, low, high, count; fewer than ${DIALS.min_firms} firms is a named blank. <b>The revisions</b>: among firms with a note in the last 30 days, raised minus lowered against the same firm's previous note, over the firms that moved. <b>The Geiger against the ring</b>: the member's live Geiger minus the ring's mean — "oversold, but less than the others". Ties on the score go to the Geiger against the ring, then to the target.</li>
  <li><b>The discussion</b> — the full chain over every name that ran a ring (hot and cold): sector heat (its rank, 0 … 1) × the first weight + ring score × the second, over their sum. Five strongest, five weakest.</li></ul>
  <h4>The rings today</h4><p>${esc(fences)}.</p>
  <h4>The heat, the statistics behind the cards</h4><p>Eleven FMP sectors. Our names = the equal-weight mean of the Hub's live Geiger over the sector's served companies. The funds = the mean of three cap-weight sector funds (State Street, iShares, Vanguard). The tape = the State Street fund's ${D.lookback}-session log return minus SPY's, in points. B1's market-wide read (every computed name at the ${esc(s.b1.as_of)} close) is in the data file with its soundness verdict; THIN sectors are not used. Hover a card for the four legs.</p>
  <h4>The themes</h4><p>The Hub's tabs, the registry and T12's candidates as T12 measured them on 3 Oct, with T12's rule: ${esc(s.t12.rule)}. A theme belongs to the sector that holds at least half of its companies; otherwise it is mixed and only listed. FUNDS, INDEXES, MACRO, INTL/WORLD and CRYPTO are not company themes. When a sector has no sound theme, its own served names run as one ring (marked "our names"), with the live standard error. A chip shows the name, how many companies, and the theme's live Geiger.</p>
  <h4>The picks and the book</h4><p>The names that hold in the hot sectors' rings, kept once each with the best line. "Of the book" is the name's share of a 100 % book under the knobs above (the sector's share → its rings → its names) — a share, not a size, not money. The levels printed (today's price, the comps price low · centre · high, the target low · median · high) are the operator's inputs; the page draws no line.</p>
  <h4>Sources and ages</h4><p>Data file ${esc(DATA.today)} taken ${esc(DATA.taken)} (${DATA.elapsed_s} s, ${DATA.calls.chart_api} chart API calls, ${DATA.calls.tables} table reads, nothing written). Geiger live ${esc(s.geiger_live.as_of)} for ${s.geiger_live.symbols} symbols. Bars: ${esc(s.bars.what)}, to ${esc(s.bars.to)}. Funds: ${esc(s.funds.what)}. B1: ${esc(s.b1.what)}. T12: ${esc(s.t12.what)}. Comps: ${esc(s.comps.what)}. Fundamentals: comps.mjs components on the same read (the multiples, growth, margins, net debt / EBITDA), the peers' median beside each multiple. Targets: ${esc(s.targets.what)} — ${s.targets.rows} clean rows for ${s.targets.names} names. Universe: ${s.universe.count} served symbols, ${s.universe.companies} companies.</p>
  <h4>What could be wrong</h4><p>The live Geiger moves during the session, so the heat and the invested share move with it; the seven-rung close reading is not used. Daily bars end at the last finished session. A ring's rotation is its median member's; a sector's is its fund's. B1's read is from the ${esc(s.b1.as_of)} close and T12's soundness from 3 Oct. A comps price needs at least two business-first peers; a target needs ${DIALS.min_firms} firms; growth needs a year-before figure — each blank is named, never scored as zero. The invested share is the July MODEL sheet's heat → % invested in its simplest form (anchor + speed × reading); its five conditions and the 100/80/50/30/15 policy are not rebuilt here.</p>
  <h4>Where this lives</h4><p>Branch hub/pa1-allocation-20261005 · deliverables/20261005/pa1-allocation/ · METHOD.md beside this page · the equalizer is kept in this browser only (nothing goes to operator_weights). <a href="/allocation/">The previous page</a> (the September allocation tab) stays reachable here until 12 Oct 2026, then goes.</p></details>`;
}

/* ---- render + the equalizer's wiring ---------------------------------------------------------------------------------- */
function render(keepScroll) {
  const y = keepScroll ? scrollY : null, openRings = new Set([...document.querySelectorAll("details.ring[open]")].map((d) => d.id)), allRings = new Set([...document.querySelectorAll("details.ring.all")].map((d) => d.id)), coldOpen = [...document.querySelectorAll("details.cold")].map((d) => d.open);
  const R = run(), app = document.getElementById("app");
  app.innerHTML = nowHTML(R) + eqHTML() + heatHTML(R.H) + themesHTML(R.H, R.kos) + ringsHTML(R) + picksHTML(R) + specsHTML(R);
  if (keepScroll) { document.querySelectorAll("details.ring").forEach((d) => { if (openRings.has(d.id)) d.open = true; if (allRings.has(d.id)) d.classList.add("all"); }); document.querySelectorAll("details.cold").forEach((d, i) => { if (coldOpen[i]) d.open = true; }); }
  document.getElementById("meta").innerHTML = `${esc(DATA.today)} · Geiger <b>${age(DATA.sources.geiger_live.as_of)}</b> old · invested <b>${R.own.invested == null ? "—" : R.own.invested + "%"}</b> · hot <b>${R.H.ranked.filter((s) => R.H.hot.includes(s.key)).map((s) => s.label).join(" · ")}</b>`;
  const save = () => { try { localStorage.setItem("pa2.equalizer", JSON.stringify(D)); } catch (_) {} };
  app.querySelectorAll("input[data-knob]").forEach((el) => { const out = el.closest(".knob").querySelector(".val"), k = KNOBS.flatMap((g) => g.items).find((x) => x.id === el.dataset.knob);
    el.addEventListener("input", () => { out.textContent = (k.dec ? Number(el.value).toFixed(k.dec) : el.value) + k.unit; out.classList.toggle("moved", String(num(el.value)) !== String(get(DIALS, k.id))); });
    el.addEventListener("change", () => { const v = num(el.value); if (v == null) return; set(D, el.dataset.knob, v); save(); render(true); }); });
  app.querySelectorAll("button[data-knob]").forEach((b) => b.addEventListener("click", () => { const raw = b.dataset.val, v = num(raw) != null && /^[\d.]+$/.test(raw) ? num(raw) : raw; set(D, b.dataset.knob, v); save(); render(true); }));
  const rb = document.getElementById("reset"); if (rb) rb.addEventListener("click", () => { D = fillDials(null); try { localStorage.removeItem("pa2.equalizer"); } catch (_) {} render(true); });
  app.querySelectorAll("details.more").forEach((d) => d.addEventListener("toggle", () => { d.closest("details.ring").classList.toggle("all", d.open); d.querySelector("summary").textContent = d.open ? "fold the ring" : d.querySelector("summary").textContent; }));
  if (y != null) scrollTo(0, y);
  window.PA2 = { data: DATA, dials: D, result: R, baselines: DIALS };
}
const tabs = [...document.querySelectorAll("nav.tabs a")];
const io = new IntersectionObserver((es) => { for (const e of es) if (e.isIntersecting) { const id = e.target.id; tabs.forEach((a) => a.classList.toggle("on", a.getAttribute("href") === "#" + id)); } }, { rootMargin: "-100px 0px -78% 0px" });
const watch = () => document.querySelectorAll("h2[id], details#specs").forEach((h) => io.observe(h));
try { DATA = await (await fetch("./data-latest.json", { cache: "no-store" })).json(); render(false); watch(); }
catch (e) { const el = document.getElementById("err"); el.hidden = false; el.textContent = "the data file could not be read: " + e.message; document.getElementById("meta").textContent = "no data"; }
</script>

<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}

@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
