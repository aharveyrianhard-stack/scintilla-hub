<!doctype html><html><head><meta charset="utf-8"><title>M32 scintillation bench</title><style>
:root{
  /* surfaces */
  --bg:#0A0A0F; --panel:#0D0D14; --panel2:#0F0F1A;
  --line:#1A1A2A; --line2:#252538; --hair:rgba(0,212,255,.34); /* 0.8px cyan hairline */
  /* ink */
  --ink:#F2F2F8; --ink2:#C6C8DE; --ink3:#9A9AB6; --dim:#868AAA; --mute:#3A3A52;
  /* accents */
  --crk:#00D4FF;  /* cherenkov cyan — accent / live / headers */
  --coin:#8B5CF6; /* violet — crypto */
  /* severity scale + verdict */
  --bull:#00FFA3; --sv1:#00FFA3; --sv2:#C8FF00; --sv3:#FFE500; --sv4:#FF8A00; --sv5:#FF3060;
  --bear:#FF2D55;
  /* FEAR -> GREED (lane M27 · SENTIMENT room only). Alan, 23 Sep: "I need some more
     colour, but this is very bland." Five zones, in the order every publisher draws
     them, and nothing in the scale is white: the lightest channel here is 230. */
  --fg1:#E8384F; /* extreme fear   */
  --fg2:#E8803A; /* fear           */
  --fg3:#D6C246; /* neutral        */
  --fg4:#8CC63F; /* greed          */
  --fg5:#2FBF71; /* extreme greed  */
  /* type */
  --mono:"SF Mono","JetBrains Mono",ui-monospace,Menlo,monospace;
  --sans:ui-sans-serif,-apple-system,"Helvetica Neue",sans-serif;
  /* layout (FIX #2 — were used but undefined) */
  --radius:4px; --gap:8px;
  /* the 5 family hues (spec 01 — FIX #2) */
  --trend:#2D9CFF; --momentum:#A24BFF; --structure:#FFD400; --volume:#FF8A00; --volatility:#FF3DBE;
}
body{ background:var(--bg); color:var(--ink); font-family:var(--mono); font-size:10px; margin:0; padding:8px 14px; }
.ch{ display:grid; grid-template-columns:60px 70px 70px 1fr; gap:9px; padding:5px 0; border-bottom:.4px solid var(--line); align-items:center; }
.sc-chg.up{ color:var(--bull); } .sc-chg.dn{ color:var(--bear); }
.sc-last{ text-align:right; } .sc-chg{ text-align:right; }
#hd{ font:700 11px var(--mono); letter-spacing:.18em; color:var(--crk); padding:6px 0 10px; }
@keyframes pxfl{0%{color:var(--bull);text-shadow:0 0 8px rgba(0,255,163,.6)}100%{}}
@keyframes pxfl-dn{0%{color:var(--bear);text-shadow:0 0 8px rgba(255,45,85,.6)}100%{}}
.sc-last.fl-up{ animation:pxfl .6s; }
.sc-last.fl-dn{ animation:pxfl-dn .6s; }
@keyframes sc-scint-up{0%{color:var(--bull);text-shadow:0 0 8px rgba(0,255,163,.6)}100%{}}
@keyframes sc-scint-dn{0%{color:var(--bear);text-shadow:0 0 8px rgba(255,45,85,.6)}100%{}}
.sc-scint-up{ animation:sc-scint-up .52s ease-out; }
.sc-scint-dn{ animation:sc-scint-dn .52s ease-out; }
@media (prefers-reduced-motion:reduce){
  .sc-scint-up, .sc-scint-dn, .sc-last.fl-up, .sc-last.fl-dn{ animation:none; }
}
</style></head><body>
<div id="hd"><span data-scnav-slot></span>M32 · 364 ROWS · <span id="arm">-</span></div>
<div id="board"></div>
<script>
const fmtC    = (c) => (c >= 0 ? "+" + c.toFixed(2) + "%" : "(" + Math.abs(c).toFixed(2) + "%)");

const SCINT_MS = 520;
let SCINT_OFF = false;
let SCINT_C = null, SCINT_C_AT = 0;
function scintColors () {
  const now = Date.now();
  if (SCINT_C && now - SCINT_C_AT < 5000) return SCINT_C;
  let up = "#00ffa3", dn = "#ff2d55";
  try {
    const cs = getComputedStyle(document.documentElement);
    up = (cs.getPropertyValue("--bull") || "").trim() || up;
    dn = (cs.getPropertyValue("--bear") || "").trim() || dn;
  } catch (_) {}
  SCINT_C = { up, dn }; SCINT_C_AT = now;
  return SCINT_C;
}
let SCINT_IO = null;
function scScintVis (node) {
  if (typeof IntersectionObserver !== "function") return true;
  if (node.__scVis === undefined) {
    node.__scVis = true;
    try {
      if (!SCINT_IO) SCINT_IO = new IntersectionObserver((es) => {
        for (const e of es) e.target.__scVis = e.isIntersecting;
      }, { rootMargin: "80px" });
      SCINT_IO.observe(node);
    } catch (_) { return true; }
  }
  return node.__scVis !== false;
}
function scScint (node, up) {
  if (!node || SCINT_OFF || !scScintVis(node)) return;
  const c = scintColors();
  try {
    if (typeof node.animate === "function") {
      if (node.__scint) node.__scint.cancel();          // restart, without reading layout
      node.__scint = node.animate(
        [{ color: up ? c.up : c.dn, textShadow: "0 0 8px " + (up ? "rgba(0,255,163,.6)" : "rgba(255,45,85,.6)") }],
        { duration: SCINT_MS, easing: "ease-out" });     // implicit end frame = the cell's own style
      return;
    }
  } catch (_) {}
  const cls = up ? "sc-scint-up" : "sc-scint-dn";
  node.classList.remove("sc-scint-up", "sc-scint-dn");
  void node.offsetWidth;
  node.classList.add(cls);
}
function scScintSet (node, value, up) {
  if (!node) return false;
  const str = String(value);
  if (node.textContent === str) return false;
  node.textContent = str;
  if (up === true || up === false) scScint(node, up);
  return true;
}

const N = 364, rows = [];
const board = document.getElementById("board");
for (let i = 0; i < N; i++) {
  const t = "SYM" + String(i).padStart(3, "0");
  const d = document.createElement("div"); d.className = "ch";
  d.innerHTML = '<span>' + t + '</span><span class="sc-last" id="lp_' + t + '">100.00</span>' +
    '<span class="sc-chg up" id="lc_' + t + '">+0.00%</span><span></span>';
  board.appendChild(d);
  rows.push({ t, px: 100, c: 0, lp: d.children[1], lc: d.children[2] });
}
let seed = 7; const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
/* every tick moves ~70% of the rows, which is what a live 2 s tick does mid-session */
function nextValues() {
  for (const r of rows) { if (rnd() < 0.7) { r.prev = r.px; r.prevC = r.c; r.px = +(r.px * (1 + (rnd() - .5) * .01)).toFixed(4); r.c = +(r.c + (rnd() - .5) * .4).toFixed(4); } else { r.prev = null; } }
}
const ARMS = {
  none(r) {                                            // floor: the same writes, no glow at all
    if (r.prev == null) return;
    const s = r.px.toFixed(2); if (r.lp.textContent !== s) r.lp.textContent = s;
    const c = fmtC(r.c); if (r.lc.textContent !== c) r.lc.textContent = c;
  },
  before(r) {                                          // the SHIPPED path, verbatim: price only, class + forced reflow
    if (r.prev == null) return;
    r.lp.textContent = r.px.toFixed(2);
    const fl = r.px > +r.prev ? "fl-up" : "fl-dn";
    r.lp.classList.remove("fl-up", "fl-dn"); void r.lp.offsetWidth; r.lp.classList.add(fl);
    const c = fmtC(r.c); if (r.lc.textContent !== c) r.lc.textContent = c;
  },
  after(r) {                                           // M32: price AND percentage, through the primitive
    if (r.prev == null) return;
    scScintSet(r.lp, r.px.toFixed(2), r.prev != null && +r.prev !== r.px ? r.px > +r.prev : null);
    scScintSet(r.lc, fmtC(r.c), r.prevC != null && r.c !== r.prevC ? r.c > r.prevC : null);
  },
};
window.__tick = (arm) => { document.getElementById("arm").textContent = arm.toUpperCase(); nextValues(); const f = ARMS[arm]; for (const r of rows) f(r); };
window.__glow = () => { for (let i = 0; i < 12; i++) { const r = rows[i * 7]; r.prev = r.px; r.prevC = r.c; r.px += (i % 2 ? -1 : 1) * 0.37; r.c += (i % 2 ? -1 : 1) * 0.31; ARMS.after(r); } };
window.__reduced = (v) => { SCINT_OFF = !!v; };
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
</body></html>
