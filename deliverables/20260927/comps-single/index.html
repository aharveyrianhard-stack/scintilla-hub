<script type="module">
import { COMPONENTS, GROUPS, component, VALUATION, CARD_KEYS, buildInputs, components, compsRead, rowScale, fmt, basisWord, cohortFor } from "./comps.mjs";
import { propose, GROUND_UP_READ, SMALL_FLOOR_PCT, greyingPrefs } from "./alloc.mjs";
import { DEFAULT_PREFS, fit, capClass, dateWord, tsToISO, num, themeWord } from "../../20260925/knockout/field.mjs";

/* ---- where the reads go (the K1 workshop's own path) ------------------------------------------ */
const SB = "https://wadinxqplrggagkvrdag.supabase.co";
const LOCAL = ["localhost", "127.0.0.1"].includes(location.hostname);
const API = window.SC_CHART_API || "https://scintilla-massive-chart-api.fly.dev";
let KEY = null;
async function readKey() {           // the same runtime discovery the K1 workshop and the allocation sub-page use; nothing is stored in this file
  if (window.SC_ANON_KEY) return (KEY = window.SC_ANON_KEY);
  for (const page of ["/pip.html", "/index.html"]) {
    try {
      const t = await (await fetch(page, { cache: "no-store" })).text();
      const m = t.match(/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.[A-Za-z0-9_.\-]+/);
      if (m) return (KEY = m[0]);
    } catch (_) {}
  }
  return null;
}
async function pg(path) {
  const r = await fetch(SB + "/rest/v1/" + path, { headers: { apikey: KEY, Authorization: "Bearer " + KEY } });
  if (!r.ok) throw new Error(path.split("?")[0] + " → " + r.status);
  return r.json();
}
async function api(path) { const r = await fetch(API + path); if (!r.ok) throw new Error(path.split("?")[0] + " → " + r.status); return r.json(); }

/* ---- state ------------------------------------------------------------------------------------ */
const Q = new URLSearchParams(location.search);
const TODAY = new Date().toLocaleDateString("en-CA", { timeZone: "America/New_York" });
const daysAgo = (n) => new Date(Date.parse(TODAY + "T00:00:00Z") - n * 86400e3).toISOString().slice(0, 10);
const lsGet = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k) || "null"); return v == null ? d : v; } catch (_) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (_) {} };
const TICKER = (Q.get("t") || "GEV").toUpperCase().replace(/[^A-Z0-9.\-]/g, "");
const S = {
  ticker: TICKER, cohortAsked: Q.get("cohort"), cohort: null, cohortOptions: [], members: [], src: new Map(), today: TODAY,
  out: new Set(lsGet("k2.out." + TICKER, [])), nm: lsGet("k2.nm", true), use: Q.get("use") === "full" ? "full" : lsGet("k2.use", "mid"),
  over: lsGet("k2.alloc", {}), smallFloor: lsGet("k2.floor", SMALL_FLOOR_PCT),
  prefs: (() => { const p = lsGet("k1.prefs", null); return p && typeof p === "object" ? { ...JSON.parse(JSON.stringify(DEFAULT_PREFS)), ...p } : JSON.parse(JSON.stringify(DEFAULT_PREFS)); })(),   // K1's saved rules: read, never written here
  spread: null, spreadDate: null, mode: null, fixture: LOCAL && Q.get("fixture") === "layout", sources: [], quotesErr: null,
};
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const pct = (x) => (Math.max(0, Math.min(1, x)) * 100).toFixed(2) + "%";
const SIZE = ["MEGA_CAP", "MEGACAP", "LARGE_CAP", "MID_CAP", "SMALL_CAP", "BLUE_CHIP"];

/* ---- reads ------------------------------------------------------------------------------------- */
async function load() {
  if (LOCAL) return snapshot();
  return live();
}

/* On the Hub: the tables K1 already reads, plus the three history tables the company page already reads
   (fundamentals_history, cashflow_history, balance_history). */
async function live() {
  if (!(await readKey())) throw new Error("no read key could be found on this site");
  S.mode = "LIVE";
  const own = await pg(`ticker_cohorts?select=ticker,cohort&ticker=eq.${encodeURIComponent(S.ticker)}`);
  const ownTags = [...new Set(own.map((x) => x.cohort))];
  S.cohort = cohortFor(S.ticker, ownTags, S.cohortAsked);

function fixtureHistory(src) {
  let h = 7; for (const c of src.ticker) h = (h * 31 + c.charCodeAt(0)) % 2147483647;
  const rnd = () => (h = (h * 48271) % 2147483647) / 2147483647;
  const rev = num(src.fundamentals.revenue_ttm) || 1e9;
  const g = rnd() * 0.12 - 0.01, gm = 0.18 + rnd() * 0.45, om = gm * (0.2 + rnd() * 0.6), eb = om + 0.03 + rnd() * 0.08, cx = 0.03 + rnd() * 0.22, cg = rnd() * 0.14 - 0.02;
  const ends = ["2026-06-30", "2026-03-31", "2025-12-31", "2025-09-30", "2025-06-30", "2025-03-31", "2024-12-31", "2024-09-30"];
  const w = [0, 1, 2, 3].reduce((s, i) => s + Math.pow(1 + g, -i), 0);
  src.incQ = ends.map((d, i) => { const r = rev / w * Math.pow(1 + g, -i); return { period: "Q" + (4 - (i % 4)), fiscal_date: d, revenue: r, gross_profit: r * gm, operating_income: r * om, ebitda: r * eb }; });

  src.incFY = [2021, 2022, 2023, 2024, 2025].map((y, i) => ({ fiscal_year: y, fiscal_date: y + "-12-31", revenue: rev * Math.pow(1 + g * 4, i - 4) }));
}

  const b = r.band;

  if (b.n === 0 && r.value == null) return `<div class="frow na"><div class="m">${esc(r.label)}<small>${esc(c.basis)}</small></div><div class="track">no peer and no ${esc(me.ticker)} number: ${esc(r.why || "")}</div><div class="ends"></div></div>`;
  const offVals = [];
  const inputs = inputsOf();
  for (const t of all) if (S.out.has(t)) { const i = inputs.find((x) => x.ticker === t); if (i) offVals.push({ ticker: t, value: components(i).v[r.key] }); }
  const sc = rowScale(b.n ? b : { min: r.value, max: r.value }, r.value);
  const scAll = rowScale({ min: Math.min(...[b.min, ...offVals.map((o) => o.value)].filter((v) => v != null)), max: Math.max(...[b.max, ...offVals.map((o) => o.value)].filter((v) => v != null)) }, r.value) || sc;
  const X = scAll.x;
  const peersDots = [...r.peers.map((p) => ({ ...p, off: false })), ...offVals.map((p) => ({ ...p, off: true }))]
    .filter((p) => p.value != null).sort((a, z) => a.value - z.value)
    .map((p, i, arr) => { const side = i % 2, x = X(p.value), prev = arr[i - 2]; const crowd = prev && Math.abs(X(prev.value) - x) < 0.035; return { ...p, side, crowd }; })
    .map((p) => `<button class="pd ${p.side ? "b" : "a"} ${p.off ? "off" : ""} ${p.crowd ? "nol" : ""}" data-act="peer" data-v="${esc(p.ticker)}" style="left:${pct(X(p.value))}" title="${esc(p.ticker)} ${fmt(c.fmt, p.value)}${p.off ? " — out, click to bring back" : " — click to take out"}"><span>${esc(p.ticker)}</span></button>`).join("");
  const range = b.n ? `<i class="rng" style="left:${pct(X(b.min))};width:${pct(Math.max(0.006, X(b.max) - X(b.min)))}"></i><i class="iq" style="left:${pct(X(b.q1))};width:${pct(Math.max(0.006, X(b.q3) - X(b.q1)))}"></i><i class="med" style="left:${pct(X(b.median))}"></i>` : "";
  const vc = verdictClass(r.verdict.side);
  const meDot = r.value != null ? `<span class="me ${vc}" style="left:${pct(X(r.value))}" title="${esc(me.ticker)} ${fmt(c.fmt, r.value)}"></span>` : "";
  const missing = (r.missing.length ? ` · no number: ${r.missing.map(esc).join(", ")}` : "") + (r.nm && r.nm.length ? ` · set aside as NM: ${r.nm.map((x) => esc(x.ticker) + " " + fmt(c.fmt, x.value)).join(", ")}` : "");
  const ends = r.value != null
    ? `<b class="${vc}">${fmt(c.fmt, r.value)}</b> ${esc(me.ticker)} · median ${fmt(c.fmt, b.median)}<em class="${vc}">${esc(r.verdict.word)}</em>`
    : `<b class="neu">—</b> ${esc(me.ticker)} · median ${fmt(c.fmt, b.median)}<em>${esc(r.why || "")}</em>`;
  return `<div class="frow"><div class="m">${esc(r.label)}<small>${esc(c.basis)} · ${b.n} peer${b.n === 1 ? "" : "s"}${missing}</small></div>
    <div class="track sc-clip"><i class="base"></i>${range}${peersDots}${meDot}</div><div class="ends">${ends}</div></div>`;
}

/* ---- CapEx: who is getting results ---- */
function capexHTML(me, all, read) {
  const pts = all.filter((i) => !i.is_etf).map((i) => ({ t: i.ticker, ...components(i).v, off: S.out.has(i.ticker) })).filter((p) => p.capex_g != null && p.rev_g_ttm != null);
  let scatter;
  if (pts.length < 2) {
    scatter = `<p class="cxnote">${pts.length ? "Only one company" : "No company"} of this cohort has two years of revenue and CapEx on ${S.mode === "LIVE" ? "file" : "this render"}, so there is nothing to plot yet. ${S.mode === "SNAPSHOT" ? "The snapshot does not carry the cash-flow history; the Hub page reads cashflow_history live." : ""}</p>`;
  } else {
    const xs = pts.flatMap((p) => [p.capex_g, p.rev_g_ttm]).concat([0]);
    let lo = Math.min(...xs), hi = Math.max(...xs); const pad = (hi - lo) * 0.1 || 5; lo = Math.max(-60, lo - pad); hi = Math.min(150, hi + pad);   // an outlier is pinned to the edge, its label keeps the true number
    const P = (v) => (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo);
    const clipped = (p) => p.capex_g < lo || p.capex_g > hi || p.rev_g_ttm < lo || p.rev_g_ttm > hi;
    const ticks = niceTicks(lo, hi, 4);
    scatter = `<div class="sc">
      <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><line x1="0" y1="100" x2="100" y2="0" stroke="#474C6A" stroke-width="1.5" stroke-dasharray="4 4" vector-effect="non-scaling-stroke"/></svg>
      <i class="zero" style="left:${pct(P(0))};top:0;bottom:0;width:1px"></i><i class="zero" style="bottom:${pct(P(0))};left:0;right:0;height:1px"></i>
      ${ticks.map((v) => `<span class="ax" style="left:${pct(P(v))};bottom:-18px;transform:translateX(-50%)">${fmt("pct", v)}</span><span class="ax" style="bottom:${pct(P(v))};left:-40px;transform:translateY(50%)">${fmt("pct", v)}</span>`).join("")}
      ${pts.map((p) => `<span class="dot ${p.t === me.ticker ? "me" : ""} ${p.results > 0 ? "good" : "bad"} ${P(p.capex_g) > 0.62 ? "l" : ""}" style="left:${pct(P(p.capex_g))};bottom:${pct(P(p.rev_g_ttm))};transform:translateY(50%)${p.off ? ";opacity:.35" : ""}" title="${esc(p.t)}: revenue ${fmt("pct", p.rev_g_ttm)}, CapEx ${fmt("pct", p.capex_g)} → ${fmt("pp", p.results)}"><span>${esc(p.t)} ${fmt("pp", p.results)}${clipped(p) ? ` (rev ${fmt("pct", p.rev_g_ttm)}, CapEx ${fmt("pct", p.capex_g)}, off the chart)` : ""}</span></span>`).join("")}
    </div><div class="cxnote">Across: CapEx growth over the last twelve months. Up: revenue growth over the same months. The dashed line is where the two grow alike; up and to the left of it, sales are growing faster than the spending; a name above it is getting results from what it spends (green), below it is spending ahead of its sales (red) — which in a build-out is not a verdict, only a question of how long.</div>`;
  }
  const fy = me.capexFY;
  let trend;
  if (!fy.length) trend = `<p class="cxnote">No CapEx by fiscal year for ${esc(me.ticker)} on ${S.mode === "LIVE" ? "file (cashflow_history, period FY)" : "this render — the snapshot does not carry cashflow_history"}.</p>`;
  else {
    const mx = Math.max(...fy.map((y) => y.capex));
    trend = `<div class="bars">${fy.map((y, i) => { const d = i ? (y.capex / fy[i - 1].capex - 1) * 100 : null; return `<div class="b"><b>${fmt("money", y.capex)}</b><small>${d == null ? "" : fmt("pct", d)}</small><i class="${d == null ? "" : d >= 0 ? "good" : "bad"}" style="height:${(y.capex / mx * 120).toFixed(1)}px" title="FY${esc(y.year)} CapEx ${fmt("money", y.capex)}${y.revenue ? " · " + fmt("pct", y.capex / y.revenue * 100) + " of revenue" : ""}"></i></div>`; }).join("")}</div>
      <div class="barx">${fy.map((y) => `<span>FY${esc(y.year)}<br>${y.revenue ? fmt("pct", y.capex / y.revenue * 100).replace("+", "") + " of rev" : ""}</span>`).join("")}</div>`;
  }
  const r = (k) => read.rows.find((x) => x.key === k);
  const line = ["capex", "capex_rev", "capex_g", "results", "rev_per_capex"].map((k) => `${esc(component(k).label)} <b class="${verdictClass(r(k).verdict.side)}">${fmt(component(k).fmt, r(k).value)}</b> (peer median ${fmt(component(k).fmt, r(k).band.median)})`).join(" · ");
  return `<h2>CapEx — who is actually getting results<small>how much each company is investing, and whether its sales are keeping up</small></h2>
    <div class="panel cx"><div><span class="lbl">the cohort · revenue growth against CapEx growth, TTM</span>${scatter}</div>
    <div><span class="lbl">${esc(me.ticker)} · CapEx by fiscal year, the colour is the change on the year before</span>${trend}<p class="cxnote">${line}.</p></div></div>`;
}

/* ---- the allocation default and its dials ---- */
function allocHTML() {
  const p = proposal();
  return `<h2>the cards<small>every name of ${esc(themeWord(S.cohort))}, each priced against the others; greyed by the allocation read below</small></h2>
    <div class="panel alloc"><div id="allocSay">${allocSayHTML(p)}</div>
    <div>
      <div class="dial"><div class="row"><span>RISK LEVEL</span><b id="dR">${esc(p.riskName)}</b></div><input type="range" min="0" max="2" step="0.25" value="${p.R}" data-dial="R" aria-label="risk level"><div class="ticks"><span>conservative</span><span>balanced</span><span>aggressive</span></div></div>
      <div class="dial"><div class="row"><span>LARGE / SMALL</span><b id="dL">${Math.round(p.lc)} / ${Math.round(p.sc)}</b></div><input type="range" min="10" max="90" step="5" value="${Math.round(p.lc)}" data-dial="lc" aria-label="large-cap share"><div class="ticks"><span>10 large</span><span>50 / 50</span><span>90 large</span></div></div>
      <div class="dial"><div class="row"><span>SMALLEST SMALL-CAP SLEEVE THAT HOLDS A NAME</span><b id="dF">${S.smallFloor}%</b></div><input type="range" min="0" max="50" step="5" value="${S.smallFloor}" data-dial="floor" aria-label="small sleeve floor"></div>
      <button class="reset" data-act="reset">BACK TO THE PROPOSAL</button>
    </div></div>`;
}
function allocSayHTML(p) {
  const r = GROUND_UP_READ;
  return `<span class="lbl">the proposal · from the allocation tool's GROUND UP read</span>
    <div class="big"><div>condition<b>${esc(r.condition.toLowerCase())}</b>${Math.round(r.pct * 100)}th pct · ${esc(dateWord(r.date))}</div><div>invested<b>${p.invested == null ? "—" : Math.round(p.invested) + "%"}</b>${esc(p.riskName)}</div><div>large / small<b>${Math.round(p.lc)} / ${Math.round(p.sc)}</b>${p.overridden ? "your dials" : "proposed"}</div></div>
    <p class="say">${p.why.map(esc).join(" ")}</p>
    <div class="stale">GROUND UP's read is carried from ${esc(dateWord(r.date))}: it computes in the browser and stores nothing, so this page cannot refresh it. And ${esc(r.stale)}. ${S.spread != null ? `The IWM − SPY spread here is ${S.spread >= 0 ? "+" : "−"}${Math.abs(S.spread).toFixed(3)} from composite_staged, written ${esc(dateWord(S.spreadDate))}.` : "No IWM − SPY spread was read, so the blend sits on the grid."}</div>`;
}

/* ---- card v2 ---- */
function cardsHTML(all) {
  const p = proposal();
  return `<div class="cards">${all.filter((i) => !i.is_etf).map((i) => cardHTML(i, all, p)).join("")}</div>`;
}
function cardHTML(inp, all, p) {
  const read = compsRead(inp, all, { out: S.out, use: S.use, nm: S.nm });
  const g = greyOf(inp, p);
  const cap = capClass(inp.tags, inp.mcap_on_file);
  const b = read.band, f = read.fair;
  let mini = "";
  if (b.lo != null && inp.price) {
    const lo = Math.min(b.lo, inp.price) * 0.85, hi = Math.max(b.hi, inp.price) * 1.1, X = (v) => (v - lo) / (hi - lo);
    mini = `<div class="mini"><i class="fvbar" style="left:${pct(X(b.lo))};width:${pct(Math.max(0.01, X(b.hi) - X(b.lo)))}"></i><i class="p" style="left:${pct(X(inp.price))}"></i></div>`;
  }
  const fvl = b.lo != null ? `fair value <b>${fmt("price", b.lo)} – ${fmt("price", b.hi)}</b> · price <span class="${f.where === "below" ? "good" : f.where === "above" ? "bad" : "neu"}">${f.where} (${fmt("pct", f.toMid)} to the middle)</span> · ${b.count} of ${b.of} rows` : `fair value — ${esc(b.reason || "")}`;
  const eight = CARD_KEYS.map((k) => {
    const r = read.rows.find((x) => x.key === k), c = component(k);
    return `<div><div class="n">${esc(shortLabel(k))}</div><b class="${r.value == null ? "neu" : verdictClass(r.verdict.side)}">${fmt(c.fmt, r.value)}</b><small>${r.value == null ? esc(shortWhy(r.why)) : "peers " + fmt(c.fmt, r.band.median)}</small></div>`;
  }).join("");
  const fy = inp.capexFY;
  const mx = fy.length ? Math.max(...fy.map((y) => y.capex)) : 0;
  const trend = fy.length ? `<div class="trend"><span class="lbl">CapEx by fiscal year</span><div class="tb">${fy.map((y, i) => `<span title="FY${esc(y.year)} ${fmt("money", y.capex)}"><i class="${i ? (y.capex >= fy[i - 1].capex ? "good" : "bad") : ""}" style="height:${(y.capex / mx * 40).toFixed(1)}px"></i></span>`).join("")}</div><div class="tbx">${fy.map((y) => `<span>${esc(String(y.year).slice(2))}·${fmt("money", y.capex).replace("$", "")}</span>`).join("")}</div></div>`
    : `<div class="trend"><span class="lbl">CapEx by fiscal year</span><div class="tbx"><span style="text-align:left">no cash-flow history on ${S.mode === "LIVE" ? "file" : "this render"}</span></div></div>`;
  const nr = inp.next_report ? ` · reports ${esc(dateWord(inp.next_report.date))}` : "";
  const why = g.in ? `<span class="tag in">PLAYS</span>${esc((g.care || []).join(" ") || "")}` : `<span class="tag">GREYED</span>${esc(g.why[0] || "")}`;
  return `<div class="card ${g.in ? "" : "grey"} ${inp.ticker === S.ticker ? "subj" : ""}">
    <div class="hd"><button data-act="go" data-v="${esc(inp.ticker)}" title="open ${esc(inp.ticker)} on this page">${esc(inp.ticker)}</button><span class="cap">${esc(cap.label)}${nr}</span><span class="px">${fmt("price", inp.price)}</span></div>
    <div class="nm">${esc(inp.name || "")}</div>
    <div class="fvl">${fvl}</div>${mini}
    <div class="eight">${eight}</div>${trend}
    <div class="why">${why}</div></div>`;
}
const SHORT = { pe_fwd: "P/E fwd", ev_ebitda: "EV/EBITDA", rev_g_ttm: "rev gr TTM", om: "op margin", fcfm: "FCF margin", capex_rev: "CapEx/rev", results: "rev − CapEx gr", nd_ebitda: "ND/EBITDA" };
const shortLabel = (k) => SHORT[k] || component(k).label;
const shortWhy = (w) => !w ? "" : /history|cash-flow/.test(w) ? "needs history" : /not positive|grow/.test(w) ? "not positive" : /estimate/.test(w) ? "no estimate" : "missing";

/* ---- the annex: the full table, as the footer of the section ---- */
function annexHTML(me, all, read) {
  const order = [me, ...all.filter((i) => i.ticker !== me.ticker && !i.is_etf)];
  const head = `<tr><th>company</th>${COMPONENTS.map((c) => `<th title="${esc(c.basis)}">${esc(c.label)}</th>`).join("")}<th>price</th><th>history basis</th></tr>`;
  const body = order.map((i) => {
    const v = components(i).v;
    return `<tr class="${i.ticker === me.ticker ? "subj" : ""} ${S.out.has(i.ticker) ? "off" : ""}"><td>${esc(i.ticker)}</td>${COMPONENTS.map((c) => `<td>${fmt(c.fmt, v[c.key])}</td>`).join("")}<td>${fmt("price", i.price)}<br><small>${esc(dateWord(i.price_date))}</small></td><td>${esc(basisWord(i.rev))}</td></tr>`;
  }).join("");
  const med = `<tr class="medrow"><td>peer median</td>${read.rows.map((r) => `<td>${fmt(component(r.key).fmt, r.band.median)}</td>`).join("")}<td></td><td>${read.peersIn.length} peers</td></tr>`;
  const src = S.sources.map((s) => `<tr><td>${esc(s[0])}</td><td>${esc(s[1])}</td><td>${esc(s[2])}</td></tr>`).join("");
  return `<div class="annex"><h2>annex · the full table<small>every company of the cohort on every component; the peer median excludes ${esc(me.ticker)} and any name taken out</small></h2>
    <div class="scroll"><table class="tbl">${head}${body}${med}</table></div>
    <div class="src"><span class="lbl">where each number comes from · measured dates</span><table>${src}</table></div></div>`;
}

/* ---- interaction ---- */
function go(t) { const u = new URL(location.href); u.searchParams.set("t", t); u.searchParams.delete("cohort"); location.href = u.toString(); }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, v = b.dataset.v;
  if (act === "go") return go(v);
  if (act === "use") { S.use = v; lsSet("k2.use", v); return render(); }
  if (act === "nm") { S.nm = v === "1"; lsSet("k2.nm", S.nm); return render(); }
  if (act === "peer") { if (S.out.has(v)) S.out.delete(v); else S.out.add(v); lsSet("k2.out." + S.ticker, [...S.out]); return render(); }
  if (act === "reset") { S.over = {}; S.smallFloor = SMALL_FLOOR_PCT; lsSet("k2.alloc", S.over); lsSet("k2.floor", S.smallFloor); return render(); }
});
document.addEventListener("submit", (e) => { const f = e.target.closest("[data-form=go]"); if (!f) return; e.preventDefault(); const t = String(new FormData(f).get("t") || "").trim().toUpperCase(); if (t) go(t); });
document.addEventListener("input", (e) => {
  const d = e.target.dataset && e.target.dataset.dial; if (!d) return;
  const val = +e.target.value;
  if (d === "R") S.over = { ...S.over, R: val };
  if (d === "lc") S.over = { ...S.over, lc: val };
  if (d === "floor") { S.smallFloor = val; lsSet("k2.floor", val); }
  lsSet("k2.alloc", S.over);
  const p = proposal();                 // the sliders stay put; only the words and the cards redraw
  document.getElementById("dR").textContent = p.riskName;
  document.getElementById("dL").textContent = Math.round(p.lc) + " / " + Math.round(p.sc);
  document.getElementById("dF").textContent = S.smallFloor + "%";
  document.getElementById("allocSay").innerHTML = allocSayHTML(p);
  document.getElementById("cardsBody").innerHTML = cardsHTML(inputsOf());
});

load().then(render).catch((e) => {
  document.getElementById("app").className = "";
  document.getElementById("app").innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
  document.getElementById("stamp").textContent = "not read";
});
</script>
<!-- scnav · one way back and one way out on every Hub sub-page. Source: scripts/scnav-snippet.html, placed by
     scripts/inject-scnav.py (and by build-prototypes-index.py for the library itself). Inline on purpose: the library pages
     must stay self-contained, and it is monochrome like the rest of Scintilla. 23 Sep, Alan: "I don't have a back button. I don't have a close button. I'm stuck." The Hub
     runs as an installed app with no browser toolbar, so every page it opens has to carry its own way out. -->
<style id="scnav-css">
.scnav{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:10px;z-index:99999;display:flex;gap:6px;font:600 11px/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;letter-spacing:.16em;text-transform:uppercase}
.scnav.is-inline{position:static;z-index:auto}
.scnav button{-webkit-appearance:none;appearance:none;cursor:pointer;display:inline-flex;align-items:center;gap:7px;height:30px;margin:0;padding:0 12px;background:rgba(10,11,13,.92);color:#9a9ea3;border:1px solid rgba(150,154,160,.35);border-radius:3px;box-shadow:0 2px 14px rgba(0,0,0,.45);font:inherit;letter-spacing:inherit;text-transform:inherit}
.scnav button:hover,.scnav button:focus-visible{color:#c4c7cb;border-color:rgba(190,194,198,.75);outline:none}
.scnav i{font-style:normal;color:#c4c7cb}
@media print{.scnav{display:none}}
</style>
<script>
/* BACK: the page you came from on this site; with none, the Prototypes library (library pages) or the Hub.
   CLOSE: the Hub. Nothing is stored and nothing is requested. */
(function () {
  if (window.top !== window || document.querySelector(".scnav")) return;   // inside another page, or already drawn
  var p = location.pathname, lib = !!p.match(/^\/(deliverables|prototypes)\//) && !p.match(/^\/prototypes\/(index\.html)?$/);
  function cameFromHere() { try { var r = new URL(document.referrer); return r.origin === location.origin && r.pathname !== p; } catch (e) { return false; } }
  var n = document.createElement("nav");
  n.className = "scnav"; n.setAttribute("aria-label", "Leave this page");
  n.innerHTML = '<button type="button" data-go="back" title="Back to the page you came from"><i>←</i>BACK</button>' +
                '<button type="button" data-go="close" title="Close this page and return to the Hub"><i>✕</i>CLOSE</button>';
  n.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    if (b.getAttribute("data-go") === "back" && history.length > 1 && cameFromHere()) { history.back(); return; }
    location.href = b.getAttribute("data-go") === "back" && lib ? "/prototypes/" : "/";
  });
  var slot = document.querySelector("[data-scnav-slot]");
  if (slot) { n.className += " is-inline"; slot.appendChild(n); } else document.body.appendChild(n);
})();
</script>
<!-- /scnav -->
</body></html>
