<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="referrer" content="no-referrer">
  <title>X · Desk — SCINTILLA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./desk.css">
</head>
<body>
  <header class="desk-header">
    <div class="header-inner">
      <nav class="tabs" aria-label="X feed views">
        <button class="on" type="button" data-view="trading" aria-pressed="true">Trading</button>
        <button type="button" data-view="notifications" aria-pressed="false">Notifications</button>
        <button type="button" data-view="video" aria-pressed="false">Video</button>
        <span class="day" id="day">X · Desk</span>
      </nav>
      <div class="refresh-row">
        <span id="feed-status" role="status">Connecting to feed…</span>
        <button id="refresh-feed" type="button">Refresh</button>
        <button id="show-updates" type="button" hidden>Show new posts</button>
      </div>
      <details class="receipt" id="receipt">
        <summary id="receipt-summary">Loading collection receipt…</summary>
        <div id="receipt-content"></div>
      </details>
    </div>
  </header>
  <main id="main">
    <p class="state" id="state" role="status">Loading trading posts…</p>
    <ol id="tape" aria-label="Trading posts" aria-busy="true"></ol>
    <noscript><p class="state">Enable JavaScript to read this desk.</p></noscript>
  </main>
  <dialog id="media-dialog" aria-labelledby="media-title">
    <div class="dialog-bar">
      <h2 id="media-title">Media</h2>
      <button class="close" id="close-media" type="button" aria-label="Close media">Close <span aria-hidden="true">×</span></button>
    </div>
    <div id="media-content"></div>
    <p class="media-note" id="media-note"></p>
  </dialog>
  <script type="module" src="./desk.mjs"></script>
</body>
</html>
